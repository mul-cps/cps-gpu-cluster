# Note: Storage classes are already configured and managed outside of Fleet
# Removing them from Fleet management to avoid conflicts
#
# nfs-client does NOT exist (confirmed live 2026-07-06) -- it was removed at
# some point without a documented replacement path. Released PVs from it
# still exist as evidence, but the StorageClass itself is gone. Use
# longhorn/longhorn-fast/longhorn-overcommit/longhorn-static for general
# persistent storage, or fast-scratch for local-path NVMe scratch.
#
# fast-scratch - created via kubectl apply
# longhorn/longhorn-fast/longhorn-overcommit/longhorn-static - via the
# longhorn bundle in system/storage/longhorn/
