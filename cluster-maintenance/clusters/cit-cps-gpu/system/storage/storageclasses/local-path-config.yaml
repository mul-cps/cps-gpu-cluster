apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
  annotations:
    # Handover stage 1: once Fleet has recorded this annotation, a later Helm
    # upgrade can omit the K3s-owned ConfigMap without deleting it. Keep this
    # annotation in the source until a separate, gated stage-2 change.
    helm.sh/resource-policy: keep
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s/storage"]
        },
        {
          "node": "k3s-wk-gpu1",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu2",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu3",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu4",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        }
      ]
    }
