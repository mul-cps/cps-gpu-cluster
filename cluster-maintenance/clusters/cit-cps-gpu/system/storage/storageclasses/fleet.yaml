# Storage classes configuration
name: storage-classes

# Labels for bundle identification
labels:
  app: storage-classes
  name: storage-classes

# Skip existing resources to avoid conflicts with externally managed storage classes
diff:
  comparePatches:
  - apiVersion: storage.k8s.io/v1
    kind: StorageClass
    name: nfs-client
    operations:
    - {"op": "remove", "path": "/metadata"}
  - apiVersion: storage.k8s.io/v1
    kind: StorageClass
    name: fast-scratch
    operations:
    - {"op": "remove", "path": "/metadata"}

# Don't fail if resources already exist
helm:
  skipDryRun: true
  # K3s's local-storage addon owns this ConfigMap and can re-apply its
  # stock one-path configuration after a control-plane change.  Without a
  # forced Helm upgrade Fleet reports "not owned by us" and cannot restore
  # the GPU workers' fast-scratch allowlist, leaving ARC runner PVCs Pending.
  force: true
  # local-path-config is created by K3s's packaged local-storage addon. Fleet
  # must adopt it so the NVMe node-path allowlist is reconciled continuously,
  # instead of being restored only when the bootstrap playbook is rerun.
  takeOwnership: true
