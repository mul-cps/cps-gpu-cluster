global:
  cattle:
    systemDefaultRegistry: ""

enablePSP: false

metrics:
  serviceMonitor:
    enabled: true

persistence:
  defaultClass: false  # keep Longhorn SC non-default to avoid impacting existing nfs-client

defaultSettings:
  defaultReplicaCount: 2
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: best-effort
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 10
  guaranteedEngineManagerCPU: 0.25
  guaranteedReplicaManagerCPU: 0.25
  orphanAutoDeletion: true
  nodeDrainPolicy: allow-if-replica-is-stopped  # "allow-if-healthy" is not a valid Longhorn enum value; it silently never applied (live setting stayed at the block-if-contains-last-replica default). This is what unblocks kured node reboots when a node holds a volume's only replica but that replica is already stopped/detached (not serving live I/O).
  filesystemTrimEnabled: true
  #concurrentReplicaRebuildPerNodeLimit: 1   # slower recovery, much steadier cluster
  replicaAutoBalance: least-effort       # or least-effort if you like some balancing without churn
  removeSnapshotsDuringFilesystemTrim: true
  autoCleanupSystemGeneratedSnapshot: true

defaultBackupStore:
  backupTarget: nfs://193.170.30.58:/mnt/scratch1/cps_scratch1_tmp/longhorn-backups?nfsOptions=nfsvers=4.2,proto=tcp,hard,timeo=150,retrans=3,rsize=1048576,wsize=1048576,noresvport
  backupTargetCredentialSecret: ""
  pollInterval: 300

extraObjects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: longhorn-backup-target-bootstrap
      namespace: longhorn-system
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: create-and-verify-target
              image: busybox:1.37
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  mkdir -p /backup/longhorn-backups
                  test -d /backup/longhorn-backups
                  touch /backup/longhorn-backups/.longhorn-backup-target-check
                  rm /backup/longhorn-backups/.longhorn-backup-target-check
              volumeMounts:
                - name: backup-root
                  mountPath: /backup
          volumes:
            - name: backup-root
              nfs:
                server: 193.170.30.58
                path: /mnt/scratch1/cps_scratch1_tmp

# Limit system components to worker nodes (no control-plane tolerations)
longhornManager:
  tolerations: []
longhornDriver:
  tolerations: []
  nodeSelector: {}

# CSI components also avoid control-plane by default (no extra tolerations)
csi:
  attacherTolerations: []
  provisionerTolerations: []
  resizerTolerations: []
  snapshotTolerations: []
  nodeSelector: {}

service:
  ui:
    type: ClusterIP
