controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      logging {
        level = "info"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

tolerations:
  - operator: Exists

hostNetwork: false
