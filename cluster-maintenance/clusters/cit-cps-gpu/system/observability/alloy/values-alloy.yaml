controller:
  type: daemonset
  volumes:
    extra:
      - name: kernel-logs
        hostPath:
          path: /var/log
          type: Directory

# Keep the running version when Fleet reconciles the chart.
image:
  tag: v1.17.0

alloy:
  mounts:
    extra:
      - name: kernel-logs
        mountPath: /host/var/log
        readOnly: true
  configMap:
    create: true
    content: |
      logging {
        level = "info"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          regex         = "(.+)"
          target_label  = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_pod_template_hash"]
          regex         = "(.+)"
          target_label  = "deployment_revision"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_serving_knative_dev_revision"]
          regex         = "(.+)"
          target_label  = "deployment_revision"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.correlation.receiver]
      }

      loki.process "correlation" {
        stage.match {
          selector = "{namespace=~\"cps-compute|jupyterhub|cit-jhub\"}"
          stage.json {
            expressions = {
              request_id = "request_id || requestId",
              attempt_id = "attempt_id || attemptId",
            }
          }
          stage.structured_metadata {
            values = {
              request_id = "",
              attempt_id = "",
            }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      local.file_match "nvidia_xid" {
        path_targets = [{
          __path__ = "/host/var/log/kern.log",
          job = "nvidia-xid",
          node = sys.env("K8S_NODE_NAME"),
        }]
      }

      loki.source.file "nvidia_xid" {
        targets = local.file_match.nvidia_xid.targets
        tail_from_end = true
        forward_to = [loki.process.nvidia_xid.receiver]
      }

      loki.process "nvidia_xid" {
        stage.match {
          selector = "{job=\"nvidia-xid\"} !~ \"NVRM: Xid [(]PCI:[0-9A-Fa-f:.]+[)]: [0-9]+,\""
          action = "drop"
        }
        stage.regex {
          expression = "NVRM: Xid [(]PCI:(?P<pci>[0-9A-Fa-f:.]+)[)]: (?P<xid>[0-9]+),"
        }
        stage.labels {
          values = {
            pci = "",
            xid = "",
          }
        }
        stage.label_drop {
          values = ["filename", "job"]
        }
        stage.metrics {
          metric.counter {
            name = "nvidia_xid_total"
            prefix = "cps_"
            description = "New NVIDIA XID lines read from the worker kernel log"
            match_all = true
            action = "inc"
            max_idle_duration = "30m"
          }
        }
        forward_to = []
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

tolerations:
  - operator: Exists

hostNetwork: false
