apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
  namespace: beszel
  labels:
    app.kubernetes.io/name: beszel
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beszel
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beszel
        app.kubernetes.io/component: hub
    spec:
      containers:
        - name: beszel
          image: docker.io/henrygd/beszel:0.18.8
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: "https://beszel.dshl.unileoben.ac.at"
            - name: PORT
              value: "8090"
            - name: AUTO_LOGIN
              value: "viewer@cps.unileoben.ac.at"
            - name: SHARE_ALL_SYSTEMS
              value: "true"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /beszel_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beszel-data
