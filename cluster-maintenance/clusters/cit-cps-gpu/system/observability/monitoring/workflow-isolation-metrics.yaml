# Ports/selectors inspected against Argo3.7.18 and isolator1.1.0-chart.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cps-argo-controller
  namespace: cattle-monitoring-system
  labels:
    release: rancher-monitoring
spec:
  namespaceSelector:
    matchNames: [cps-argo]
  selector:
    matchLabels:
      app.kubernetes.io/instance: cps-argo
      app.kubernetes.io/component: workflow-controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  sampleLimit: 10000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cps-gpu-isolator
  namespace: cattle-monitoring-system
  labels:
    release: rancher-monitoring
spec:
  namespaceSelector:
    matchNames: [kai-resource-isolator]
  selector:
    matchLabels:
      app.kubernetes.io/instance: kai-resource-isolator
      app.kubernetes.io/component: kai-vgpu-monitor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  sampleLimit: 10000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-controller-metrics
  namespace: cps-argo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cps-argo
      app.kubernetes.io/component: workflow-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 9090, protocol: TCP}
