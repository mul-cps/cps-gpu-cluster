apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Monitoring add-ons; the Rancher Monitoring Helm release is managed separately
#
# NOTE: resource files must stay FLAT in this directory (no subdirectories).
# Fleet's own kustomize bundling enforces a stricter load restriction than
# plain `kubectl kustomize` -- a subdirectory-referenced plain resource file
# (e.g. gpu-dashboard-comparison/foo.yaml) fails with "security; file ... is
# not in or below ''" even though `kubectl kustomize .` builds it fine
# locally. Confirmed live 2026-07-07 -- see docs/troubleshooting.md.
resources:
  - namespace.yaml
  - storage-monitoring.yaml
  - workload-access.yaml
  - storage-alerts.yaml
  - warning-digest.yaml
  - operator-dashboards.yaml
  - nvidia-official-dashboard.yaml
  - gpu-alerts.yaml
  - cluster-health-alerts.yaml
  - alertmanager-receiver.yaml
  - gpu-dash-22515-community.yaml
  - gpu-dash-23382-community.yaml
  - gpu-dash-24450-community.yaml
  - jupyterhub-stats-23694.yaml
  - jupyterhub-servicemonitor.yaml
  - gateway-servicemonitors.yaml
  - hub-spawn-health-jobs.yaml
  - hub-spawn-health-alerts.yaml
  - hub-backup-alerts.yaml

  # SOPS-encrypted secret (decrypted in-cluster by the shared
  # sops-secrets-operator) — the Grafana Helm release itself stays
  # manually installed via deploy.sh, but this Fleet bundle already
  # targets cattle-monitoring-system, so the Secret can ride along here.
  # See docs/sops-secrets-migration.md.
  - grafana-sopssecret.yaml

configMapGenerator:
  - name: hub-spawn-health
    namespace: cattle-monitoring-system
    files:
      - hub-spawn-health.py
      - hub-notebook-resources.py
  - name: alertmanager-loki-receiver
    namespace: cattle-monitoring-system
    files:
      - alertmanager_receiver.py
  - name: cps-storage-monitor-program
    namespace: cattle-monitoring-system
    files:
      - storage_exporter.py
      - workload_allocations.py
      - warning_digest.py
