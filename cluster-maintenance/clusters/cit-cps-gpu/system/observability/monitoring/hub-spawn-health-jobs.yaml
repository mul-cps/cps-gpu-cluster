apiVersion: batch/v1
kind: CronJob
metadata:
  name: cit-hub-route-health
  namespace: cattle-monitoring-system
spec:
  schedule: '*/3 * * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 210
  jobTemplate:
    spec:
      activeDeadlineSeconds: 65
      backoffLimit: 0
      ttlSecondsAfterFinished: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hub-spawn-health
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: program
            configMap:
              name: hub-spawn-health
              defaultMode: 292
          containers:
          - name: probe
            image: ghcr.io/mul-cps/cps-compute@sha256:5d92684ceef47ecbeee4d3c25c0deb960fe222037a255ba84216cf2725264a19
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -u
            - /opt/hub-probe/hub-spawn-health.py
            args:
            - route
            - --hub
            - cit
            volumeMounts:
            - name: program
              mountPath: /opt/hub-probe
              readOnly: true
            resources:
              requests:
                cpu: 25m
                memory: 48Mi
              limits:
                cpu: 250m
                memory: 160Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
---
