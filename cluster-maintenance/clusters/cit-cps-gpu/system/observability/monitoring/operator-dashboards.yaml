apiVersion: v1
kind: ConfigMap
metadata:
  name: cps-worker-health
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: '1'
  annotations:
    k8s-sidecar-target-directory: 20 GPU and Scheduling
data:
  cps-worker-health.json: |
    {
      "uid": "cps-worker-health",
      "title": "GPU workers",
      "description": "Nodes, GPUs, Kubernetes pressure and workload scheduling. GPU utilization comes from DCGM.",
      "tags": [
        "cps-ops",
        "gpu",
        "nodes",
        "scheduling"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "type": "link",
          "title": "Cluster overview",
          "url": "d/cps-cluster-overview",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Storage and backups",
          "url": "d/cps-storage-capacity",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Alerts and Fleet",
          "url": "d/cps-alert-operations",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "GPU packing",
          "url": "d/cps-gpu-packing",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "KAI scheduling",
          "url": "d/cps-kai-fairness",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "NVIDIA DCGM",
          "url": "d/nvidia-official-dcgm",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "CPU busy per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*(1-avg by(instance)(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory used per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*(1-node_memory_MemAvailable_bytes{job=\"node-exporter\"}/node_memory_MemTotal_bytes{job=\"node-exporter\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 3,
          "title": "GPU utilization",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 4,
          "title": "GPU memory used",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*DCGM_FI_DEV_FB_USED/(DCGM_FI_DEV_FB_USED+DCGM_FI_DEV_FB_FREE)",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 5,
          "title": "GPU temperatures",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "DCGM_FI_DEV_GPU_TEMP{job=\"nvidia-dcgm-exporter\"}",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 6,
          "title": "Allocatable GPUs per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by(node) (kube_node_status_allocatable{resource=\"nvidia_com_gpu\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 7,
          "title": "Memory stall pressure",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*rate(node_pressure_memory_stalled_seconds_total[5m])",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 8,
          "title": "Pending Pods per namespace",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(namespace) (kube_pod_status_phase{phase=\"Pending\"}==1)",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 9,
          "title": "Disk pressure per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by(node) (kube_node_status_condition{condition=\"DiskPressure\",status=\"true\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 10,
          "title": "Kubelet runtime errors",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (node,operation_type) (rate(kubelet_runtime_operations_errors_total[5m]))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        }
      ]
    }
