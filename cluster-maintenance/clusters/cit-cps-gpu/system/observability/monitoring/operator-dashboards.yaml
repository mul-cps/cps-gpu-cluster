apiVersion: v1
kind: ConfigMap
metadata:
  name: cps-alert-operations
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: '1'
  annotations:
    k8s-sidecar-target-directory: 50 Monitoring and Delivery
data:
  cps-alert-operations.json: |
    {
      "uid": "cps-alert-operations",
      "title": "Alerts and Fleet",
      "description": "Alert volume and delivery, scrape coverage, rule evaluation and Fleet drift.",
      "tags": [
        "cps-ops",
        "alerts",
        "fleet",
        "monitoring"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "type": "link",
          "title": "Cluster overview",
          "url": "d/cps-cluster-overview",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Services and teaching",
          "url": "d/cps-service-reliability",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Storage and backups",
          "url": "d/cps-storage-capacity",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Alert volume by severity",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(severity) (ALERTS{severity=~\"warning|critical|info\",alertstate=\"firing\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 2,
          "title": "Most frequent firing alert series",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(15,sum by(alertname)(max_over_time(ALERTS{alertstate=\"firing\",severity=~\"warning|critical\"}[24h])))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 3,
          "title": "Alertmanager attempted and failed deliveries",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(integration)(increase(alertmanager_notifications_total[1h]))",
              "legendFormat": "{{integration}} attempted",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(integration)(increase(alertmanager_notifications_failed_total[1h]))",
              "legendFormat": "{{integration}} failed",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 4,
          "title": "Prometheus unhealthy scrape targets",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(job)(up==0)",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 5,
          "title": "Rule evaluation failures",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(rule_group)(increase(prometheus_rule_evaluation_failures_total[1h]))>0",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 6,
          "title": "Fleet resource drift",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "fleet_gitrepo_resources_modified + fleet_gitrepo_resources_not_ready + fleet_gitrepo_resources_missing",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 7,
          "title": "Firing alert groups",
          "description": "",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(alertname,severity,namespace) (ALERTS{alertstate=\"firing\",severity=~\"warning|critical\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(?!Time$|Value$|__name__$|alertstate$).+"
                }
              }
            }
          ]
        }
      ]
    }
