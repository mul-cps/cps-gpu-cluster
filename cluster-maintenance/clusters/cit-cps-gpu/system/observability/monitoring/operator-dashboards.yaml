          "url": "d/cps-kai-fairness",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "NVIDIA DCGM",
          "url": "d/nvidia-official-dcgm",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "CPU busy per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by(nodename) ((100*(1-avg by(instance)(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))) * on(instance) group_left(nodename) max by(instance,nodename) (node_uname_info{job=\"node-exporter\",nodename=~\"k3s-wk-gpu[1-4]\"}))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory used per node",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by(nodename) ((100*(1-node_memory_MemAvailable_bytes{job=\"node-exporter\"}/node_memory_MemTotal_bytes{job=\"node-exporter\"})) * on(instance) group_left(nodename) max by(instance,nodename) (node_uname_info{job=\"node-exporter\",nodename=~\"k3s-wk-gpu[1-4]\"}))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 3,
          "title": "GPU utilization",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 4,
          "title": "GPU memory used",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*DCGM_FI_DEV_FB_USED/(DCGM_FI_DEV_FB_USED+DCGM_FI_DEV_FB_FREE)",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 5,
          "title": "GPU temperatures",
