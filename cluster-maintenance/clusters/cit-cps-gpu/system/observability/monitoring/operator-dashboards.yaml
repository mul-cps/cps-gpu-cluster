                "uid": "prometheus"
              },
              "expr": "histogram_quantile(.95,sum by(namespace,le)(rate(jupyterhub_server_spawn_duration_seconds_bucket{namespace=~\"jupyterhub|cit-jhub\",status=\"success\"}[1h])))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 7,
          "title": "Public routes and provisioned probe coverage",
          "description": "1 means suspended. A public identity-route check is an anonymous probe. A successful fresh authenticated spawn requires its own enabled probe and credentials.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_cronjob_spec_suspend{cronjob=~\".*hub-(route-health|spawn-.*)\"}",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 8,
          "title": "Last successful Hub probe age",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time()-kube_cronjob_status_last_successful_time{cronjob=~\".*hub-(route-health|spawn-.*)\"})/3600",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 9,
          "title": "Gateway metrics scrape health",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{job=\"compute-gateway\"}",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 10,
          "title": "Gateway 5xx rate",
          "description": "Application HTTP status counters are currently unverified. No data is a coverage gap; see endpoint counts and gateway logs.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(service) (rate(cps_gateway_http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cps-alert-operations
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: '1'
  annotations:
    k8s-sidecar-target-directory: 50 Monitoring and Delivery
data:
  cps-alert-operations.json: |
    {
      "uid": "cps-alert-operations",
      "title": "Alerts and Fleet",
      "description": "Alert volume and delivery, scrape coverage, rule evaluation and Fleet drift.",
      "tags": [
        "cps-ops",
        "alerts",
        "fleet",
        "monitoring"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "type": "link",
          "title": "Cluster overview",
          "url": "d/cps-cluster-overview",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Services and teaching",
          "url": "d/cps-service-reliability",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Storage and backups",
          "url": "d/cps-storage-capacity",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Alert volume by severity",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(severity) (ALERTS{severity=~\"warning|critical|info\",alertstate=\"firing\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 2,
          "title": "Most frequent firing alert series",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(15,sum by(alertname)(max_over_time(ALERTS{alertstate=\"firing\",severity=~\"warning|critical\"}[24h])))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 3,
          "title": "Alertmanager attempted and failed deliveries",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(integration)(increase(alertmanager_notifications_total[1h]))",
              "legendFormat": "{{integration}} attempted",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(integration)(increase(alertmanager_notifications_failed_total[1h]))",
              "legendFormat": "{{integration}} failed",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 4,
          "title": "Prometheus unhealthy scrape targets",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(job)(up==0)",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 5,
          "title": "Rule evaluation failures",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(rule_group)(increase(prometheus_rule_evaluation_failures_total[1h]))>0",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 6,
          "title": "Fleet resource drift",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "fleet_gitrepo_resources_modified + fleet_gitrepo_resources_not_ready + fleet_gitrepo_resources_missing",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 7,
          "title": "Firing alert groups",
          "description": "",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(alertname,severity,namespace) (ALERTS{alertstate=\"firing\",severity=~\"warning|critical\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(?!Time$|Value$|__name__$|alertstate$).+"
                }
              }
            }
          ]
        }
      ]
    }
