---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cps-cluster-overview
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: '1'
  annotations:
    k8s-sidecar-target-directory: 00 Cluster Operations
data:
  cps-cluster-overview.json: |
    {
      "uid": "cps-cluster-overview",
      "title": "Cluster overview",
      "description": "Operational entry point for the CPS/CIT GPU cluster. Start with service impact and saturation, then follow the detailed dashboards.",
      "tags": [
        "cps-ops",
        "cluster",
        "overview"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "type": "link",
          "title": "GPU workers",
          "url": "d/cps-worker-health",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Storage and backups",
          "url": "d/cps-storage-capacity",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Services and teaching",
          "url": "d/cps-service-reliability",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        },
        {
          "type": "link",
          "title": "Alerts and Fleet",
          "url": "d/cps-alert-operations",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Critical alerts",
          "description": "Current firing critical alerts.",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "Alerts and Fleet",
                  "url": "d/cps-alert-operations",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 2,
          "title": "Nodes Ready",
          "description": "Expected cluster inventory is seven nodes.",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "green",
                    "value": 7
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "GPU workers",
                  "url": "d/cps-worker-health",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by(node) (kube_node_status_condition{condition=\"Ready\",status=\"true\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 3,
          "title": "Allocatable GPUs",
          "description": "Advertised whole GPU count, independent of VRAM and fractional reservations.",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "green",
                    "value": 8
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "GPU workers",
                  "url": "d/cps-worker-health",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(max by(node) (kube_node_status_allocatable{resource=\"nvidia_com_gpu\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 4,
          "title": "Gateway ready endpoints",
          "description": "Ready HTTP endpoints. Missing kube-state-metrics leaves a gap.",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "Services and teaching",
                  "url": "d/cps-service-reliability",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_endpoint_address{job=\"kube-state-metrics\",namespace=\"cps-compute\",endpoint=\"compute-gateway\",port_name=\"http\",ready=\"true\"}) or (0 * max(up{job=\"kube-state-metrics\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 5,
          "title": "Lowest root free %",
          "description": "Lowest observed root free space among the guest filesystems.",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "green",
                    "value": 20
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "Storage and backups",
                  "url": "d/cps-storage-capacity",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(100*cps:filesystem_free_ratio{mountpoint=\"/\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 6,
          "title": "Lowest replica headroom",
          "description": "Minimum Longhorn scheduling headroom, displayed in GiB.",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 26843545600
                  }
                ]
              },
              "links": [
                {
                  "type": "link",
                  "title": "Storage and backups",
                  "url": "d/cps-storage-capacity",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(cps_longhorn_disk_schedulable_bytes and cps_longhorn_disk_replicas>0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 7,
          "title": "Firing alerts by severity",
          "description": "Firing alert instances. Open Alerts and Fleet to investigate.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Alerts and Fleet",
                  "url": "d/cps-alert-operations",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by(severity) (ALERTS{alertstate=\"firing\",severity=~\"critical|warning\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 8,
          "title": "Root and scratch free space",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Storage and backups",
                  "url": "d/cps-storage-capacity",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*cps:filesystem_free_ratio{mountpoint=\"/\"}",
              "legendFormat": "{{nodename}} root",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*cps:filesystem_free_ratio{mountpoint=\"/mnt/nvme/scratch\"}",
              "legendFormat": "{{nodename}} scratch",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 9,
          "title": "Hub probe and gateway readiness",
          "description": "Hub probes reach the public identity challenge. Authenticated sign-in coverage is shown on Services and Teaching.",
          "type": "timeseries",
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Services and teaching",
                  "url": "d/cps-service-reliability",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by(namespace,cronjob) (kube_cronjob_status_last_successful_time{cronjob=~\"(cps|cit)-hub-route-health\"}) > bool (time()-900)",
              "legendFormat": "{{cronjob}} recent success",
              "instant": false,
              "range": true,
              "format": "time_series"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_endpoint_address{job=\"kube-state-metrics\",namespace=\"cps-compute\",endpoint=\"compute-gateway\",port_name=\"http\",ready=\"true\"}) or (0*max(up{job=\"kube-state-metrics\"}))",
              "legendFormat": "Gateway ready backends",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 10,
          "title": "Worker CPU busy",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "GPU workers",
                  "url": "d/cps-worker-health",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*(1-avg by(instance)(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 11,
          "title": "Worker memory used",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "GPU workers",
                  "url": "d/cps-worker-health",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100*(1-node_memory_MemAvailable_bytes{job=\"node-exporter\"}/node_memory_MemTotal_bytes{job=\"node-exporter\"})",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 12,
          "title": "GPU utilization",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 16,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "GPU workers",
                  "url": "d/cps-worker-health",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "DCGM_FI_DEV_GPU_UTIL{job=\"nvidia-dcgm-exporter\"}",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 13,
          "title": "Ingress errors by service",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Services and teaching",
                  "url": "d/cps-service-reliability",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by(exported_namespace,ingress) (rate(nginx_ingress_controller_requests{exported_namespace=~\"jupyterhub|cit-jhub|dex|cit-auth|harbor\",status=~\"5..\"}[5m]))",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 14,
          "title": "Backup age by job",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 8,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Storage and backups",
                  "url": "d/cps-storage-capacity",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time()-max by(namespace,cronjob) (kube_cronjob_status_last_successful_time{cronjob=~\"(cps|cit)-hub-postgresql-backup|compute-state-backup|cps-admin-backup|cit-admin-backup|backup-all|system-backup\"}))/3600",
              "legendFormat": "",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 15,
          "title": "Fleet resources needing attention",
          "description": "",
          "type": "timeseries",
          "gridPos": {
            "x": 16,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "links": [
                {
                  "type": "link",
                  "title": "Alerts and Fleet",
                  "url": "d/cps-alert-operations",
                  "includeVars": false,
                  "keepTime": true,
                  "targetBlank": false
                }
              ]
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "fleet_gitrepo_resources_modified + fleet_gitrepo_resources_not_ready + fleet_gitrepo_resources_missing",
              "legendFormat": "{{name}} / {{namespace}}",
              "instant": false,
              "range": true,
              "format": "time_series"
            }
          ]
        },
        {
          "id": 16,
          "title": "Current critical and warning alerts",
          "description": "",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
