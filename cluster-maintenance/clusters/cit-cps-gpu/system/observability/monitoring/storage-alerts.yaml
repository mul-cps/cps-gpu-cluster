apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cps-storage-and-operations
  namespace: cattle-monitoring-system
  labels:
    app: rancher-monitoring
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: cps-storage
    rules:
    - record: cps:filesystem_free_ratio
      expr: max by(nodename,mountpoint) ((node_filesystem_avail_bytes{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"}
        / (node_filesystem_size_bytes{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"} > 0)) * on(instance)
        group_left(nodename) max by(instance,nodename) (node_uname_info{job="node-exporter"}))
    - record: cps:filesystem_avail_bytes
      expr: max by(nodename,mountpoint) ((node_filesystem_avail_bytes{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"})
        * on(instance) group_left(nodename) max by(instance,nodename) (node_uname_info{job="node-exporter"}))
    - record: cps:filesystem_inode_free_ratio
      expr: max by(nodename,mountpoint) ((node_filesystem_files_free{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"}
        / (node_filesystem_files{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"} > 0)) * on(instance)
        group_left(nodename) max by(instance,nodename) (node_uname_info{job="node-exporter"}))
    - record: cps:filesystem_readonly
      expr: max by(nodename,mountpoint) ((node_filesystem_readonly{job="node-exporter",mountpoint=~"/|/mnt/nvme/scratch"})
        * on(instance) group_left(nodename) max by(instance,nodename) (node_uname_info{job="node-exporter"}))
    - alert: CPSRootSpaceWarning
      expr: cps:filesystem_free_ratio{mountpoint="/"} < .20
      for: 30m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Root filesystem free space is low on {{ $labels.nodename }}
        description: Free space has been below 20% for 30m. Review storage growth and verify recovery.
        dashboard_uid: cps-storage-capacity
    - alert: CPSRootSpaceCritical
      expr: cps:filesystem_free_ratio{mountpoint="/"} < .10
      for: 15m
      labels:
        severity: critical
        owner: cluster-operations
        component: storage
      annotations:
        summary: Root filesystem free space is low on {{ $labels.nodename }}
        description: Free space has been below 10% for 15m. Review storage growth and verify recovery.
        dashboard_uid: cps-storage-capacity
    - alert: CPSScratchSpaceWarning
      expr: cps:filesystem_free_ratio{mountpoint="/mnt/nvme/scratch"} < .15
      for: 30m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Scratch filesystem free space is low on {{ $labels.nodename }}
        description: Free space has been below 15% for 30m. Review storage growth and verify recovery.
        dashboard_uid: cps-storage-capacity
    - alert: CPSScratchSpaceCritical
      expr: cps:filesystem_free_ratio{mountpoint="/mnt/nvme/scratch"} < .08
      for: 15m
      labels:
        severity: critical
        owner: cluster-operations
        component: storage
      annotations:
        summary: Scratch filesystem free space is low on {{ $labels.nodename }}
        description: Free space has been below 8% for 15m. Review storage growth and verify recovery.
        dashboard_uid: cps-storage-capacity
    - alert: CPSRootSpaceProjectedExhaustion
      expr: cps:filesystem_free_ratio{mountpoint="/"} < .30 and predict_linear(cps:filesystem_avail_bytes{mountpoint="/"}[12h],
        72*3600) < 0 and deriv(cps:filesystem_avail_bytes{mountpoint="/"}[12h]) < 0 and count_over_time(cps:filesystem_avail_bytes{mountpoint="/"}[12h])
        >= 120
      for: 30m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Root filesystem trending toward exhaustion on {{ $labels.nodename }}
        description: A 12-hour downward trend projects exhaustion within 72 hours. Review sustained writes
          and the storage dashboard.
        dashboard_uid: cps-storage-capacity
    - alert: CPSHostInodesWarning
      expr: cps:filesystem_inode_free_ratio < .15 and cps:filesystem_inode_free_ratio >= .05
      for: 20m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Filesystem inodes low on {{ $labels.nodename }}
        description: Review small-file growth on {{ $labels.mountpoint }}.
        dashboard_uid: cps-storage-capacity
    - alert: CPSHostInodesCritical
      expr: cps:filesystem_inode_free_ratio < .05
      for: 20m
      labels:
        severity: critical
        owner: cluster-operations
        component: storage
      annotations:
        summary: Filesystem inodes low on {{ $labels.nodename }}
        description: Review small-file growth on {{ $labels.mountpoint }}.
        dashboard_uid: cps-storage-capacity
    - alert: CPSExpectedFilesystemMetricMissing
      expr: |-
        (
          label_replace(max by (node) (kube_node_info{node=~"k3s-(cp[1-3]|wk-gpu[1-4])"}), "mountpoint", "/", "node", ".+")
          or label_replace(max by (node) (kube_node_info{node=~"k3s-wk-gpu[1-4]"}), "mountpoint", "/mnt/nvme/scratch", "node", ".+")
        )
        unless on(node,mountpoint)
        label_replace(cps:filesystem_free_ratio, "node", "$1", "nodename", "(.+)")
      for: 10m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Expected filesystem telemetry absent on {{ $labels.node }}
        description: Inspect the mount and the node-exporter target for {{ $labels.mountpoint }}.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornScheduledHeadroomLow
      expr: cps_longhorn_disk_schedulable_bytes < 25*1024^3 and cps_longhorn_disk_replicas > 0
      for: 15m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn allocation headroom low on {{ $labels.node }}
        description: Replica disk {{ $labels.disk }} has under 25 GiB of scheduling headroom. Inspect
          reserved capacity and replica placement before expanding a PVC.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornPhysicalHeadroomExhausted
      expr: cps_longhorn_disk_physical_headroom_bytes <= 0 and cps_longhorn_disk_replicas > 0
      for: 10m
      labels:
        severity: critical
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn physical reserve reached on {{ $labels.node }}
        description: The disk {{ $labels.disk }} is at or below the configured minimum available space.
        dashboard_uid: cps-storage-capacity
    - alert: CPSStorageExporterUnavailable
      expr: absent(up{job="cps-storage-monitor"} == 1)
      for: 5m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn scheduling and backup telemetry unavailable
        description: Check exporter health and its read-only Longhorn API access.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornRebuildStalled
      expr: longhorn_engine_rebuild_progress < 100 and changes(longhorn_engine_rebuild_progress[30m])
        == 0 and count_over_time(longhorn_engine_rebuild_progress[30m]) >= 25
      for: 10m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn replica rebuild stopped progressing
        description: Review engine {{ $labels.engine }} and disk throughput, capacity and replica state.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornBackupTargetUnavailable
      expr: cps_longhorn_backup_target_available == 0
      for: 10m
      labels:
        severity: critical
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn backup target {{ $labels.target }} unavailable
        description: Check mount reachability and the ICT export. Consult the backup runbook.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornBackupOverdue
      expr: time() - cps_longhorn_last_backup_timestamp_seconds > 36*3600
      for: 15m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Longhorn volume backup overdue for {{ $labels.pvc }}
        description: An attached volume in the daily backup group has no recent successful snapshot.
        dashboard_uid: cps-storage-capacity
    - alert: CPSLonghornLatestBackupFailed
      expr: |-
        (cps_longhorn_latest_backup_failed == 1)
          and on(volume) cps_longhorn_last_backup_timestamp_seconds
      for: 15m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Latest Longhorn backup failed for {{ $labels.volume }}
        description: Review the recent backup attempt and confirm the next successful run.
        dashboard_uid: cps-storage-capacity
    - record: cps:pvc_free_ratio
      expr: min by(namespace,persistentvolumeclaim) (kubelet_volume_stats_available_bytes{job="kubelet"}
        / (kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0))
    - alert: CPSNotebookPVCNearlyFull
      expr: cps:pvc_free_ratio{namespace=~"jupyterhub|cit-jhub",persistentvolumeclaim=~"claim-.+"} < .05
      for: 15m
      labels:
        severity: warning
        owner: cluster-operations
        component: storage
      annotations:
        summary: Notebook home {{ $labels.persistentvolumeclaim }} low on free space
        description: Confirm usage from the owning notebook and follow the storage runbook.
        dashboard_uid: cps-storage-capacity
  - name: cps-operations
    rules:
    - alert: CPSKnativeWebhookUnavailable
      expr: absent(kube_endpoint_address{job="kube-state-metrics",namespace="knative-serving",endpoint="webhook",port_name="https-webhook",ready="true"})
        and on() max(up{job="kube-state-metrics"})==1
      for: 5m
      labels:
        severity: critical
        owner: cluster-operations
        component: operations
      annotations:
        summary: Knative admission webhook has no ready endpoints
        description: Check Knative Serving rollout, TLS and endpoint readiness.
        dashboard_uid: cps-service-reliability
    - alert: CPSHpaAtMaximum
      expr: |-
        (
          kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics"}
          >= kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
        )
        and on(namespace,horizontalpodautoscaler)
        (
          kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics"}
          > kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics"}
        )
      for: 15m
      labels:
        severity: warning
        owner: cluster-operations
        component: operations
      annotations:
        summary: Autoscaler {{ $labels.horizontalpodautoscaler }} at maximum
        description: Review service traffic and scaling limits before raising capacity.
        dashboard_uid: cps-service-reliability
    - record: cps:backup_job_start_timestamp_seconds
      expr: max by(namespace,job_name) (kube_job_created) * on(namespace,job_name) group_left(owner_name)
        max by(namespace,job_name,owner_name) (kube_job_owner{owner_kind="CronJob",owner_name=~"backup-all|system-backup|cps-hub-postgresql-backup|cit-hub-postgresql-backup|compute-state-backup|cps-admin-backup|cit-admin-backup"})
    - alert: CPSLatestBackupJobFailed
      expr: |-
        (
          cps:backup_job_start_timestamp_seconds
          == on(namespace,owner_name) group_left max by(namespace,owner_name) (cps:backup_job_start_timestamp_seconds)
        )
        and on(namespace,job_name) (max by(namespace,job_name) (kube_job_failed{condition="true"}) == 1)
        unless on(namespace,owner_name) (
          label_replace(max by(namespace,cronjob) (kube_cronjob_status_last_successful_time), "owner_name", "$1", "cronjob", "(.+)")
          > on(namespace,owner_name) max by(namespace,owner_name) (cps:backup_job_start_timestamp_seconds)
        )
      for: 5m
      labels:
        severity: warning
        owner: cluster-operations
        component: operations
      annotations:
        summary: Latest backup Job failed for {{ $labels.owner_name }}
        description: Check the latest run and confirm a successful recovery. Previous failures remain
          in the archive.
        dashboard_uid: cps-service-reliability
    - alert: CPSRecentJobFailed
      expr: |-
        (max by(namespace,job_name) (kube_job_failed{condition="true"}) == 1
        and on(namespace,job_name) (time() - max by(namespace,job_name) (kube_job_created) < 86400))
        unless on(namespace,job_name) (max by(namespace,job_name,owner_name) (kube_job_owner{owner_kind="CronJob",owner_name=~"backup-all|system-backup|cps-hub-postgresql-backup|cit-hub-postgresql-backup|compute-state-backup|cps-admin-backup|cit-admin-backup"}))
      for: 10m
      labels:
        severity: warning
        owner: cluster-operations
        component: operations
      annotations:
        summary: Recent Job {{ $labels.job_name }} failed
        description: Review the terminal Job and its diagnostic logs; this warning expires after the recent-run
          window.
        dashboard_uid: cps-alert-operations
    - alert: CPSInfrastructureBackupStale
      expr: time() - max by(namespace,cronjob) (kube_cronjob_status_last_successful_time{namespace="longhorn-system",cronjob=~"backup-all|system-backup"})
        > 36*3600
      for: 10m
      labels:
        severity: warning
        owner: cluster-operations
        component: operations
      annotations:
        summary: Longhorn {{ $labels.cronjob }} backup CronJob stale
        description: Check schedule and recent results, then verify a current backup exists.
        dashboard_uid: cps-service-reliability
