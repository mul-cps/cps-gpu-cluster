apiVersion: v1
kind: ServiceAccount
metadata:
  name: cps-warning-digest
  namespace: cattle-monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cps-warning-digest
  namespace: cattle-monitoring-system
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [alertmanagerconfigs]
    resourceNames: [cluster-admin-email]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cps-warning-digest
  namespace: cattle-monitoring-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cps-warning-digest
subjects:
  - kind: ServiceAccount
    name: cps-warning-digest
    namespace: cattle-monitoring-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cps-warning-digest
  namespace: cattle-monitoring-system
spec:
  schedule: "0 9 * * 1-5"
  timeZone: Europe/Vienna
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: cps-warning-digest
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: digest
              image: docker.io/library/python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
              command: [python, -B, -u, /app/warning_digest.py]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 24Mi}
                limits: {cpu: 200m, memory: 96Mi}
              volumeMounts:
                - {name: program, mountPath: /app, readOnly: true}
                - {name: smtp, mountPath: /smtp, readOnly: true}
          volumes:
            - name: program
              configMap:
                name: cps-storage-monitor-program
            - name: smtp
              secret:
                secretName: alertmanager-admin-smtp
                defaultMode: 0440
                items:
                  - {key: password, path: password}
