# Fleet configuration for cluster monitoring add-ons
name: nvidia-monitoring-addons

defaultNamespace: cattle-monitoring-system

# The Rancher Monitoring Helm release is managed separately
kustomize:
  dir: .

# Target only clusters with the gpu-monitoring label
targets:
  - name: cit-cps-gpu
    clusterSelector:
      matchLabels:
        name: cit-cps-gpu
