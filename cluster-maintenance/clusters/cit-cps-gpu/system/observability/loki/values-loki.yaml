deploymentMode: SingleBinary

loki:
  auth_enabled: false
  limits_config:
    retention_period: 336h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi


# Explicitly disable scalable components to suffice validating logic
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

memberlist:
  service:
    publishNotReadyAddresses: true
