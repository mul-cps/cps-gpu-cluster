deploymentMode: SingleBinary
loki:
  auth_enabled: false
  limits_config:
    retention_period: 336h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    # Existing StatefulSet claim templates are immutable. The retained live
    # storage-loki-0 PVC was expanded separately to 55Gi on 2026-10-05.
    size: 50Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
memberlist:
  service:
    publishNotReadyAddresses: true
