# NOS values tuned for A100 40GB dynamic MIG on gpu1-3; gpu4 stays full-GPU only via labels/taints
nvidiaGpuResourceMemoryGB: 40
shareTelemetry: false

operator:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

scheduler:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

# GPU partitioner (MIG) only runs on nodes labeled nos.nebuly.com/gpu-partitioning=mig
# (set via gpu-operator/node-labeler.yaml)
gpuPartitioner:
  devicePlugin:
    config:
      name: device-plugin-config
      namespace: gpu-operator
    configUpdateDelaySeconds: 5

  # Remove cloud-specific tolerations; keep the built-in nvidia.com/gpu toleration from the chart
  migAgent:
    tolerations: []
  gpuAgent:
    tolerations: []
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

  knownMigGeometries:
    - models: ["A100-SXM4-40GB", "NVIDIA-A100-40GB-PCIe", "NVIDIA-A100-SXM4-40GB"]
      allowedGeometries:
        - 1g.5gb: 7
        - 1g.5gb: 5
          2g.10gb: 1
        - 1g.5gb: 3
          2g.10gb: 2
        - 1g.5gb: 1
          2g.10gb: 3
        - 1g.5gb: 2
          2g.10gb: 1
          3g.20gb: 1
        - 2g.10gb: 2
          3g.20gb: 1
        - 1g.5gb: 3
          3g.20gb: 1
        - 1g.5gb: 1
          2g.10gb: 1
          3g.20gb: 1
        - 3g.20gb: 2
        - 1g.5gb: 3
          4g.20gb: 1
        - 1g.5gb: 1
          2g.10gb: 1
          4g.20gb: 1
        - 7g.40gb: 1
