global:
  # Bumped 2026-07-06: v0.12.10 -> v0.14.6 (LTS line). Note the project
  # moved its GHCR org between v0.13.0 and v0.14.0 -- both the Helm chart
  # (fleet.yaml: oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler)
  # and this registry override must point at ghcr.io/kai-scheduler/kai-scheduler
  # now, not ghcr.io/nvidia/kai-scheduler (the old path 404s for >=v0.14).
  tag: v0.14.6
  registry: ghcr.io/kai-scheduler/kai-scheduler
  # Required for the gpu-memory annotation (MPS-based VRAM-tier sharing,
  # see user/jupyter/jupyterhub/values.yaml PROFILE_CONFIGS) -- without
  # this, KAI's admission webhook rejects any pod with a GPU-sharing
  # request outright ("GPU sharing is disabled"). Confirmed live
  # (2026-07-06) via kubectl patch before landing this repo change.
  gpuSharing: true
  # INVESTIGATED, NOT SET (2026-07-06): tried setting global.replicaCount:
  # 2 here to get a second admission webhook replica (the admission
  # webhook's namespaceSelector is broad by design -- NotIn [kube-system,
  # kai-scheduler] -- and matches nearly every pod creation cluster-wide
  # regardless of schedulerName; confirmed live during a real incident
  # where a single admission pod becoming briefly unreachable blocked ALL
  # pod scheduling cluster-wide). Traced the chart template
  # (kai-scheduler/templates/kai-config.yaml:41) and found
  # `global.replicaCount` only maps to `.Values.operator.replicaCount` --
  # the kai-operator's OWN replica count, not admission's or any other
  # component's. admission's replica count is hardcoded to 1 in the
  # operator's Go controller with no values.yaml/Config-CR override
  # surface at all in v0.12.10 -- same class of "operator hardcodes it, no
  # config exposed" gap as the namespaceSelector issue. Filed
  # https://github.com/kai-scheduler/KAI-Scheduler/issues/1842 for the
  # namespaceSelector; this replica-count gap should be added to that same
  # upstream ask (or a new issue) rather than worked around here --
  # cloning admission the way mps-control-daemon-standalone.yaml clones
  # the MPS daemon is possible but meaningfully more fragile (admission
  # runs the actual webhook logic with TLS cert rotation via
  # certSecretName, not just a passthrough daemon) and wasn't attempted.
  #
  # admission-pdb.yaml is still applied (see that file) -- with only 1
  # replica it can't prevent the exact incident above, but it does stop a
  # voluntary eviction (node drain, descheduler) from casually taking down
  # the only admission pod without at least surfacing the block.
  #
  # RE-CHECKED against v0.14.6 (2026-07-06, during the v0.12.10 -> v0.14.6
  # bump): `helm show values` for v0.14.6 still only exposes
  # `operator.replicaCount`, no per-component (admission) replicaCount, and
  # still no namespaceSelector field anywhere under `admission:`. Issue
  # https://github.com/kai-scheduler/KAI-Scheduler/issues/1842 (filed by us)
  # remains OPEN upstream -- neither gap has been fixed as of v0.14.6.

admission:
  gpuPodRuntimeClassName: nvidia
