name: kai-scheduler
defaultNamespace: kai-scheduler

labels:
  name: kai-scheduler

helm:
  chart: oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler
  version: v0.14.6
  valuesFiles:
    - values.yaml

# Post-render patch applied on top of the Helm output (the chart's
# default-shard.yaml template has no values.yaml field wired to
# SchedulingShard.spec.args, even though the CRD supports it -- see
# kustomization.yaml and docs/troubleshooting.md, 2026-07-07 entry, for why
# this is needed and confirmation this is a supported Fleet bundle shape).
kustomize:
  dir: .

diff:
  comparePatches:
  - apiVersion: kai.scheduler/v1
    kind: SchedulingShard
    name: default
    operations:
    - {"op": "remove", "path": "/status"}
