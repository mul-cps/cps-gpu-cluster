# Stock KAI; inline Config is owned by Fleet, independently installed Fractioning stays separate.
# Legacy verbose-shard post-render source is retained but not enabled: preserve live empty args.
name: kai-scheduler
defaultNamespace: kai-scheduler
labels:
  name: kai-scheduler
helm:
  chart: oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler
  version: v0.18.1
  valuesFiles:
  - values.yaml
  - upstream-values.yaml
  takeOwnership: true
diff:
  comparePatches:
  - apiVersion: kai.scheduler/v1
    kind: SchedulingShard
    name: default
    operations:
    - op: remove
      path: /status
