# IMPORTANT: every queue needs explicit cpu/memory resource blocks, not just
# gpu. KAI defaults any resource dimension left unspecified to quota=0,
# limit=0 (a hard cap, not just an unguaranteed/bursty 0) -- confirmed live
# 2026-07-06 when a real multi-pod batch job was rejected with "OverLimit:
# batch quota has reached the allowable limit of CPU cores. Limit is 0
# cores" despite the gpu dimension being correctly configured to burst via
# limit: -1. cpu/memory below mirror each queue's existing gpu quota/weight
# shape (same quota=0 + limit=-1 burst-only model for batch, matching
# quotas for courses/phd-interactive, unlimited for default) so a workload
# isn't blocked on CPU/memory after correctly clearing the GPU dimension.
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: courses
  namespace: kai-scheduler
spec:
  parentQueue: default-parent-queue
  resources:
    gpu:
      quota: 4
      limit: -1
      overQuotaWeight: 1
    cpu:
      quota: -1
      limit: -1
      overQuotaWeight: 1
    memory:
      quota: -1
      limit: -1
      overQuotaWeight: 1
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: phd-interactive
  namespace: kai-scheduler
spec:
  parentQueue: default-parent-queue
  resources:
    # gpu.quota raised 1.5 -> 2 on 2026-07-07: KAI's reclaim is gated by
    # CanReclaimResources, which blocks a queue from reclaiming *beyond its
    # own guaranteed quota* even when reclaim would otherwise succeed. The
    # gpu-pytorch-dual/gpu-tensorflow-dual profiles (this queue) request 2
    # whole GPUs on a single pod -- with quota 1.5, that request already
    # exceeds this queue's guarantee before reclaim is even attempted, so
    # reclaim never fires for these profiles regardless of real cluster
    # capacity (see docs/troubleshooting.md, "JupyterHub '2x GPU' profile
    # spawn failure" and its 2026-07-07 follow-ups). Raising quota to 2
    # matches the guarantee to what a single dual-GPU session actually
    # needs, so reclaim can act instead of being fair-share-gated.
    # overQuotaWeight raised 2 -> 10 on 2026-07-07: FairShare division buckets
    # courses/phd-interactive/batch in the same tier (Queue CRD spec.priority
    # is unset/equal for all three -- a different field from the
    # PriorityClass values 90/50/10), so idle surplus from courses' quota
    # gets split across phd-interactive and batch by overQuotaWeight alone.
    # At 2 vs batch's 10, phd-interactive only ever got ~1/6 of that surplus
    # (deserved=2, fairShare=3 out of courses' full 4-GPU idle quota) --
    # confirmed live via scheduler logs and a synthetic burst test that
    # stalled at fairShare=3 with zero batch eviction attempts, even with
    # courses fully idle. Swapped to 10 (phd-interactive) vs batch's new 2
    # so phd-interactive claims most of that surplus instead, letting it
    # burst toward the full 8-GPU cluster when courses isn't contending.
    # Does NOT touch reclaim-immunity (still governed by static quota,
    # unchanged at 2) -- see docs/troubleshooting.md for full derivation.
    gpu:
      quota: 2
      limit: -1
      overQuotaWeight: 10
    cpu:
      quota: -1
      limit: -1
      overQuotaWeight: 10
    memory:
      quota: -1
      limit: -1
      overQuotaWeight: 10
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: batch
  namespace: kai-scheduler
spec:
  parentQueue: default-parent-queue
  resources:
    # overQuotaWeight lowered 10 -> 2 on 2026-07-07, paired with
    # phd-interactive's 2 -> 10 raise (see that queue's comment for the
    # full derivation) -- batch was winning ~5/6 of courses' idle surplus
    # capacity, capping phd-interactive's burst at fairShare=3 instead of
    # letting it approach the full 8-GPU cluster when courses is idle.
    # batch is still a pure opportunistic filler (quota=0) and still gets a
    # real share of unclaimed capacity, just no longer the majority share.
    gpu:
      quota: 0
      limit: -1
      overQuotaWeight: 2
    cpu:
      quota: 0
      limit: -1
      overQuotaWeight: 2
    memory:
      quota: 0
      limit: -1
      overQuotaWeight: 2
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: default
  namespace: kai-scheduler
spec:
  parentQueue: default-parent-queue
  resources:
    gpu:
      quota: -1
      limit: -1
      overQuotaWeight: 10
    cpu:
      quota: -1
      limit: -1
      overQuotaWeight: 10
    memory:
      quota: -1
      limit: -1
      overQuotaWeight: 10
