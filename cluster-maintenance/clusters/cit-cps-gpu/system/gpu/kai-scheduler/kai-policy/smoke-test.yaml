apiVersion: v1
kind: Pod
metadata:
  name: kai-smoke-test
  namespace: kai-scheduler
  labels:
    kai.scheduler/queue: default
spec:
  schedulerName: kai-scheduler
  priorityClassName: kai-batch-low
  containers:
  - name: cuda-container
    image: nvidia/cuda:12.0.0-base-ubuntu22.04
    command: ["sleep", "60"]
    resources:
      limits:
        nvidia.com/gpu: 1
