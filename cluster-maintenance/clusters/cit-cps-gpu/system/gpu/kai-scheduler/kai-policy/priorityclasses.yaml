# IMPORTANT: KAI Scheduler treats any PriorityClass with value >= 100 as
# NON-preemptible, and non-preemptible workloads are hard-capped at their
# queue's deserved quota -- they can NEVER burst over quota, regardless of
# overQuotaWeight (verified live, 2026-07-06: a batch-queue test pod at the
# old value of 1000 was permanently rejected with "NonPreemptibleOverQuota"
# since the batch queue's quota is deliberately 0 -- the entire
# burst-into-idle-capacity design in queues.yaml requires values to stay
# UNDER 100 to remain preemptible). Values below kept the same relative
# ordering as before (course > interactive > batch), just rescaled under
# the threshold. See docs/troubleshooting.md for the full incident.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kai-course-high
value: 90
globalDefault: false
description: "Highest priority for course workloads. Reclaims resources from others."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kai-phd-interactive
value: 50
globalDefault: false
description: "High priority for PhD interactive work."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kai-batch-low
value: 10
globalDefault: false
description: "Lowest priority for batch jobs. Preemptible by courses and interactive."
---
# Below batch on purpose: GPU-requesting CI jobs (in-cluster GitHub
# Actions runners, see docs/superpowers/specs/
# 2026-07-25-github-actions-runners-design.md) must never compete with
# real batch work, let alone courses/interactive. Stays under the 100
# threshold (see note above) so it remains preemptible.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kai-ci-lowest
value: 1
globalDefault: false
description: "Lowest priority of all -- GPU-requesting CI jobs. Preemptible by everything."
