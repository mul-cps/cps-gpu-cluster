apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cps-native-gateway-authority-node
rules:
- apiGroups:
  - ''
  resourceNames:
  - k3s-wk-gpu2
  - k3s-wk-gpu3
  - k3s-wk-gpu1
  resources:
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cps-native-gateway-authority-node
subjects:
- kind: ServiceAccount
  name: cps-compute-controller
  namespace: cps-compute
metadata:
  name: cps-native-gateway-authority-node
