# Selected R620 workers only. GPU2 remains quarantined until policy qualification.
apiVersion: nvidia.com/v1alpha1
kind: NVIDIADriver
metadata:
  name: cps-r620-workers
spec:
  driverType: gpu
  repository: ghcr.io/mul-cps
  image: cps-nvidia-driver
  version: sha256:c3b71557aa17df43faad5a2661d81f1025ba355ac3adf784096de12cd2ef3e73
  kernelModuleType: auto
  usePrecompiled: false
  imagePullSecrets:
  - cps-native-image-pull
  nodeSelector:
    cps.unileoben.ac.at/driver: 620.70.06
  manager:
    repository: nvcr.io/nvidia/cloud-native
    image: k8s-driver-manager
    version: v0.12.1
    env:
    - name: ENABLE_GPU_POD_EVICTION
      value: 'false'
    - name: ENABLE_AUTO_DRAIN
      value: 'false'
  upgradePolicy:
    autoUpgrade: false
    maxParallelUpgrades: 1
    drain:
      enable: false
      force: false
      deleteEmptyDir: false
    podDeletion:
      force: false
      deleteEmptyDir: false
  default: false
  tolerations:
  - key: cps.unileoben.ac.at/maintenance
    operator: Exists
    effect: NoSchedule
  kernelModuleConfig:
    name: cps-r620-misc-config
