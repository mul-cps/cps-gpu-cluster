# NVIDIA GPU Operator Configuration for Ubuntu 24.04

# Driver configuration
# GPU Operator will manage NVIDIA drivers (includes nvidia-persistenced)
driver:
  enabled: true
  # Use precompiled mode for stability on Ubuntu 24.04.3 LTS
  # usePrecompiled: true
  repository: nvcr.io/nvidia
  image: driver
  # version: "550.127.05"
  # Manager configuration for driver installation
  manager:
    env:
      - name: ENABLE_GPU_POD_EVICTION
        value: "false"
      - name: ENABLE_AUTO_DRAIN
        value: "false"

# Daemonsets
daemonsets:
  priorityClassName: system-node-critical
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-pool
      operator: Exists
      effect: NoSchedule
  # Use UPDATE strategy to allow rolling updates
  updateStrategy: RollingUpdate

# Validator
validator:
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"

# NVIDIA Container Toolkit - K3s configuration
toolkit:
  enabled: true
  version: "v1.18.0"
  env:
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"

# Device Plugin
devicePlugin:
  enabled: true
  version: "v0.18.0"
  # NOTE: this key is functionally inert in this chart version -- the field
  # that actually drives the device plugin's --mig-strategy flag is the
  # separate top-level `mig.strategy` value below in this same file (see its
  # comment for the full story). Kept here at "none" to match, not to rely on.
  migStrategy: "none"
  #
  # ARCHITECTURE (revised 2026-07-06, supersedes the mps-sharing-default
  # design below): device plugin runs in PLAIN mode cluster-wide -- no
  # `sharing.mps` block, nvidia.com/gpu advertised as the real physical GPU
  # count (2 per node), not MPS replicas. GPU *sharing* now comes entirely
  # from KAI Scheduler's own gpu-memory annotation + its automatic
  # reservation-pod mechanism (namespace kai-resource-reservation), NOT from
  # the device plugin's sharing strategy. MPS itself (the control daemon +
  # CUDA_MPS_PINNED_DEVICE_MEM_LIMIT enforcement, set by JupyterHub's
  # PROFILE_CONFIGS) is still used for per-client VRAM enforcement -- the
  # nvidia-device-plugin-mps-control-daemon DaemonSet runs regardless of
  # this config's sharing strategy, so switching to plain mode does not
  # remove MPS enforcement.
  #
  # WHY THE CHANGE: an earlier "mps-sharing cluster-wide" design (see the
  # now-corrected docs/troubleshooting.md entry) was based on a live test
  # that concluded MPS-shared and multi-GPU-exclusive (nvidia.com/gpu: 2+)
  # requests could not coexist on the same device-plugin config. That test
  # was flawed -- it never checked the nvidia.com/gpu.memory node label
  # before declaring failure, and a corrected retest showed a plain-mode
  # node DOES serve both a gpu-memory-annotated pod (via a KAI reservation
  # pod backing one physical GPU) and a normal nvidia.com/gpu request (on
  # the other physical GPU) at the same time. Plain mode is strictly more
  # capable: it restores real nvidia.com/gpu: 2+ requests (needed for
  # genuine multi-GPU/NVLink distributed batch jobs -- impossible under
  # mps-sharing mode, which caps every request at 1 GPU) while still
  # supporting fractional gpu-memory scheduling through KAI's own mechanism.
  #
  # VERIFIED LIVE (2026-07-06, k3s-wk-gpu2, single-node prototype before
  # this cluster-wide rollout): nvidia.com/gpu.memory label correctly
  # populated (40960) under plain mode; a gpu-memory: "5120" pod scheduled
  # and ran, backed by an auto-created kai-resource-reservation pod; a
  # concurrent nvidia.com/gpu: 1 pod scheduled and ran on the node's other
  # physical GPU; a nvidia.com/gpu: 2 pod correctly stayed Pending (only 1
  # of 2 physical GPUs was free -- correct bin-packing, not a bug).
  #
  # Prerequisites this depends on (all already in place, see
  # docs/troubleshooting.md for the incident history):
  #   1. KAI Scheduler's `global.gpuSharing` Helm value must be true, or its
  #      admission webhook rejects gpu-memory requests outright.
  #   2. KAI's PriorityClass values must stay under 100 (see
  #      kai-policy/priorityclasses.yaml) or a workload becomes
  #      non-preemptible and hard-capped at its queue's quota.
  #   3. The nvidia.com/mig.strategy node label must read "none" -- GPU
  #      Feature Discovery re-derives it from ClusterPolicy's live spec.
  #
  # Still to validate at cluster scale (this rollout): reservation pods
  # appear correctly on all 4 nodes; JupyterHub profile spawns still work
  # end-to-end with the plain-mode nvidia.com/gpu resource type; priority
  # preemption and queue quotas still function; a real multi-GPU NCCL job
  # runs correctly now that nvidia.com/gpu: 2+ is available cluster-wide.
  config:
    create: true
    name: device-plugin-config
    default: plain
    data:
      mig-mixed: |-
        version: v1
        flags:
          migStrategy: mixed
      # Retained for potential future single-node fallback / comparison
      # testing -- no longer the cluster-wide default. See the ARCHITECTURE
      # comment above for why plain mode replaced this as the default.
      mps-sharing: |-
        version: v1
        sharing:
          mps:
            # failRequestsGreaterThanOne must be true for MPS - allocating
            # multiple partitions to one workload across multiple GPUs is
            # ambiguous under MPS, so the device plugin refuses it outright.
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                # Upper bound on concurrent MPS clients per physical GPU.
                # Real per-client VRAM enforcement comes from JupyterHub's
                # CUDA_MPS_PINNED_DEVICE_MEM_LIMIT env var + KAI's gpu-memory
                # scheduling accounting, not from this replica count - this
                # just needs to be >= the largest realistic number of
                # concurrent shared sessions on one GPU.
                replicas: 8
      plain: |-
        version: v1
        flags:
          migStrategy: none

# DCGM Exporter (GPU metrics)
dcgmExporter:
  enabled: true
  version: "4.4.1-4.6.0-distroless"
  serviceMonitor:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "false"

# GPU Feature Discovery
gfd:
  enabled: true
  version: "v0.18.0"

# MIG is retired cluster-wide (all nodes are permanently all-disabled/
# full-mode). THIS is the field that actually drives the device plugin's
# --mig-strategy flag (NOT devicePlugin.migStrategy above, which is a
# separate, functionally-inert key in this chart -- confirmed live
# 2026-07-06 after `devicePlugin.migStrategy: none` alone did not stop the
# device plugin crashing with "using --mig-strategy=mixed is not supported
# with MPS"; querying the live ClusterPolicy showed spec.mig.strategy, not
# spec.devicePlugin.migStrategy, was still "mixed"). Must be "none" for
# MPS sharing (system/gpu/gpu-operator/values.yaml devicePlugin.config
# default: mps-sharing) to work at all. See docs/troubleshooting.md.
mig:
  strategy: none

migManager:
  enabled: true
  config:
    name: "custom-mig-parted-config"
    default: "all-disabled"

  # Current node intent: all-disabled (full GPU, no MIG) on every GPU node,
  # k3s-wk-gpu1..4 alike. GPU sharing is handled by MPS + KAI Scheduler's
  # gpu-memory annotation instead of MIG geometry.

# Node Feature Discovery
nfd:
  enabled: true

# Operator configuration
operator:
  defaultRuntime: containerd
  initContainer:
    image: cuda
    repository: nvcr.io/nvidia
    version: 13.0.1-base-ubi9

# Tolerations for control plane if needed
tolerations: []
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

# Node selector - deploy only to GPU nodes
nodeSelector:
  accelerator: nvidia
