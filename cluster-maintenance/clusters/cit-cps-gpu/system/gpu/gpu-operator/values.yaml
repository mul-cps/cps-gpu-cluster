# NVIDIA GPU Operator Configuration for Ubuntu 24.04

# Driver configuration
# GPU Operator will manage NVIDIA drivers (includes nvidia-persistenced)
driver:
  enabled: true
  # Use precompiled mode for stability on Ubuntu 24.04.3 LTS
  # usePrecompiled: true
  repository: nvcr.io/nvidia
  image: driver
  # version: "550.127.05"
  # Manager configuration for driver installation
  manager:
    env:
      - name: ENABLE_GPU_POD_EVICTION
        value: "false"
      - name: ENABLE_AUTO_DRAIN
        value: "false"

# Daemonsets
daemonsets:
  priorityClassName: system-node-critical
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # Use UPDATE strategy to allow rolling updates
  updateStrategy: RollingUpdate

# Validator
validator:
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"

# NVIDIA Container Toolkit - K3s configuration
toolkit:
  enabled: true
  version: "v1.18.0"
  env:
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"

# Device Plugin
devicePlugin:
  enabled: true
  version: "v0.18.0"
  migStrategy: "mixed"
  # Explicit MIG config (no time-slicing/replicas); NOS will drive MIG layouts on gpu1-3
  config:
    create: true
    name: device-plugin-config
    default: mig-mixed
    data:
      mig-mixed: |-
        version: v1
        flags:
          migStrategy: mixed

# DCGM Exporter (GPU metrics)
dcgmExporter:
  enabled: true
  version: "4.4.1-4.6.0-distroless"
  serviceMonitor:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "false"

# GPU Feature Discovery
gfd:
  enabled: true
  version: "v0.18.0"

# MIG scheduling strategy for device plugin: allow both full GPU and MIG resources
mig:
  strategy: mixed

migManager:
  enabled: true
  config:
    name: "custom-mig-parted-config"
    default: "all-disabled"

  # MIG node intent (set via node-labeler + NOS):
  # - k3s-wk-gpu1..3: MIG mode on, NOS controls nvidia.com/mig.config using presets in custom-mig-config.yaml
  # - k3s-wk-gpu4: nvidia.com/mig.config=all-disabled (full GPU only; no MIG)

# Node Feature Discovery
nfd:
  enabled: true

# Operator configuration
operator:
  defaultRuntime: containerd
  initContainer:
    image: cuda
    repository: nvcr.io/nvidia
    version: 13.0.1-base-ubi9

# Tolerations for control plane if needed
tolerations: []
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

# Node selector - deploy only to GPU nodes
nodeSelector:
  accelerator: nvidia
