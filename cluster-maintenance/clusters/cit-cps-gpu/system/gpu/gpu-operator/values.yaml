# NVIDIA GPU Operator Configuration for Ubuntu 24.04

# Driver configuration
# GPU Operator will manage NVIDIA drivers (includes nvidia-persistenced)
driver:
  enabled: true
  # Use precompiled mode for stability on Ubuntu 24.04.3 LTS
  # usePrecompiled: true
  repository: nvcr.io/nvidia
  image: driver
  # version: "550.127.05"
  # Manager configuration for driver installation
  manager:
    env:
      - name: ENABLE_GPU_POD_EVICTION
        value: "false"
      - name: ENABLE_AUTO_DRAIN
        value: "false"

# Daemonsets
daemonsets:
  priorityClassName: system-node-critical
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-pool
      operator: Exists
      effect: NoSchedule
  # Use UPDATE strategy to allow rolling updates
  updateStrategy: RollingUpdate

# Validator
validator:
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"

# NVIDIA Container Toolkit - K3s configuration
toolkit:
  enabled: true
  version: "v1.18.0"
  env:
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"

# Device Plugin
devicePlugin:
  enabled: true
  version: "v0.18.0"
  # NOTE: this key is functionally inert in this chart version -- the field
  # that actually drives the device plugin's --mig-strategy flag is the
  # separate top-level `mig.strategy` value below in this same file (see its
  # comment for the full story). Kept here at "none" to match, not to rely on.
  migStrategy: "none"
  #
  # GPU sharing now goes through NVIDIA MPS, driven by JupyterHub profiles
  # (see user/jupyter/jupyterhub/values.yaml PROFILE_CONFIGS) + KAI
  # Scheduler's gpu-memory annotation for scheduling/bin-packing. The
  # "mps-sharing" config below is what actually starts the MPS control
  # daemon and advertises MPS-shareable nvidia.com/gpu capacity -- without
  # it, the gpu-memory annotation and CUDA_MPS_PINNED_DEVICE_MEM_LIMIT env
  # var that JupyterHub sets are correctly configured but inert.
  #
  # VERIFIED LIVE end-to-end (2026-07-06, gpu4 -> then cluster-wide): device
  # plugin healthy, MPS control daemon running, node advertised
  # nvidia.com/gpu=16 (8 MPS replicas x 2 physical GPUs). Confirmed a real
  # gpu-memory-annotated test pod (KAI queue=batch) scheduled successfully
  # and ran with the correct CUDA_MPS_PINNED_DEVICE_MEM_LIMIT env var and
  # full device visibility via nvidia-smi. Three additional fixes were
  # required to get here, all captured in docs/troubleshooting.md:
  #   1. KAI Scheduler's own `global.gpuSharing` Helm value (default false)
  #      must be enabled, or its admission webhook rejects any gpu-memory
  #      request outright.
  #   2. KAI's PriorityClass values must stay under 100 or the workload
  #      becomes non-preemptible and hard-capped at its queue's quota,
  #      permanently breaking the batch queue's quota=0 burst design (see
  #      kai-policy/priorityclasses.yaml -- rescaled from 1000/5000/10000
  #      to 10/50/90).
  #   3. The nvidia.com/mig.strategy node label must actually be "none",
  #      not just this Helm value -- GPU Feature Discovery re-derives it
  #      from ClusterPolicy's live spec, so a real `helm upgrade` (not just
  #      ad hoc kubectl patches) is needed for it to stick; node-labeler.yaml
  #      was rewritten to set this uniformly instead of the old MIG-era
  #      per-node scheme.
  #
  # Still unverified: the "elastic pool" exclusivity behavior (does a
  # full-gpu-memory request genuinely block MPS co-scheduling on the same
  # physical GPU) -- needs a dedicated test with two concurrent pods before
  # relying on it for real distributed-batch-vs-interactive coexistence.
  config:
    create: true
    name: device-plugin-config
    default: mps-sharing
    data:
      mig-mixed: |-
        version: v1
        flags:
          migStrategy: mixed
      mps-sharing: |-
        version: v1
        sharing:
          mps:
            # failRequestsGreaterThanOne must be true for MPS - allocating
            # multiple partitions to one workload across multiple GPUs is
            # ambiguous under MPS, so the device plugin refuses it outright.
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                # Upper bound on concurrent MPS clients per physical GPU.
                # Real per-client VRAM enforcement comes from JupyterHub's
                # CUDA_MPS_PINNED_DEVICE_MEM_LIMIT env var + KAI's gpu-memory
                # scheduling accounting, not from this replica count - this
                # just needs to be >= the largest realistic number of
                # concurrent shared sessions on one GPU.
                replicas: 8

# DCGM Exporter (GPU metrics)
dcgmExporter:
  enabled: true
  version: "4.4.1-4.6.0-distroless"
  serviceMonitor:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "false"

# GPU Feature Discovery
gfd:
  enabled: true
  version: "v0.18.0"

# MIG is retired cluster-wide (all nodes are permanently all-disabled/
# full-mode). THIS is the field that actually drives the device plugin's
# --mig-strategy flag (NOT devicePlugin.migStrategy above, which is a
# separate, functionally-inert key in this chart -- confirmed live
# 2026-07-06 after `devicePlugin.migStrategy: none` alone did not stop the
# device plugin crashing with "using --mig-strategy=mixed is not supported
# with MPS"; querying the live ClusterPolicy showed spec.mig.strategy, not
# spec.devicePlugin.migStrategy, was still "mixed"). Must be "none" for
# MPS sharing (system/gpu/gpu-operator/values.yaml devicePlugin.config
# default: mps-sharing) to work at all. See docs/troubleshooting.md.
mig:
  strategy: none

migManager:
  enabled: true
  config:
    name: "custom-mig-parted-config"
    default: "all-disabled"

  # Current node intent: all-disabled (full GPU, no MIG) on every GPU node,
  # k3s-wk-gpu1..4 alike. GPU sharing is handled by MPS + KAI Scheduler's
  # gpu-memory annotation instead of MIG geometry.

# Node Feature Discovery
nfd:
  enabled: true

# Operator configuration
operator:
  defaultRuntime: containerd
  initContainer:
    image: cuda
    repository: nvcr.io/nvidia
    version: 13.0.1-base-ubi9

# Tolerations for control plane if needed
tolerations: []
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"

# Node selector - deploy only to GPU nodes
nodeSelector:
  accelerator: nvidia
