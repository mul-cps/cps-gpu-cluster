name: gpu-operator
defaultNamespace: gpu-operator
helm:
  chart: gpu-operator
  repo: https://nvidia.github.io/gpu-operator
  version: v26.3.3
  releaseName: gpu-operator
  valuesFiles:
  - values.yaml
  - preserve-operands.yaml
  - lifecycle-values.yaml
labels:
  app: gpu-operator
  name: gpu-operator
diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: DaemonSet
    operations:
    - op: remove
      path: /spec/template/metadata/annotations
