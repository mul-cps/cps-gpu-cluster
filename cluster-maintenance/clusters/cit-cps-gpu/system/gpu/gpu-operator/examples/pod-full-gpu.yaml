# Full GPU workload with taint toleration - can run on gpu4 (tainted)
# Also works on gpu2/gpu3 since they have gpu-pool=full label
apiVersion: v1
kind: Pod
metadata:
  name: full-gpu-demo
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    gpu-pool: full
  tolerations:
    - key: gpu-pool
      value: full
      effect: NoSchedule
      operator: Equal
  containers:
    - name: cuda
      image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
