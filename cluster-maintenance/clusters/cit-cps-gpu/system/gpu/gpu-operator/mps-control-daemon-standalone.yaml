# Standalone MPS control daemon, decoupled from the device plugin's
# node-level sharing config -- REQUIRED for the plain-mode + KAI-native
# gpu-memory sharing architecture (see the ARCHITECTURE comment in
# values.yaml's devicePlugin.config section).
#
# WHY THIS EXISTS: GPU Operator's own nvidia-device-plugin-mps-control-daemon
# DaemonSet (owned/reconciled by ClusterPolicy) only schedules onto nodes
# labeled nvidia.com/mps.capable=true, and GPU Feature Discovery only sets
# that label true when the node's *resolved device-plugin config* contains a
# sharing.mps block. Since this cluster's device-plugin default is now
# "plain" (no sharing block -- needed to keep nvidia.com/gpu: 2+ requests
# working for real multi-GPU/NVLink batch jobs), mps.capable is false
# cluster-wide and the operator's own MPS daemon scales itself to zero
# replicas everywhere -- confirmed live 2026-07-06 (desiredNumberScheduled: 0
# on all 4 nodes immediately after the plain-mode rollout). GFD re-derives
# mps.capable continuously, so overriding the label via node-labeler.yaml
# would just get reverted on GFD's next scan (same class of problem as the
# earlier mig.strategy label fight -- see docs/troubleshooting.md).
#
# The fix: run our own MPS control daemon, cloned from the operator's own
# DaemonSet spec (kubectl get ds -n gpu-operator
# nvidia-device-plugin-mps-control-daemon -o yaml, captured 2026-07-06),
# with the mps.capable requirement dropped from nodeSelector. This is NOT
# owned by ClusterPolicy (no ownerReference), so the operator's controller
# will not fight or revert it. This matches upstream KAI Scheduler's own
# documented expectation (docs/gpu-sharing/mps/README.md in the KAI repo):
# "MPS server is running on all GPU-enabled hosts" is a platform
# prerequisite the operator itself does not guarantee outside its own
# sharing-mode bookkeeping -- KAI does not care how the MPS server got
# there, only that CUDA_MPS_PIPE_DIRECTORY resolves to a live one.
#
# The device-plugin-config ConfigMap's "mps-sharing" key is kept
# specifically so this daemon's config-manager sidecar can read a resource
# name/path definition (nvidia.com/gpu) from it -- it is no longer used for
# actual Kubernetes resource-sharing/replica accounting (that would re-cap
# every gpu-memory/nvidia.com/gpu request at 1 GPU per pod, which is exactly
# what plain mode exists to avoid). It only tells the daemon which pipe/log
# subdirectory name to use, matching the CUDA_MPS_PIPE_DIRECTORY /
# CUDA_MPS_LOG_DIRECTORY paths already wired into JupyterHub profiles and
# the batch job examples (/mps/nvidia.com/gpu/{pipe,log}).
#
# RE-EVALUATE ON EVERY GPU OPERATOR UPGRADE (checked 2026-07-06 against
# v25.10.0 -- currently deployed -- and v26.3.3, the latest available at
# the time: no values.yaml/Config-CR knob exists in either version to
# decouple the operator's own MPS daemon from `mps.capable`; confirmed via
# `helm show values nvidia/gpu-operator --version <ver>` and by pulling
# both charts and grepping templates/ for any mps-related file -- there is
# none, because the operator's own mps-control-daemon DaemonSet is
# generated by its Go controller reconciling ClusterPolicy, not by a
# static Helm template, so a chart upgrade alone can't fix this). No
# upstream GitHub issue found addressing this specific gap either
# (searched NVIDIA/gpu-operator issues for "mps.capable nodeSelector").
#
# To verify this workaround is still needed and still in sync after any
# future GPU Operator version bump, diff this file's containers/volumes
# against the operator's own (now-unused) DaemonSet spec:
#   kubectl get ds -n gpu-operator nvidia-device-plugin-mps-control-daemon -o yaml
# specifically: the `image:` tag on both `mps-control-daemon-ctr` and
# `config-manager` containers (should track devicePlugin.version in
# gpu-operator/values.yaml), the mount paths under
# `/run/nvidia/mps`/`/mps`, and the toolkit-validation initContainer's
# `nvcr.io/nvidia/gpu-operator:<version>` image (should track the
# operator's own appVersion). If the operator's own DaemonSet's
# nodeSelector no longer includes `nvidia.com/mps.capable`, or a new
# Config-CR field appears under `spec.admission`/`spec.binder` equivalent
# for MPS, this whole file can likely be deleted.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mps-control-daemon-standalone
  namespace: gpu-operator
  labels:
    app: mps-control-daemon-standalone
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mps-control-daemon-standalone
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: mps-control-daemon-standalone
    spec:
      hostPID: true
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      serviceAccountName: nvidia-device-plugin
      # Same node scope as the rest of the GPU Operator stack -- every real
      # GPU worker, not gated on mps.capable.
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: gpu-pool
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: toolkit-validation
          image: nvcr.io/nvidia/gpu-operator:v25.10.0
          command: ["sh", "-c"]
          args:
            - "until [ -f /run/nvidia/validations/toolkit-ready ]; do echo waiting for nvidia container stack to be setup; sleep 5; done"
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: run-nvidia
              mountPath: /run/nvidia
              mountPropagation: HostToContainer
        - name: mps-control-daemon-mounts
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          command: ["mps-control-daemon", "mount-shm"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: mps-root
              mountPath: /mps
              mountPropagation: Bidirectional
        - name: config-manager-init
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          command: ["config-manager"]
          env:
            - name: ONESHOT
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_LABEL
              # Deliberately NOT nvidia.com/device-plugin.config -- that
              # label now drives the real (plain) device-plugin config.
              # This daemon always reads the mps-sharing key regardless of
              # the node's actual scheduling mode, so it only needs a
              # constant default, never a per-node override.
              value: mps-control-daemon-standalone-unused-label
            - name: CONFIG_FILE_SRCDIR
              value: /available-configs
            - name: CONFIG_FILE_DST
              value: /config/config.yaml
            - name: DEFAULT_CONFIG
              value: mps-sharing
            - name: SEND_SIGNAL
              value: "false"
            - name: FALLBACK_STRATEGIES
              value: empty
          volumeMounts:
            - name: config
              mountPath: /config
            - name: device-plugin-config
              mountPath: /available-configs
      containers:
        - name: mps-control-daemon-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          # Force GPU compute mode to DEFAULT after the daemon's own startup
          # (which hardcodes EXCLUSIVE_PROCESS -- confirmed live 2026-07-22,
          # no config knob exists anywhere in GPU Operator/device-plugin to
          # change this, see docs/troubleshooting.md). EXCLUSIVE_PROCESS
          # allows only one CUDA context per GPU; since this daemon's own
          # nvidia-cuda-mps-server permanently holds that slot, ANY
          # plain-exclusive (nvidia.com/gpu: N, non-MPS) pod that KAI
          # schedules onto a GPU with no *active* MPS client still fails
          # with "CUDA-capable device(s) is/are busy or unavailable" --
          # this cluster's elastic unified-pool design (see
          # docs/gpu-scheduling-architecture.md) means any GPU can flip
          # between MPS-shared and exclusive use, so this recurs by
          # construction, not as a rare edge case. DEFAULT mode lets an
          # MPS server and a separate exclusive-mode client each hold their
          # own context on the same GPU, which verified testing (2026-07-22,
          # k3s-wk-gpu4) showed does NOT weaken MPS memory enforcement --
          # CUDA_MPS_PINNED_DEVICE_MEM_LIMIT still OOMs a client at exactly
          # its configured limit. It also does not create a scheduling-level
          # double-booking risk for well-behaved pods: KAI's reservation pod
          # requests a real nvidia.com/gpu extended resource, which kubelet's
          # own device manager tracks and will never hand the same physical
          # GPU UUID to a second pod regardless of which scheduler placed it
          # (reproduced live: a plain-exclusive test pod correctly got
          # "Insufficient nvidia.com/gpu" while a GPU had a live MPS
          # reservation). The residual gap (a privileged pod with direct
          # hostPath device access bypassing device-plugin accounting
          # entirely) predates this change and is orthogonal to compute mode.
          #
          # This must be re-applied after every restart of this container --
          # confirmed live that the compute mode reverts to EXCLUSIVE_PROCESS
          # every time (pod delete, node reboot, image upgrade), since it's
          # set by the daemon binary's own startup, not persisted by the
          # driver. Hence the wrapper below, rather than an init container
          # (runs too early, daemon overwrites it) or a postStart hook (races
          # the daemon's own startup, not guaranteed to run after it).
          #
          # NOT a one-shot "wait for ready, then set once": confirmed live
          # 2026-07-22 that this races and loses. The /mps/nvidia.com/gpu/
          # .started marker lives on the hostPath mps-root volume and
          # survives pod restarts, so on a restart it already exists and the
          # wait loop returns immediately -- before the daemon binary's own
          # (asynchronous) EXCLUSIVE_PROCESS-setting has actually happened
          # for *this* instance, which then runs after our override and wins.
          # A background loop that keeps re-asserting DEFAULT for the
          # container's whole lifetime sidesteps the race entirely and is
          # self-healing against any future re-assertion by the daemon.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mps-control-daemon &
              daemon_pid=$!
              while kill -0 "$daemon_pid" 2>/dev/null; do
                nvidia-smi -c DEFAULT >/dev/null 2>&1
                sleep 5
              done &
              wait "$daemon_pid"
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: MIG_STRATEGY
              value: none
          volumeMounts:
            - name: mps-shm
              mountPath: /dev/shm
            - name: mps-root
              mountPath: /mps
            - name: config
              mountPath: /config
            - name: device-plugin-config
              mountPath: /available-configs
        - name: config-manager
          image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          command: ["config-manager"]
          securityContext:
            privileged: true
          env:
            - name: ONESHOT
              value: "false"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_LABEL
              value: mps-control-daemon-standalone-unused-label
            - name: CONFIG_FILE_SRCDIR
              value: /available-configs
            - name: CONFIG_FILE_DST
              value: /config/config.yaml
            - name: DEFAULT_CONFIG
              value: mps-sharing
            - name: SEND_SIGNAL
              value: "true"
            - name: SIGNAL
              value: "1"
            - name: PROCESS_TO_SIGNAL
              value: /usr/bin/mps-control-daemon
            - name: FALLBACK_STRATEGIES
              value: empty
          volumeMounts:
            - name: config
              mountPath: /config
            - name: device-plugin-config
              mountPath: /available-configs
      volumes:
        - name: run-nvidia
          hostPath:
            path: /run/nvidia
            type: Directory
        - name: mps-root
          hostPath:
            path: /run/nvidia/mps
            type: DirectoryOrCreate
        - name: mps-shm
          hostPath:
            path: /run/nvidia/mps/shm
        - name: device-plugin-config
          configMap:
            name: device-plugin-config
        - name: config
          emptyDir: {}
