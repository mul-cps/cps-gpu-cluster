# Superseded the old per-node MIG-vs-full split (gpu1/gpu2 MIG, gpu3 mixed,
# gpu4 full) from when the cluster used static MIG partitioning. That scheme
# is retired -- all 4 GPU nodes now run permanently in full/non-MIG mode,
# and GPU sharing goes through MPS + KAI Scheduler's gpu-memory annotation
# instead (see dynamic-mig-layout-instructions.md).
#
# IMPORTANT: this is a Helm post-install/post-upgrade hook Job, so it RE-RUNS
# on every gpu-operator chart upgrade/reconcile. Leaving the old mixed/single
# strategy labels in this script (even if fixed live via kubectl) would
# silently re-apply the stale values on the next Fleet/Helm reconcile --
# confirmed live 2026-07-06: KAI Scheduler's own scheduling plugin reads
# nvidia.com/mig.strategy and refused non-MIG-sharing pods on any node
# labeled "mixed" ("non MIG jobs cant run on a node with MigStrategy=mixed"),
# even though the node's actual MIG config was already all-disabled. This
# script now applies the correct uniform state instead of just documenting it.
#
# The gpu-pool=mig/full labels/taint are also removed here since there's no
# more per-node pool distinction under the elastic MPS model (every node is
# now the same "full, MPS-shared" pool) -- see gpu-operator/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: label-gpu1-mig
  namespace: gpu-operator
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: node-labeler
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Labeling GPU nodes as uniform full-mode/MPS pool..."

          for n in k3s-wk-gpu1 k3s-wk-gpu2 k3s-wk-gpu3 k3s-wk-gpu4; do
            kubectl label node ${n} nvidia.com/mig.strategy=none --overwrite
            kubectl label node ${n} nvidia.com/mig.config=all-disabled --overwrite
            kubectl label node ${n} gpu-pool- --overwrite || true
            kubectl taint node ${n} gpu-pool- --overwrite || true
          done
          echo "Labels applied."
      restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler
subjects:
- kind: ServiceAccount
  name: node-labeler
  namespace: gpu-operator
roleRef:
  kind: ClusterRole
  name: node-labeler
  apiGroup: rbac.authorization.k8s.io
