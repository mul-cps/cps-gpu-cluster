# HISTORICAL/SUPERSEDED: this Job encodes a per-node MIG-vs-full split
# (gpu1/gpu2 MIG, gpu3 mixed, gpu4 full) from when the cluster used static
# MIG partitioning. That scheme is retired — all 4 GPU nodes now run
# permanently in full/non-MIG mode (nvidia.com/mig.config=all-disabled),
# and GPU sharing goes through MPS + KAI Scheduler's gpu-memory annotation
# instead (see dynamic-mig-layout-instructions.md). The gpu-pool=mig/full
# labels/taints below no longer reflect an active partitioning scheme,
# though the gpu-pool label key itself may still be referenced elsewhere
# in scheduling manifests. Left in place as-is pending a follow-up cleanup
# once the MPS migration settles; do not treat this as current MIG policy.
apiVersion: batch/v1
kind: Job
metadata:
  name: label-gpu1-mig
  namespace: gpu-operator
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: node-labeler
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Labeling GPU pools..."
          
          # k3s-wk-gpu1, k3s-wk-gpu2: MIG with 1g.5gb slices (7 per GPU = 14 per node, 28 total)
          for n in k3s-wk-gpu1 k3s-wk-gpu2; do
            kubectl label node ${n} gpu-pool=mig --overwrite
            kubectl label node ${n} nvidia.com/mig.strategy=mixed --overwrite
            kubectl label node ${n} nvidia.com/mig.config=a100-1g.5gb-7 --overwrite
            kubectl taint node ${n} gpu-pool- --overwrite || true
          done
          
          # k3s-wk-gpu3: Custom profile (1 MIG GPU, 1 full GPU)
          kubectl label node k3s-wk-gpu3 gpu-pool=mig --overwrite
          kubectl label node k3s-wk-gpu3 nvidia.com/mig.strategy=mixed --overwrite
          kubectl label node k3s-wk-gpu3 nvidia.com/mig.config=one-mig-one-full --overwrite
          kubectl taint node k3s-wk-gpu3 gpu-pool- --overwrite || true
          
          # k3s-wk-gpu4: Full GPU access (MIG disabled)
          kubectl label node k3s-wk-gpu4 gpu-pool=full --overwrite
          kubectl label node k3s-wk-gpu4 nvidia.com/mig.config=all-disabled --overwrite
          kubectl label node k3s-wk-gpu4 nvidia.com/mig.strategy=single --overwrite
          kubectl taint node k3s-wk-gpu4 gpu-pool=full:NoSchedule --overwrite
          echo "Labels and taints applied."
      restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler
subjects:
- kind: ServiceAccount
  name: node-labeler
  namespace: gpu-operator
roleRef:
  kind: ClusterRole
  name: node-labeler
  apiGroup: rbac.authorization.k8s.io
