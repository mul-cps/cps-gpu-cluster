# NGINX Ingress Controller Configuration

controller:
  # Service configuration - LoadBalancer type for MetalLB
  service:
    enabled: true
    type: LoadBalancer
    # MetalLB will auto-assign IP from pool (10.21.0.50-60)
    # Optionally request specific IP:
    loadBalancerIP: 10.21.0.50
    annotations:
      # MetalLB configuration
      metallb.universe.tf/allow-shared-ip: "ingress-shared"
    externalTrafficPolicy: Local  # Preserve source IP
    
  # Ingress class configuration
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: "k8s.io/ingress-nginx"
  
  # Publish service on all GPU worker nodes
  kind: DaemonSet
  
  # Metrics for Prometheus
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: cattle-monitoring-system
  
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  
  # Enable real IP forwarding (important for logging and auth)
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
  
  # Autoscaling disabled (using DaemonSet for HA)
  autoscaling:
    enabled: false

  # Default SSL certificate for *.dshl.unileoben.ac.at services
  defaultSSLCertificate: cert-manager/dshl-wildcard

# Default backend (optional 404 page)
defaultBackend:
  enabled: false

# RBAC
rbac:
  create: true

# Service account
serviceAccount:
  create: true
  name: ingress-nginx

tcp:
  22: "jupyterhub/jupyterhub-ssh:22"
  # SFTP -- routes to the SEPARATE jupyterhub-sftp Deployment/Service (a
  # standalone OpenSSH sftp-server mounting jupyterhub-shared-storage), via
  # that service's own port 22 (which forwards to the pod's real listener on
  # container port 2222). CORRECTED 2026-07-06: an earlier version of this
  # entry pointed at jupyterhub-ssh:2222 instead -- that pod declares a 2222
  # container port but its patched code (chart/templates/patch-configmap.yaml)
  # only implements plain SSH-to-terminal forwarding with zero SFTP support;
  # confirmed live that nothing listens there (connection refused). This was
  # the actual root cause of "SFTP never worked" -- no external port was ever
  # forwarded to the component that actually runs an SFTP server, not a
  # broken server. See user/jupyter/jupyterhub-ssh/values.yaml.
  2222: "jupyterhub/jupyterhub-sftp:22"
