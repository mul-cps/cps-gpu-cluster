apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-ui-viewer
  namespace: cps-argo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cps-argo-ui-viewer
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates, cronworkflows, clusterworkflowtemplates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cps-argo-ui-viewer
subjects:
  - kind: ServiceAccount
    name: argo-ui-viewer
    namespace: cps-argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cps-argo-ui-viewer
