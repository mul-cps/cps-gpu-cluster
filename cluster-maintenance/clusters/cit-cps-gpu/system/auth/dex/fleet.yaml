name: dex-idp-broker
defaultNamespace: dex

labels:
  app: dex
  name: dex-idp-broker

helm:
  chart: dex
  repo: https://charts.dexidp.io
  version: "0.24.1"
  releaseName: dex
  createNamespace: true
  valuesFiles:
  - values.yaml

kustomize:
  dir: .

dependsOn:
- selector:
    matchLabels:
      name: ingress-nginx

# dex/dex chart's `staticClients[].secret` field does NOT support Dex's
# native $ENV_VAR expansion (confirmed against dexidp/dex source, see
# values.yaml's header comment and dexidp/dex#4212 -- connectors DO
# support it, staticClients does not). This patch adds an initContainer
# that renders the real Rancher-facing client secret into a copy of the
# chart-generated config Secret on a shared emptyDir, and repoints the
# main container's config mount at that rendered copy instead of the
# original (which still contains the literal, unexpanded placeholder
# string). The secret value is base64-alphabet only (A-Za-z0-9+/=, per
# `openssl rand -base64`), which contains no sed-special characters
# (no `&`, and `|` is used as the delimiter), so a plain `sed` substitution
# is safe without escaping.
#
# CRITICAL FIX (2026-07-23, review): clusterSelector below originally used
# `name: cit-cps-gpu` (copied from user/llm/open-webui/fleet.yaml's
# existing envFrom patch) -- this label does NOT exist on the live
# fleet.cattle.io Cluster object, which is actually named `local` with
# label `name: local` (confirmed via `kubectl get clusters.fleet.cattle.io -A`).
# A non-matching selector means the patch silently never applies -- no
# error, no warning, just an unpatched base manifest reconciling
# successfully. This exact bug was found to ALSO affect the open-webui
# precedent this was copied from: its OAuth envFrom patch has never
# actually applied live either (confirmed empty envFrom on the live
# StatefulSet), meaning Open WebUI's OAuth login (SOPS-migrated in an
# earlier, separate piece of work) is still not actually wired in -- a
# pre-existing bug, out of scope to fix here, but flagged for a
# follow-up fix to open-webui/fleet.yaml.
targetCustomizations:
- name: local
  clusterSelector:
    matchLabels:
      name: local
  patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: dex
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: config
            secret:
              secretName: dex
          - name: config-rendered
            emptyDir: {}
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: render-static-client-secret
            image: bitnami/kubectl:latest
            command:
              - sh
              - -c
              - |
                set -eu
                sed "s|\$DEX_RANCHER_CLIENT_SECRET|$DEX_RANCHER_CLIENT_SECRET|g" /etc/dex-src/config.yaml > /etc/dex-rendered/config.yaml
            env:
              - name: DEX_RANCHER_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: dex-rancher-client
                    key: clientSecret
            volumeMounts:
              - name: config
                mountPath: /etc/dex-src
                readOnly: true
              - name: config-rendered
                mountPath: /etc/dex-rendered
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: config-rendered
            mountPath: /etc/dex
            readOnly: true
