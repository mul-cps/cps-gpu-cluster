# Same mechanism as rancher-secret-sync-job.yaml (see that file's header
# comment for the full reasoning): dex/dex chart's `staticClients[].secret`
# field does not support Dex's $ENV_VAR expansion. This Job patches the
# real JupyterHub static-client secret into the chart-rendered config
# Secret in place after Helm creates it, replacing the literal
# `$DEX_JHUB_CLIENT_SECRET` placeholder string, then restarts the Dex
# Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex-jhub-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-jhub-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["dex", "dex-jhub-client"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["dex"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-jhub-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-jhub-secret-sync
subjects:
  - kind: ServiceAccount
    name: dex-jhub-secret-sync
    namespace: dex
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dex-jhub-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: dex-jhub-secret-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              set -eu
              RAW=$(kubectl get secret dex-jhub-client -n dex -o jsonpath='{.data.clientSecret}')
              SECRET=$(printf '%s' "$RAW" | base64 -d)
              if [ -z "$SECRET" ]; then
                echo "dex-jhub-client clientSecret is empty; refusing to patch" >&2
                exit 1
              fi
              CONFIG=$(kubectl get secret dex -n dex -o jsonpath='{.data.config\.yaml}' | base64 -d)
              if [ -z "$CONFIG" ]; then
                echo "dex config Secret is empty or unreadable; refusing to treat as already-patched" >&2
                exit 1
              fi
              if ! printf '%s' "$CONFIG" | grep -q '\$DEX_JHUB_CLIENT_SECRET'; then
                echo "placeholder \$DEX_JHUB_CLIENT_SECRET not found in rendered config.yaml; nothing to patch (already patched, or chart output changed unexpectedly)" >&2
                exit 0
              fi
              NEW_CONFIG=$(printf '%s' "$CONFIG" | sed "s|\$DEX_JHUB_CLIENT_SECRET|$SECRET|g" | base64 -w0)
              kubectl patch secret dex -n dex --type=json -p="[{\"op\":\"replace\",\"path\":\"/data/config.yaml\",\"value\":\"$NEW_CONFIG\"}]"
              kubectl rollout restart deployment/dex -n dex
