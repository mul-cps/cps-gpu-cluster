# dex/dex chart's `staticClients[].secret` field does not support Dex's
# $ENV_VAR expansion (see values.yaml's header comment for the full
# investigation -- connectors DO support it via os.ExpandEnv, staticClients
# does not, tracked upstream as dexidp/dex#4212). This CronJob patches the
# real static-client secrets into the chart-rendered `dex` config Secret
# in place, replacing literal `$DEX_..._CLIENT_SECRET` placeholder strings,
# then restarts the Dex Deployment if anything changed.
#
# REDESIGNED 2026-07-24 (INCIDENT): this was originally two separate
# Helm post-install/post-upgrade hook Jobs (one per static client). Both
# times a second static client was added on top of an already-deployed
# Dex release, the OLDER hook Job silently did not re-fire for the new
# Helm revision (root cause not fully understood -- Helm hook re-fire
# guarantees didn't hold here in practice, see docs/troubleshooting.md),
# while the chart's OWN config Secret template DID re-render from scratch
# on every upgrade, resetting ALL placeholders including the older
# client's. Net effect: the older client's secret silently reverted to
# the raw, non-functional placeholder string after every subsequent Dex
# upgrade that touched staticClients -- confirmed live, required manual
# emergency `kubectl patch` recovery both times.
#
# Fixed by converting to a single self-healing CronJob that doesn't
# depend on Helm hook re-fire semantics at all -- it re-checks and
# re-patches ALL known static-client placeholders in ONE atomic
# read-modify-write cycle every 5 minutes, regardless of whether/when a
# Helm upgrade happened. Consolidated into one CronJob (not one per
# client) specifically to avoid two independent schedules racing on the
# same config Secret's full-field replace.
#
# Add a new client's placeholder substitution to the script below (and
# its Secret name to this Role's `get` resourceNames) whenever a new Dex
# staticClient is added -- do not go back to a per-client hook Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex-secrets-sync
  namespace: dex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-secrets-sync
  namespace: dex
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["dex-rancher-client", "dex-jhub-client"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["dex"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["dex"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-secrets-sync
  namespace: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-secrets-sync
subjects:
  - kind: ServiceAccount
    name: dex-secrets-sync
    namespace: dex
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dex-secrets-sync
  namespace: dex
spec:
  schedule: "*/2 * * * *"
  startingDeadlineSeconds: 200
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: dex-secrets-sync
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: bitnami/kubectl:latest
              command:
                - sh
                - -c
                - |
                  set -eu

                  get_secret() {
                    RAW=$(kubectl get secret "$1" -n dex -o jsonpath='{.data.clientSecret}')
                    printf '%s' "$RAW" | base64 -d
                  }

                  RANCHER_SECRET=$(get_secret dex-rancher-client)
                  JHUB_SECRET=$(get_secret dex-jhub-client)

                  if [ -z "$RANCHER_SECRET" ] || [ -z "$JHUB_SECRET" ]; then
                    echo "one or more client secrets empty/unreadable; refusing to patch" >&2
                    exit 1
                  fi

                  CONFIG=$(kubectl get secret dex -n dex -o jsonpath='{.data.config\.yaml}' | base64 -d)
                  if [ -z "$CONFIG" ]; then
                    echo "dex config Secret empty/unreadable; refusing to treat as already-patched" >&2
                    exit 1
                  fi

                  if ! printf '%s' "$CONFIG" | grep -qE '\$DEX_(RANCHER|JHUB)_CLIENT_SECRET'; then
                    echo "no known placeholders found; nothing to patch" >&2
                    exit 0
                  fi

                  NEW_CONFIG=$(printf '%s' "$CONFIG" \
                    | sed "s|\$DEX_RANCHER_CLIENT_SECRET|$RANCHER_SECRET|g" \
                    | sed "s|\$DEX_JHUB_CLIENT_SECRET|$JHUB_SECRET|g" \
                    | base64 -w0)

                  kubectl patch secret dex -n dex --type=json \
                    -p="[{\"op\":\"replace\",\"path\":\"/data/config.yaml\",\"value\":\"$NEW_CONFIG\"}]"
                  kubectl rollout restart deployment/dex -n dex
                  echo "patched at least one placeholder; restarted dex"
