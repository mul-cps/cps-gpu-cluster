# dex/dex chart's `staticClients[].secret` field does not support Dex's
# $ENV_VAR expansion (see fleet.yaml's header comment for the full
# investigation). This Job patches the real Rancher-facing client
# secret into the chart-rendered `dex` config Secret in place, after
# Helm creates it, replacing the literal `$DEX_RANCHER_CLIENT_SECRET`
# placeholder string -- then restarts the Dex Deployment so the running
# process picks up the corrected config.yaml (Dex only reads its config
# at startup, it does not hot-reload).
#
# Mirrors rancher/oidc-sync-job.yaml's proven-live pattern: bitnami/kubectl:latest
# (has a working shell, empirically verified live 2026-07-23 -- see
# docs/troubleshooting.md), Helm post-install/post-upgrade hook so it
# re-runs on every Fleet reconcile, `before-hook-creation` delete policy
# so the most recent run stays inspectable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex-rancher-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-rancher-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["dex", "dex-rancher-client"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["dex"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-rancher-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-rancher-secret-sync
subjects:
  - kind: ServiceAccount
    name: dex-rancher-secret-sync
    namespace: dex
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dex-rancher-secret-sync
  namespace: dex
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: dex-rancher-secret-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              set -eu
              RAW=$(kubectl get secret dex-rancher-client -n dex -o jsonpath='{.data.clientSecret}')
              SECRET=$(printf '%s' "$RAW" | base64 -d)
              if [ -z "$SECRET" ]; then
                echo "dex-rancher-client clientSecret is empty; refusing to patch" >&2
                exit 1
              fi
              CONFIG=$(kubectl get secret dex -n dex -o jsonpath='{.data.config\.yaml}' | base64 -d)
              if [ -z "$CONFIG" ]; then
                echo "dex config Secret is empty or unreadable; refusing to treat as already-patched" >&2
                exit 1
              fi
              if ! printf '%s' "$CONFIG" | grep -q '\$DEX_RANCHER_CLIENT_SECRET'; then
                echo "placeholder \$DEX_RANCHER_CLIENT_SECRET not found in rendered config.yaml; nothing to patch (already patched, or chart output changed unexpectedly)" >&2
                exit 0
              fi
              NEW_CONFIG=$(printf '%s' "$CONFIG" | sed "s|\$DEX_RANCHER_CLIENT_SECRET|$SECRET|g" | base64 -w0)
              kubectl patch secret dex -n dex --type=json -p="[{\"op\":\"replace\",\"path\":\"/data/config.yaml\",\"value\":\"$NEW_CONFIG\"}]"
              kubectl rollout restart deployment/dex -n dex
