# Dex IdP broker — federates the CPS and CIT Authentik instances behind a
# single OIDC issuer that Rancher's Generic OIDC auth provider talks to.
#
# Secret-sourced values (connector clientSecret, Rancher staticClient secret)
# are NEVER placed as literals in this file. The dex/dex chart's `config` key
# is raw YAML passed straight through to Dex's own config.yaml, so a Helm/Fleet
# template can't inject a Secret value into it directly. Instead we use the
# chart's `envVars` hook (templates/deployment.yaml) to mount the three
# SopsSecrets (see kustomization.yaml) as container env vars, and reference
# them from `config` using Dex's native `$ENV_VAR` / `${VAR}` expansion
# (os.ExpandEnv), gated by the DEX_EXPAND_ENV feature flag (default: enabled).
#
# VERIFIED against dexidp/dex master source (2026-07-23), not just docs:
#   - cmd/dex/config.go: Storage.UnmarshalJSON, Signer.UnmarshalJSON, and
#     Connector.UnmarshalJSON each call expandEnvInMap()/os.ExpandEnv() when
#     featureflags.ExpandEnv.Enabled() (default true). This IS how the
#     `clientSecret: $DEX_..._CLIENT_SECRET` lines below get resolved for the
#     two OIDC connectors -- confirmed working end-to-end via `helm template`
#     (env vars land in the Deployment; rendered config Secret contains the
#     literal `$DEX_CPS_CLIENT_SECRET` placeholder string, not env expansion
#     itself -- that final substitution happens inside the Dex process at
#     startup, per the source above, not at Helm/Fleet render time).
#   - storage/static.go (backing `staticClients`) has NO UnmarshalJSON /
#     ExpandEnv call at all -- confirmed by reading the file directly, and by
#     dexidp/dex issue #4212 ("Support Environment variable expansion in
#     staticClients and other top-level config sections", open, unresolved).
#     So env-var expansion does NOT reach `staticClients[].secret`.
#
# RESOLVED (2026-07-23): the `staticClients[].secret` value below is
# written in the same `$DEX_RANCHER_CLIENT_SECRET` form for consistency,
# but per the above it is NOT expanded by Dex itself -- rancher-secret-sync-job.yaml
# (a Helm post-install/post-upgrade hook Job, same proven pattern as
# rancher/oidc-sync-job.yaml) patches the real value into the rendered
# config Secret in place after Helm creates it, then restarts the Dex
# Deployment. See fleet.yaml and rancher-secret-sync-job.yaml for the
# full reasoning (an earlier attempt used a Fleet targetCustomizations
# JSON-patch, which turned out to be invalid Fleet syntax -- see
# fleet.yaml's history/comment). Track dexidp/dex#4212 upstream -- if
# native staticClients env expansion ships, this sync-Job workaround can
# be removed.

envVars:
  - name: DEX_CPS_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-cps-connector
        key: clientSecret
  - name: DEX_CIT_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-cit-connector
        key: clientSecret
  - name: DEX_RANCHER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-rancher-client
        key: clientSecret
  - name: DEX_JHUB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-jhub-client
        key: clientSecret

config:
  issuer: https://dex.dshl.unileoben.ac.at

  storage:
    type: kubernetes
    config:
      inCluster: true

  web:
    http: 0.0.0.0:5556

  connectors:
    - type: oidc
      id: cps
      name: CPS
      config:
        issuer: https://auth.cps.unileoben.ac.at/application/o/dex-rancher-broker/
        clientID: iGjkHeZPoMrpWsw5TZ3RY368DDJa2d8TwOnR1EVS
        clientSecret: $DEX_CPS_CLIENT_SECRET
        redirectURI: https://dex.dshl.unileoben.ac.at/callback
    - type: oidc
      id: cit
      name: CIT
      config:
        issuer: https://auth.dshl.unileoben.ac.at/application/o/dex-rancher-broker/
        clientID: qlPmVf0I9embINVWrDqSjWIjoD6HrTwx6TbEUYXq
        clientSecret: $DEX_CIT_CLIENT_SECRET
        redirectURI: https://dex.dshl.unileoben.ac.at/callback

  staticClients:
    - id: rancher
      name: Rancher
      secret: $DEX_RANCHER_CLIENT_SECRET
      redirectURIs:
        - https://rancher.dshl.unileoben.ac.at/verify-auth
    - id: jupyterhub
      name: JupyterHub
      secret: $DEX_JHUB_CLIENT_SECRET
      redirectURIs:
        - https://jupyterhub.dshl.unileoben.ac.at/hub/oauth_callback

rbac:
  create: true
  createClusterScoped: true

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: dex.dshl.unileoben.ac.at
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: dshl-wildcard
      hosts:
        - dex.dshl.unileoben.ac.at
