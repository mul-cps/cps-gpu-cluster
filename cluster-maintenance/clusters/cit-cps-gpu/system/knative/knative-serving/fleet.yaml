defaultNamespace: knative-serving
name: knative-serving

# This bundle deploys Knative Serving and Kourier
labels:
  name: knative-serving

kustomize:
  dir: .

# Ensure CRDs are installed first
dependsOn:
  - selector:
      matchLabels:
        name: knative-crds

targets:
  - name: cit-cps-gpu
    clusterSelector:
      matchLabels:
        name: cit-cps-gpu

# config-gc was previously created by a manual `kubectl apply` (client-side-apply
# field manager, no objectset.rio.cattle.io/* ownership annotations), so Fleet's
# helm-based apply hits an ownership conflict on it. takeOwnership lets Fleet
# adopt the pre-existing object instead of failing forever.
helm:
  takeOwnership: true

# Knative owns the certificate bundle and the resource rules derived from its registered types.
# Admission selectors, TLS service, fail-closed configuration and timeout remain in desired state.
diff:
  comparePatches:
    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      name: webhook.serving.knative.dev
      jsonPointers:
        - /webhooks/0/rules
        - /webhooks/0/clientConfig/caBundle
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      name: validation.webhook.serving.knative.dev
      jsonPointers:
        - /webhooks/0/rules
        - /webhooks/0/clientConfig/caBundle
