defaultNamespace: knative-serving
name: knative-serving

# This bundle deploys Knative Serving and Kourier
labels:
  name: knative-serving

kustomize:
  dir: .

# Ensure CRDs are installed first
dependsOn:
  - selector:
      matchLabels:
        name: knative-crds

targets:
  - name: cit-cps-gpu
    clusterSelector:
      matchLabels:
        name: cit-cps-gpu

# config-gc was previously created by a manual `kubectl apply` (client-side-apply
# field manager, no objectset.rio.cattle.io/* ownership annotations), so Fleet's
# helm-based apply hits an ownership conflict on it. takeOwnership lets Fleet
# adopt the pre-existing object instead of failing forever.
helm:
  takeOwnership: true

diff:
  comparePatches:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: MutatingWebhookConfiguration
    name: webhook.serving.knative.dev
    operations:
    - {"op": "remove", "path": "/webhooks/0/clientConfig/caBundle"}
    - {"op": "remove", "path": "/webhooks/0/namespaceSelector"}
    - {"op": "remove", "path": "/webhooks/0/clientConfig/service/path"}
    - {"op": "remove", "path": "/webhooks/0/clientConfig/service/port"}
    - {"op": "remove", "path": "/webhooks/0/matchPolicy"}
    - {"op": "remove", "path": "/webhooks/0/reinvocationPolicy"}
    - {"op": "remove", "path": "/webhooks/0/objectSelector"}
    - {"op": "remove", "path": "/webhooks/0/failurePolicy"}
    - {"op": "remove", "path": "/webhooks/0/sideEffects"}
    - {"op": "remove", "path": "/webhooks/0/timeoutSeconds"}
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: validation.webhook.serving.knative.dev
    operations:
    - {"op": "remove", "path": "/webhooks/0/clientConfig/caBundle"}
    - {"op": "remove", "path": "/webhooks/0/namespaceSelector"}
    - {"op": "remove", "path": "/webhooks/0/clientConfig/service/path"}
    - {"op": "remove", "path": "/webhooks/0/clientConfig/service/port"}
    - {"op": "remove", "path": "/webhooks/0/matchPolicy"}
    - {"op": "remove", "path": "/webhooks/0/objectSelector"}
    - {"op": "remove", "path": "/webhooks/0/failurePolicy"}
    - {"op": "remove", "path": "/webhooks/0/sideEffects"}
    - {"op": "remove", "path": "/webhooks/0/timeoutSeconds"}
