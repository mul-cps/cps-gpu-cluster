apiVersion: management.cattle.io/v3
kind: AuthConfig
metadata:
  name: genericoidc

# Fleet-managed since 2026-07-23 -- see rancher/oidc-sync-job.yaml, which
# patches clientSecret in from the rancher-oidc-secret SopsSecret. See
# docs/sops-secrets-migration.md.
#
# Field names verified against pkg/apis/management.cattle.io/v3/authn_types.go
# (OIDCConfig/GenericOIDCConfig structs) -- an earlier revision of this file
# used SAML-style field names (rancherURL, jwksEndpoint, scopes as a list,
# displayNameField/userNameField/uidField/groupsField) that don't exist on
# the OIDC config struct at all, which silently left the required `rancherUrl`
# field empty and produced a Go nil-formatting bug in Rancher's post-login
# redirect ("%!s(<nil>)" showing up in the browser URL). Confirmed live
# 2026-07-07.
#
# REPOINTED TO DEX 2026-07-23 (docs/superpowers/plans/2026-07-23-dex-idp-broker.md,
# Task 6): issuer/endpoints below now point at the Dex broker
# (dex.dshl.unileoben.ac.at), not CPS Authentik directly, so both CPS and
# CIT Authentik users can log in via Rancher (Dex fans out to both
# upstream connectors). clientId/clientSecret are Dex's static client for
# Rancher, not an Authentik-issued client. Endpoints confirmed against
# Dex's own live /.well-known/openid-configuration, not assumed. Dex has
# no `end_session_endpoint` in its discovery document -- it does not
# support RP-initiated logout -- so endSessionEndpoint is omitted (field
# is optional on OIDCConfig; only rancherUrl is required,notnullable per
# the struct comment above). Pre-Dex CPS-direct values are preserved in
# git history (this commit's parent) as the rollback target -- see
# docs/dex-idp-broker.md.
enabled: true
accessMode: unrestricted

type: genericOIDCConfig

clientId: "rancher"
# clientSecret: patched in by rancher-oidc-sync (Helm post-install/post-upgrade
# hook Job), not set here -- see comment above. Now sources from Dex's
# static client secret (dex-rancher-client), not an Authentik-issued one.

rancherUrl: "https://rancher.dshl.unileoben.ac.at/verify-auth"
rancherApiHost: "https://rancher.dshl.unileoben.ac.at"

issuer: "https://dex.dshl.unileoben.ac.at"
authEndpoint: "https://dex.dshl.unileoben.ac.at/auth"
tokenEndpoint: "https://dex.dshl.unileoben.ac.at/token"
userInfoEndpoint: "https://dex.dshl.unileoben.ac.at/userinfo"
jwksUrl: "https://dex.dshl.unileoben.ac.at/keys"

# Space-delimited string, not a list, per OIDCConfig.Scopes.
scope: "openid profile email groups"

# Defaults already match what we want (name/email/groups); set explicitly
# for clarity/documentation purposes.
nameClaim: "name"
emailClaim: "email"
groupsClaim: "groups"
groupSearchEnabled: false

pkceMethod: ""
