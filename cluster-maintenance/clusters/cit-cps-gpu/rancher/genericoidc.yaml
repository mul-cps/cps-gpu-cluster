apiVersion: management.cattle.io/v3
kind: AuthConfig
metadata:
  name: genericoidc

# Fleet-managed since 2026-07-23 -- see rancher/oidc-sync-job.yaml, which
# patches clientSecret in from the rancher-oidc-secret SopsSecret. See
# docs/sops-secrets-migration.md.
#
# Field names verified against pkg/apis/management.cattle.io/v3/authn_types.go
# (OIDCConfig/GenericOIDCConfig structs) -- an earlier revision of this file
# used SAML-style field names (rancherURL, jwksEndpoint, scopes as a list,
# displayNameField/userNameField/uidField/groupsField) that don't exist on
# the OIDC config struct at all, which silently left the required `rancherUrl`
# field empty and produced a Go nil-formatting bug in Rancher's post-login
# redirect ("%!s(<nil>)" showing up in the browser URL). Confirmed live
# 2026-07-07.
enabled: true
accessMode: unrestricted

type: genericOIDCConfig

clientId: "oMCe0WAjKAIadGyOHz5ok4Lv5iMxEVlXYGHS36z8"
# clientSecret: patched in by rancher-oidc-sync (Helm post-install/post-upgrade
# hook Job), not set here -- see comment above.

rancherUrl: "https://rancher.dshl.unileoben.ac.at/verify-auth"
rancherApiHost: "https://rancher.dshl.unileoben.ac.at"

issuer: "https://auth.cps.unileoben.ac.at/application/o/rancher/"
authEndpoint: "https://auth.cps.unileoben.ac.at/application/o/authorize/"
tokenEndpoint: "https://auth.cps.unileoben.ac.at/application/o/token/"
userInfoEndpoint: "https://auth.cps.unileoben.ac.at/application/o/userinfo/"
endSessionEndpoint: "https://auth.cps.unileoben.ac.at/application/o/rancher/end-session/"
jwksUrl: "https://auth.cps.unileoben.ac.at/application/o/rancher/jwks/"

# Space-delimited string, not a list, per OIDCConfig.Scopes.
scope: "openid profile email groups"

# Defaults already match what we want (name/email/groups); set explicitly
# for clarity/documentation purposes.
nameClaim: "name"
emailClaim: "email"
groupsClaim: "groups"
groupSearchEnabled: false

pkceMethod: ""
