apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here -- AuthConfig is cluster-scoped (management.cattle.io/v3,
# not in Kustomize's/K8s's built-in cluster-scoped-kind list, since it's a CRD),
# so the namespace transformer would stamp a namespace field onto it. Instead
# rely on fleet.yaml's `defaultNamespace: cattle-system`, which Fleet applies
# only to resources that don't already specify one -- the namespaced
# resources below (SopsSecret, ServiceAccount, ClusterRoleBinding subject,
# Job) already carry `namespace: cattle-system` explicitly.
resources:
  - genericoidc.yaml
  - oidc-sopssecret.yaml
  - oidc-sync-job.yaml
