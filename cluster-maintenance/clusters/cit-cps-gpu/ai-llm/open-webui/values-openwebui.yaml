# Connect to internal Ollama service
extraEnv:
  - name: OLLAMA_BASE_URL
    value: "http://ollama-http.ai-llm.svc.cluster.local:8080"
  - name: OLLAMA_BASE_URLS
    value: "http://ollama-http.ai-llm.svc.cluster.local:8080"
  # OIDC Configuration (secrets loaded from secret-oidc.yaml)
  - name: WEBUI_AUTH
    value: "True"

# Disable bundled Ollama
ollama:
  enabled: false


# Load OIDC secrets from the secret created separately
extraEnvFrom:
  - secretRef:
      name: open-webui-oidc

persistence:
  enabled: true
  storageClass: "longhorn-fast"
  size: 10Gi

ingress:
  enabled: true
  class: nginx
  hosts:
    - host: chat.dshl.unileoben.ac.at
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dshl-wildcard
      hosts:
        - chat.dshl.unileoben.ac.at

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
