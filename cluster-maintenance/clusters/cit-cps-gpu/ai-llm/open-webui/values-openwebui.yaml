# Connect to internal Ollama service
extraEnv:
  - name: OLLAMA_BASE_URL
    value: "http://ollama-http.ai-llm.svc.cluster.local:8080"
  - name: OLLAMA_BASE_URLS
    value: "http://ollama-http.ai-llm.svc.cluster.local:8080"
  # OIDC Configuration (secrets loaded from secret-oidc.yaml)
  - name: WEBUI_AUTH
    value: "True"
  - name: OAUTH_PROVIDER_NAME
    value: "authentik"
  - name: OPENID_REDIRECT_URI
    value: "https://openwebui.dshl.unileoben.ac.at/oauth/oidc/callback"
  - name: WEBUI_URL
    value: "https://openwebui.dshl.unileoben.ac.at"
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: ENABLE_LOGIN_FORM
    value: "false"
  - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
    value: "true"

# Disable bundled Ollama
ollama:
  enabled: false


# Load OIDC secrets from the secret created separately
extraEnvFrom:
  - secretRef:
      name: open-webui-oidc

persistence:
  enabled: true
  storageClass: "longhorn-fast"
  size: 10Gi

ingress:
  enabled: true
  class: nginx
  host: openwebui.dshl.unileoben.ac.at
  tls: true
  existingSecret: "dshl-wildcard"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
