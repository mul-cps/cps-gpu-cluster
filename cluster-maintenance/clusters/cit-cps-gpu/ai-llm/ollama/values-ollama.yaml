replicaCount: 0

autoscaling:
  enabled: false

ollama:
  gpu:
    enabled: true
    type: nvidia
    # Using full GPU resource as discovered
    nvidiaResource: "nvidia.com/gpu"
    number: 1

  # Pre-pull and/or run models
  models:
    pull:
      - llama3.2:3b
      - mistral
    run:
      - llama3.2:3b
  
  extraEnv:
    - name: OLLAMA_HOST
      value: "0.0.0.0"
    - name: OLLAMA_KEEP_ALIVE
      value: "24h"

# Use GPU node pool
nodeSelector:
  accelerator: nvidia

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

runtimeClassName: nvidia

persistentVolume:
  enabled: true
  storageClass: "longhorn-fast"
  size: 100Gi

service:
  type: ClusterIP
  port: 11434

ingress:
  enabled: false
