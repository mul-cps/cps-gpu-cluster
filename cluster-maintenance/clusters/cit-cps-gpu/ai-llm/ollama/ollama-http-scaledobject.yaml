apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: ollama-http
  namespace: ai-llm
spec:
  host: ollama-http.ai-llm.svc.cluster.local
  pathPrefix: /
  targetPendingRequests: 50
  scaleTargetRef:
    deployment: ollama
    service: ollama
    port: 11434
  replicas:
    min: 0
    max: 1
  cooldownPeriod: 120
