data:
  00_IMPORTANT_STORAGE_WARNING.md: |
    # ⚠️ IMPORTANT STORAGE WARNING ⚠️

    **STOP AND READ THIS CAREFULLY**

    Your home directory (`/home/jovyan`) is **EPHEMERAL**.

    - This directory is located on the **local NVMe storage** of the compute node you are currently running on.
    - This provides **maximum performance** for your calculations and data processing.
    - **HOWEVER**, any data saved directly in `/home/jovyan` (except for the `persistent` folder) **WILL BE LOST** when your server stops or restarts.

    ### ✅ WHERE TO SAVE DATA
    You **MUST** save all your important work, code, and results in the **`persistent`** folder:
    
    👉 **/home/jovyan/persistent**

    This folder is mounted from the cluster's network storage and is safe.

    ### ⚡ BEST PRACTICES
    1.  **Copy** large datasets from `persistent` to your home directory (`/home/jovyan`) at the start of your work for fast access.
    2.  **Run** your calculations using the fast local storage.
    3.  **Save** your results back to `persistent` before stopping your server.

  01_CLUSTER_GUIDE.md: |
    # CPS GPU Cluster Guide

    Welcome to the CPS GPU Cluster! This guide explains the system topology and how to use it effectively.

    ## 🏗️ System Topology

    The cluster consists of a head node and multiple worker nodes equipped with high-performance NVIDIA A100 GPUs.

    ### Compute Nodes
    - **GPU Nodes**: Equipped with NVIDIA A100 GPUs (40GB).
    - **CPU Nodes**: For general-purpose tasks and development.

    ### Storage Architecture
    We use a tiered storage approach to balance performance and persistence:

    1.  **Local NVMe (Fast & Ephemeral)**:
        -   **Path**: `/home/jovyan`
        -   **Speed**: Extremely fast (PCIe Gen4 NVMe).
        -   **Use Case**: Active datasets, temporary training artifacts, scratch space.
        -   **Persistence**: ❌ **NO**. Data is lost when the pod terminates.

    2.  **Network Storage (Slower & Persistent)**:
        -   **Path**: `/home/jovyan/persistent`
        -   **Speed**: Limited by network bandwidth (NFS).
        -   **Use Case**: Code repositories, final results, long-term dataset storage.
        -   **Persistence**: ✅ **YES**. Data survives restarts.

    ## 🚀 Using JupyterHub

    ### Selecting a Profile
    When you start your server, you can choose from several profiles:

    -   **CPU (Default)**: For coding, lightweight testing, and data analysis.
    -   **GPU (PyTorch/TensorFlow)**: For deep learning tasks. Choose 1x or 2x GPU based on your needs.
    -   **MIG Slices**: For smaller workloads that don't need a full A100 (e.g., inference, small model training).

    ### Workflow Recommendation
    To get the best performance and avoid data loss:

    1.  **Start** your server with the appropriate profile.
    2.  **Navigate** to `/home/jovyan/persistent` to access your saved files.
    3.  **Copy** data you need for *current* processing to `/home/jovyan` (e.g., `cp -r persistent/my-dataset .`).
    4.  **Run** your training/analysis reading from `/home/jovyan`.
    5.  **Save** checkpoints and final results directly to `/home/jovyan/persistent`.

    ## 🆘 Support
    If you have questions or need help, please contact the cluster administrators.
