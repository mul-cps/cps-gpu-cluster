apiVersion: batch/v1
kind: Job
metadata:
  name: label-gpu1-mig
  namespace: gpu-operator
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: node-labeler
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Labeling GPU pools and NOS-managed MIG nodes..."
          for n in k3s-wk-gpu1 k3s-wk-gpu2 k3s-wk-gpu3; do
            kubectl label node ${n} gpu-pool=mig-dynamic --overwrite
            kubectl label node ${n} nos.nebuly.com/gpu-partitioning=mig --overwrite
            kubectl label node ${n} nvidia.com/mig.strategy=mixed --overwrite
            kubectl label node ${n} nvidia.com/mig.config=all-enabled --overwrite
            kubectl taint node ${n} gpu-pool- --overwrite || true
          done

          kubectl label node k3s-wk-gpu4 gpu-pool=full --overwrite
          kubectl label node k3s-wk-gpu4 nos.nebuly.com/gpu-partitioning- --overwrite
          kubectl label node k3s-wk-gpu4 nvidia.com/mig.config=all-disabled --overwrite
          kubectl label node k3s-wk-gpu4 nvidia.com/mig.strategy=single --overwrite
          kubectl taint node k3s-wk-gpu4 gpu-pool=full:NoSchedule --overwrite
          echo "Labels and taints applied."
      restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler
subjects:
- kind: ServiceAccount
  name: node-labeler
  namespace: gpu-operator
roleRef:
  kind: ClusterRole
  name: node-labeler
  apiGroup: rbac.authorization.k8s.io
