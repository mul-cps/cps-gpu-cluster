apiVersion: v1
kind: Pod
metadata:
  name: mig-1g-demo
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    gpu-pool: mig-dynamic
  containers:
    - name: cuda
      image: nvcr.io/nvidia/cuda:12.2.0-base-ubuntu22.04
      command: ["sleep", "3600"]
      resources:
        limits:
          nvidia.com/mig-1g.5gb: 1
