name: keda-http-addon
defaultNamespace: keda

dependsOn:
  - selector:
      matchLabels:
        name: keda-core


helm:
  repo: https://kedacore.github.io/charts
  chart: keda-add-ons-http
  releaseName: keda-add-ons-http
  values:
    interceptor:
      proxy:
        port: 8080
      responseHeaderTimeout: 300s
      tcpConnectTimeout: 30s
      keepAlive: 60s
      replicas:
        waitTimeout: 300s
      autoscaling:
        enabled: false
