# vcluster.yaml structure (replaces old values.yaml)
# Docs: https://www.vcluster.com/docs/vcluster/configure/vcluster-yaml/

# Sync host StorageClasses into the virtual cluster
sync:
  fromHost:
    storageClasses:
      enabled: true

# Networking defaults (ClusterIP) are standard, so no need to specify if not changing.
# Ingress access is disabled by default.

# Security defaults
# allowPrivilegeEscalation: false (default in newer charts often)
# If needed:
# policies:
#   podSecurity: ...

# Control Plane configuration (optional, chart defaults should be fine)
# controlPlane:
#   distro:
#     k8s:
#       enabled: true
