ollama:
  enabled: false

ollamaUrls:
  - "http://ollama.llm.svc.cluster.local:11434"

ingress:
  enabled: true
  class: nginx # User said className: nginx in snippets, but chart might use class or className depending on version. Snippet used `className: nginx`.
  # Actually, `className` is standard K8s. But let's check snippet: `className: nginx`.
  annotations: {}
  host: openwebui.dshl.unileoben.ac.at
  tls: true
  existingSecret: openwebui-tls

extraEnvVars:
  - name: WEBUI_URL
    value: "https://openwebui.dshl.unileoben.ac.at"
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: OAUTH_PROVIDER_NAME
    value: "authentik"
  - name: OAUTH_SCOPES
    value: "openid email profile"
  - name: OPENID_PROVIDER_URL
    value: "https://auth.cps.unileoben.ac.at/application/o/open-web-ui/.well-known/openid-configuration"
  # OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET come from the openwebui-oidc
  # Secret (see oauth-sopssecret.yaml), injected via the StatefulSet
  # envFrom patch in fleet.yaml.

tolerations:
  - key: cps.unileoben.ac.at/maintenance
    operator: Equal
    value: upstream-pilot
    effect: NoSchedule

pipelines:
  image:
    tag: main@sha256:b48e9bc338ce2be0acfbeff01810db72408a12f07739f9e3879c1f2b00952d6e
  replicaCount: 1
