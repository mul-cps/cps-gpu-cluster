defaultNamespace: openwebui
name: open-webui
helm:
  releaseName: open-webui
  repo: https://helm.openwebui.com/
  chart: open-webui
  createNamespace: true
  valuesFiles:
    - values.yaml

# SOPS-encrypted OAuth secret (decrypted in-cluster by the shared
# sops-secrets-operator) — see docs/sops-secrets-migration.md
kustomize:
  dir: .

# REDESIGNED 2026-07-23: this bundle previously used a
# `targetCustomizations[].patches` JSON-patch block to inject envFrom
# into the chart-rendered StatefulSet. That mechanism is not valid Fleet
# syntax at all -- confirmed against Fleet's fleetyaml.go source:
# TargetCustomizations is typed []BundleTarget, which has no `patches`
# field (only `diff.comparePatches`, which affects drift comparison
# only, never resource content). The key was silently dropped, which is
# why Open WebUI's OAuth login never actually worked despite the client
# being fully provisioned and SOPS-encrypted (see
# docs/sops-secrets-migration.md). Found and root-caused while building
# the Dex IdP broker, which copied this same broken pattern before being
# caught -- see docs/troubleshooting.md and
# docs/superpowers/plans/2026-07-23-dex-idp-broker.md.
#
# Replaced with the Helm-hook sync-Job pattern proven live for
# rancher/oidc-sync-job.yaml and system/auth/dex/rancher-secret-sync-job.yaml:
# a post-install/post-upgrade hook Job patches envFrom onto the live
# StatefulSet via `kubectl patch` after Helm creates it. See
# oauth-envfrom-sync-job.yaml.
