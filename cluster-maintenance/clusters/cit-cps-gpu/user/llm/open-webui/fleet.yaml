defaultNamespace: openwebui
name: open-webui
helm:
  releaseName: open-webui
  repo: https://helm.openwebui.com/
  chart: open-webui
  createNamespace: true
  valuesFiles:
    - values.yaml

# SOPS-encrypted OAuth secret (decrypted in-cluster by the shared
# sops-secrets-operator) — see docs/sops-secrets-migration.md
kustomize:
  dir: .

targetCustomizations:
- name: cit-cps-gpu
  clusterSelector:
    matchLabels:
      name: cit-cps-gpu
  patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: open-webui
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: openwebui-oidc
