defaultNamespace: llm
name: ollama
labels:
  name: ollama
helm:
  releaseName: ollama
  chart: ./chart
  # version: 0.1.0 # Best to omit or pin if known, but user didn't specify version. Will stick to latest or let Flux decide. Actually Fleet uses latest if not configured? No, good practice to not pin if we want latest, but risky. I'll stick to not pinning for now as user didn't specify.
  createNamespace: true
  valuesFiles:
    - values.yaml



targets:
  - name: cit-cps-gpu
    clusterSelector:
      matchLabels:
        name: cit-cps-gpu

diff:
  comparePatches:
  - apiVersion: serving.knative.dev/v1
    kind: Service
    name: ollama
    operations:
    - {"op": "remove", "path": "/spec/traffic"}
    - {"op": "remove", "path": "/metadata/annotations"}
