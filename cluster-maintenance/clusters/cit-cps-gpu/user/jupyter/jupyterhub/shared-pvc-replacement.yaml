apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-shared-storage-replacement
  namespace: jupyterhub
  annotations:
    description: Replacement for the faulted jupyterhub-shared-storage PVC; the original is retained for forensic recovery.
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-overcommit
  resources:
    requests:
      storage: 500Gi
