    hub:
      extraConfig:
        02-profiles: |
          # ---------- Access logic ----------
          # Groups that have full access (GPU + Shared Storage)
          # Groups that have full access (GPU + Shared Storage)
          POWER_USER_GROUPS = {'app_jupyterhub_poweruser', 'jupyter_admin'}

          # TODO(platform-owner): placeholder group name(s) - replace with the real
          # Authentik/LDAP group(s) used for enrolled course/student accounts once known.
          STUDENT_GROUPS = {'app_jupyterhub_student'}

          def is_power_user(user):
              user_groups = {getattr(g, "name", g) for g in user.groups}
              return bool(user.admin) or bool(user_groups & POWER_USER_GROUPS)

          def is_student(user):
              user_groups = {getattr(g, "name", g) for g in user.groups}
              return bool(user_groups & STUDENT_GROUPS)

          STANDARD_NFS_MOUNTS = [
              {
                  'key': 'personal',
                  'label': 'Personal user share',
                  'description': 'Mount your per-user NFS share for long-lived files.',
                  'volume_name': 'cps-persistent1-users',
                  'claim_name': 'cps-persistent1-users-pvc',
                  'mount_path': '/home/jovyan/cps_persistent1_users',
                  'mount_options': [
                      'nfsvers=4.2',
                      'proto=tcp',
                      'hard',
                      'timeo=150',
                      'retrans=2',
                      'rsize=1048576',
                      'wsize=1048576',
                      'nconnect=8',
                      'noresvport',
                      'noatime',
                      '_netdev',
                      'x-systemd.automount',
                      'x-systemd.idle-timeout=600s',
                      'x-systemd.requires=network-online.target',
                      'x-systemd.after=network-online.target',
                      'nofail',
                  ],
                  'kind': 'pvc',
                  'default_checked': False,
                  'power_user_only': False,
              },
              {
                  'key': 'persistent1_shared',
                  'label': 'Project share',
                  'description': 'Shared NFS workspace for team notebooks and datasets.',
                  'volume_name': 'cps-persistent1-shared',
                  'claim_name': 'cps-persistent1-shared-pvc',
                  'mount_path': '/home/jovyan/cps_persistent1_shared',
                  'mount_options': [
                      'nfsvers=4.2',
                      'proto=tcp',
                      'hard',
                      'timeo=150',
                      'retrans=3',
                      'rsize=1048576',
                      'wsize=1048576',
                      'nconnect=4',
                      'noresvport',
                      'noatime',
                  ],
                  'kind': 'pvc',
                  'default_checked': False,
                  'power_user_only': True,
              },
              {
                  'key': 'scratch',
                  'label': 'Scratch1 storage',
                  'description': 'Mount the full scratch1 export for temporary storage and the recovery folder.',
                  'volume_name': 'cps-scratch1-tmp',
                  'claim_name': 'cps-scratch1-tmp-v2-pvc',
                  'mount_path': '/home/jovyan/cps_scratch1',
                  'mount_options': [
                      'nfsvers=4.2',
                      'proto=tcp',
                      'hard',
                      'timeo=150',
                      'retrans=2',
                      'rsize=1048576',
                      'wsize=1048576',
                      'nconnect=8',
                      'noresvport',
                      'noatime',
                      '_netdev',
                      'x-systemd.automount',
                      'x-systemd.idle-timeout=600s',
                      'x-systemd.requires=network-online.target',
                      'x-systemd.after=network-online.target',
                      'nofail',
                  ],
                  'kind': 'pvc',
                  'default_checked': False,
                  'power_user_only': True,
              },
          ]


          CUSTOM_NFS_DEFAULT_SERVER = '193.170.30.58'
          CUSTOM_NFS_DEFAULT_MOUNT_PATH = '/home/jovyan/custom_nfs'
          CPS_LOGO_SRC = 'https://cloud.cps.unileoben.ac.at/index.php/s/3TnF46QfwZCR8XY/download'

          def form_bool(formdata, key, default=False):
              values = formdata.get(key, [])
              if not values:
                  return default
              return values[0].strip().lower() in ('1', 'true', 'on', 'yes', 'checked')

          def append_volume_mount(spawner, volume_spec, mount_spec):
              if spawner.volumes is None:
                  spawner.volumes = []
              if isinstance(spawner.volumes, list):
                  spawner.volumes.append(volume_spec)
              elif isinstance(spawner.volumes, dict):
                  spawner.volumes[volume_spec['name']] = volume_spec

              if spawner.volume_mounts is None:
                  spawner.volume_mounts = []
              if isinstance(spawner.volume_mounts, list):
                  spawner.volume_mounts.append(mount_spec)
              elif isinstance(spawner.volume_mounts, dict):
                  spawner.volume_mounts[mount_spec['name']] = mount_spec

          def sanitize_nfs_volume_name(raw_name):
              import re
              cleaned = re.sub(r'[^a-z0-9-]+', '-', raw_name.lower()).strip('-')
              return cleaned[:48] or 'custom-nfs'

          # ---------- LDAP Lookup ----------
          def get_ldap_info(username, log=None):
              from ldap3 import Server, Connection, ALL
              
              import os

              # LDAP Config
              LDAP_SERVER = 'ldaps://auth.cps.unileoben.ac.at:636'
              LDAP_USER = 'cn=ldapservice,ou=users,dc=ldap,dc=goauthentik,dc=io'
              # LDAP_PASSWORD is read from the LDAP_BIND_PASSWORD env var (injected
              # from the jupyterhub-ldap-credentials k8s Secret via hub.extraEnv).
              # This reuses the existing 'ldapservice' bind-account credential --
              # not a newly generated value. Rotation flagged as manual follow-up
              # requiring LDAP directory admin coordination, see
              # docs/sops-secrets-migration.md.
              LDAP_PASSWORD = os.environ['LDAP_BIND_PASSWORD']
              SEARCH_BASE = 'ou=users,dc=ldap,dc=goauthentik,dc=io'
              
              try:
                  if log: log.info(f"LDAP: Connecting to {LDAP_SERVER}...")
                  server = Server(LDAP_SERVER, get_info=ALL, connect_timeout=5)
                  conn = Connection(server, user=LDAP_USER, password=LDAP_PASSWORD, auto_bind=True, receive_timeout=5)
                  
                  # Search for user
                  if log: log.info(f"LDAP: Searching for {username}...")
                  search_filter = f'(cn={username})'
                  conn.search(SEARCH_BASE, search_filter, attributes=['uidNumber', 'gidNumber'])
                  
                  if len(conn.entries) > 0:
                      entry = conn.entries[0]
                      if log: log.info(f"LDAP: Found user {username}: {entry.entry_dn}")
                      return {
                          'uid': int(entry.uidNumber.value),
                          'gid': int(entry.gidNumber.value)
                      }
                  else:
                      if log: log.warning(f"LDAP: User {username} not found")
                      return None
              except Exception as e:
                  if log: log.error(f"LDAP Error for {username}: {e}")
                  else: print(f"LDAP Error for {username}: {e}")
                  return None

          from cps_compute_hub.directory_identity import DirectoryIdentityCache
          directory_identities = DirectoryIdentityCache(get_ldap_info)

          # ---------- Dynamic UI Generation ----------
          def get_options_form(spawner):
              power_user = is_power_user(spawner.user)
              # cps-upstream-managed-profile-ui-v1
              from cps_compute_hub.upstream_hub import legacy_shared_intent as _cps_legacy_shared_intent
              allowed_profiles = [row for row in get_profile_list(spawner)
                                  if not _cps_legacy_shared_intent(row)]

              allowed_slugs = {p['slug'] for p in allowed_profiles}
              default_slug = next(
                  (slug for slug, cfg in PROFILE_CONFIGS.items() if cfg.get('default') and slug in allowed_slugs),
                  allowed_profiles[0]['slug'] if allowed_profiles else 'cpu-default'
              )
              default_cfg = PROFILE_CONFIGS.get(default_slug, PROFILE_CONFIGS['cpu-default'])

              def render_card(slug, cfg, selected=False):
                  gpu = cfg.get('gpu', 0)
                  cpu = cfg.get('cpu_limit', 0)
                  mem = cfg.get('mem_limit', '0G')

                  chips = []
                  mem_mib = cfg.get('memory_mib')
                  if gpu > 0 and mem_mib:
                      chips.append(f'<span class="chip gpu-chip">{mem_mib / 1024:g} GB VRAM (MPS-shared)</span>')
                  elif gpu > 0:
                      chips.append(f'<span class="chip gpu-chip">{gpu}× GPU</span>')

                  chips.append(f'<span class="chip cpu-chip">{int(cpu)} vCPU</span>')
                  chips.append(f'<span class="chip ram-chip">{mem} RAM</span>')
                  if selected:
                      chips.append('<span class="chip default-chip">Default start</span>')

                  cls = "option-card selected" if selected else "option-card"
                  checked = "checked" if selected else ""
                  description = cfg.get('description', '')

                  return f"""
                  <label class="{cls}" data-slug="{slug}">
                    <input type="radio" name="profile" value="{slug}" {checked}>
                    <div class="option-card-title">{cfg['display_name']}</div>
                    <div class="option-card-copy">{description}</div>
                    <div class="meta">{''.join(chips)}</div>
                  </label>
                  """

              categories = {
                  'CPU-only (general purpose)': [],
                  'GPU-enabled': [],
                  'Special': []
              }
              for p in allowed_profiles:
                  slug = p['slug']
                  cfg = PROFILE_CONFIGS[slug]
                  cat = cfg.get('category', 'Special')
                  categories.setdefault(cat, [])
                  categories[cat].append(slug)

              sections_html = []
              for cat_name, slugs in categories.items():
                  if not slugs:
                      continue
                  card_html = "\n".join(
                      render_card(slug, PROFILE_CONFIGS[slug], selected=(slug == default_slug))
                      for slug in slugs
                  )
                  sections_html.append(f"""
                  <section class="option-section">
                    <div class="section-head">
                      <div class="section-title">{cat_name}</div>
                    </div>
                    <div class="grid">
                      {card_html}
                    </div>
                  </section>
                  """)
              options_profiles_html = ('<p class="help-text" role="note">Shared GPUs (5, 10 or 20 GiB) are launched from <a href="/services/cps-admin/app/">Shared workspaces in CPS</a>. Open a workspace to see profiles allowed by its membership and budget.</p>'
                                       + "\n".join(sections_html))

              mount_items_html = []
              for spec in STANDARD_NFS_MOUNTS:
                  if spec.get('power_user_only') and not power_user:
                      continue
                  checked = "checked" if spec.get('default_checked', False) else ""
                  mount_items_html.append(f"""
                  <label class="mount-item">
                    <div class="mount-item-header">
                      <div>
                        <div class="mount-item-title">
                          <input type="checkbox" name="mount_{spec['key']}_nfs" value="1" {checked} style="width:auto; margin:0 8px 0 0;">
                          <span>{spec['label']}</span>
                        </div>
                        <div class="hint">{spec['description']}</div>
                      </div>
                      <div class="mount-pill">{spec['mount_path']}</div>
                    </div>
                    <div class="mount-details">
                      <div><strong>Source:</strong> {spec['claim_name']}</div>
                      <div><strong>Mount options:</strong> {', '.join(spec['mount_options'])}</div>
                    </div>
                  </label>
                  """)
              mount_items_markup = ''.join(mount_items_html)

              shared_workspace_html = ""
              if power_user:
                  shared_workspace_html = """
                  <section class="layer">
                    <div class="section-title">Shared Workspace</div>
                    <label class="toggle-row">
                      <input type="checkbox" name="mount_shared_longhorn" value="1" checked style="width:auto; margin:0;">
                      <span>Mount the shared Longhorn workspace</span>
                    </label>
                    <div class="hint">Mounts the recovered shared workspace at <code>/home/jovyan/shared</code>. It has a verified external backup.</div>
                  </section>
                  """

              user_groups = sorted([getattr(g, "name", str(g)) for g in spawner.user.groups])
              debug_html = f"""
              <details class="debug-panel">
                <summary>Debug Info</summary>
                <div class="debug-copy">
                  User: {spawner.user.name}<br>
                  Admin: {spawner.user.admin}<br>
                  Groups: {user_groups}<br>
                  Power User: {power_user}<br>
                  Allowed Profiles: {[p['slug'] for p in allowed_profiles]}
                </div>
              </details>
              """

              quick_start_copy = "Start Server launches the default notebook profile immediately."
              if power_user:
                  quick_start_copy = "Start Server launches the default notebook profile immediately. Open Options if you need GPUs, alternate images, or custom storage."

              return f"""
