  app: jupyterhub
  name: jupyterhub

helm:
  chart: jupyterhub
  repo: https://jupyterhub.github.io/helm-chart
  version: 4.4.2
  releaseName: jupyterhub
  createNamespace: true
  valuesFiles:
  - values.yaml
