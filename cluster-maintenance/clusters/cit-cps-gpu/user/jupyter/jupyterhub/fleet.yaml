name: jupyterhub
defaultNamespace: jupyterhub

# Labels for bundle identification
labels:
  app: jupyterhub
  name: jupyterhub

helm:
  chart: jupyterhub
  repo: https://jupyterhub.github.io/helm-chart
  version: 4.3.1
  releaseName: jupyterhub
  createNamespace: true
  valuesFiles:
  - values.yaml

# Storage PVCs and additional Kubernetes manifests
kustomize:
  dir: .

# Depends on storage infrastructure and ingress
dependsOn:
- selector:
    matchLabels:
      name: storage-classes
- selector:
    matchLabels:
      name: ingress-nginx
# Added 2026-07-24 (review finding C1): without this, Fleet could apply
# this bundle's Dex-repointed OAuth config before the dex-idp-broker
# bundle has registered the jupyterhub static client and synced its
# secret, locking out every user with no local-auth fallback.
- selector:
    matchLabels:
      name: dex-idp-broker
      
diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: Deployment
    operations:
    - {"op": "remove", "path": "/spec/template/metadata/annotations/checksum~1hub-secret"}
