apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-user-docs
  namespace: jupyterhub
data:
  00_IMPORTANT_STORAGE_WARNING.md: |
    # ⚠️ STORAGE CONFIGURATION ⚠️

    **PLEASE READ CAREFULLY**

    ### ✅ Persistent Home Directory
    Your home directory (`/home/jovyan`) is **PERSISTENT**.
    - Settings, VS Code extensions, and files saved here **WILL BE SAVED** across sessions.
    - This storage is network-attached (Longhorn).

    ### ⚡ Ephemeral Work Directory (FAST)
    For high-performance tasks, use the **`work`** folder:
    
    👉 **/home/jovyan/work**

    - This directory is on **local NVMe storage** (extremely fast).
    - **WARNING**: Contents of `work` are **LOST** when your server stops/restarts.
    - Use this for active datasets and training artifacts.

    ### 📂 Shared Storage
    Shared data is available at:
    
    👉 **/home/jovyan/shared**
    
    - Shared mounts are optional and require the appropriate permission.
    - Quick Start uses your persistent home; choose approved shared storage explicitly in the advanced options.

  01_CLUSTER_GUIDE.md: |
    # CPS GPU Cluster Guide

    Welcome to the CPS GPU Cluster! This guide explains the system topology and how to use it effectively.

    ## 🏗️ System Topology

    The cluster consists of a head node and multiple worker nodes equipped with high-performance NVIDIA A100 GPUs.

    ### Compute Nodes
    - **GPU Nodes**: Equipped with NVIDIA A100 GPUs (40GB).
    - **CPU Nodes**: For general-purpose tasks and development.

    ### Storage Architecture
    We use a tiered storage approach to balance performance and persistence:

    1.  **Home Directory (Persistent)**:
        -   **Path**: `/home/jovyan`
        -   **Speed**: Cluster Storage (Longhorn).
        -   **Use Case**: Code, settings, VS Code extensions, final results.
        -   **Persistence**: ✅ **YES**. Data survives restarts.

    2.  **Work Directory (Fast & Ephemeral)**:
        -   **Path**: `/home/jovyan/work`
        -   **Speed**: Extremely fast (PCIe Gen4 NVMe).
        -   **Use Case**: Active datasets, temporary training artifacts, scratch space.
        -   **Persistence**: ❌ **NO**. Data is lost when the pod terminates.

    3.  **Shared Storage (Persistent)**:
        -   **Path**: `/home/jovyan/shared`
        -   **Speed**: Cluster Storage (Longhorn).
        -   **Use Case**: Shared datasets, collaborative projects.
        -   **Persistence**: ✅ **YES**.

    ## 🚀 Using JupyterHub

    ### Selecting a Profile
    When you start your server, you can choose from several profiles:

    -   **CPU (Default)**: For coding, lightweight testing, and data analysis.
    -   **GPU (PyTorch/TensorFlow)**: For deep learning tasks. Choose 1x or 2x GPU based on your needs.
    -   **Shared GPU**: Select an available fixed sharing profile when your account is entitled to it. This platform does not use MIG.

    Available profiles depend on your permissions. Resources and queues come from the selected profile; freeform GPU, image and NFS overrides are not supported.

    ### Workflow Recommendation
    To get the best performance and avoid data loss:

    1.  **Start** your server with the appropriate profile.
    2.  **Clone** your code into `~` (Home).
    3.  **Copy** large datasets from `~/shared` to `~/work` for fast processing.
    4.  **Run** your training/analysis reading/writing in `~/work`.
    5.  **Save** final results back to `~` or `~/shared` before stopping your server.

    ## 🔐 SSH Access
    You can access your running notebook server via SSH.

    SSH/SFTP requires a running server with SSH support and a reachable gateway.
    There is no web key-registration page at `/hub/ssh`.

    Follow the [SSH gateway setup guide](https://github.com/mul-cps/cps-gpu-cluster/blob/main/docs/jupyterhub/jupyterhub-ssh-access.md)
    for endpoint, token and public-key setup. Public keys belong in the running
    server's persistent `~/.ssh/authorized_keys`; do not upload private keys.
    Ask the administrators if your profile or network has no SSH route.

    ## 🆘 Support
    If you have questions or need help, please contact the cluster administrators.
