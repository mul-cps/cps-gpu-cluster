      c.KubeSpawner.environment = {
          'NVIDIA_VISIBLE_DEVICES': 'all',
          'NVIDIA_DRIVER_CAPABILITIES': 'compute,utility'
      }

singleuser:
  image:
    name: quay.io/jupyter/tensorflow-notebook
    tag: "2025-11-06"
    pullPolicy: Always

  serviceAccountName: dask-sa

  networkPolicy:
    enabled: true
    ingress: []
    egress:
      - ports:
          - port: 443
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                name: kube-system
    egressAllowRules:
      cloudMetadataServer: false
      dnsPortsCloudMetadataServer: true
      dnsPortsKubeSystemNamespace: true
      dnsPortsPrivateIPs: true
      nonPrivateIPs: true
      privateIPs: true

  extraFiles:
    jupyter-server-config:
      mountPath: /etc/jupyter/jupyter_server_config.py
      stringData: |
        # /etc/jupyter/jupyter_server_config.py
        c = get_config()  # noqa

        # ensure extensions are wired – these calls are idempotent if the package is missing
        c.ServerApp.jpserver_extensions = getattr(c.ServerApp, "jpserver_extensions", {})

        for ext in [
            "jupyter_server_proxy",
            "jupyter_code_server",
            "jupyter_remote_desktop_proxy",
        ]:
            c.ServerApp.jpserver_extensions.setdefault(ext, True)

        # Optional: always allow proxied hosts (you already do something similar)
        c.ServerProxy = getattr(c, "ServerProxy", {})
        c.ServerProxy["host_allowlist"] = lambda app, host: True
    dask-dashboard-config:
      mountPath: /home/jovyan/.config/dask/distributed.yaml
      stringData: |
        distributed:
          dashboard:
            link: "/user/{JUPYTERHUB_USER}/proxy/{host}:{port}/status"

  storage:

    capacity: 10Gi
    dynamic:
      storageClass: longhorn-fast
      pvcNameTemplate: "claim-{username}"
      storageAccessModes: ["ReadWriteMany"]
    homeMountPath: /home/jovyan


    extraVolumes:
      dshm:
        name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      ephemeral-work:
        name: ephemeral-work
        emptyDir: {}

      user-docs:
        name: user-docs
        configMap:
          name: jupyterhub-user-docs


    extraVolumeMounts:
      dshm:
        name: dshm
        mountPath: /dev/shm
      ephemeral-work:
        name: ephemeral-work
        mountPath: /home/jovyan/work

      user-docs-warning:
        name: user-docs
        mountPath: /home/jovyan/00_IMPORTANT_STORAGE_WARNING.md
        subPath: 00_IMPORTANT_STORAGE_WARNING.md
        readOnly: true
      user-docs-guide:
        name: user-docs
        mountPath: /home/jovyan/01_CLUSTER_GUIDE.md
        subPath: 01_CLUSTER_GUIDE.md
        readOnly: true


  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 4G
    guarantee: 2G

  # uid: 1000
  # fsGid: 100
  extraEnv:
    NOTEBOOK_ARGS: "--allow-root"
    DASK_KUBERNETES__OPERATOR__NAMESPACE: "dask-compute"

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: false

# Global idle culler (built-in JupyterHub culler)
cull:
  enabled: true
  timeout: 172800 # 2 days idle timeout #3600     # 1h idle timeout
  every: 600        # check every 10 min
  maxAge: 0         # Disable max age limit
  users: false
  adminUsers: false
  removeNamedServers: false
  concurrency: 10

prePuller:
  continuous:
    enabled: true
  extraImages:
    datascience:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-standard-cpu"
    rapidsai:
      name: nvcr.io/nvidia/rapidsai/base
      tag: "24.08-cuda12.2-py3.10"
    cps-pytorch:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-pytorch-code"
    cps-tf:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-tf-code"
    cps-desktop-ros2:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-desktop-ros2"
