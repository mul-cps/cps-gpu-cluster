          <script>
          (function(){{
            var cards = document.querySelectorAll('.option-card');
            function selectCard(el) {{
              cards.forEach(function(card) {{ card.classList.remove('selected'); }});
              el.classList.add('selected');
              var input = el.querySelector('input[type="radio"]');
              if (input) {{
                input.checked = true;
              }}
            }}
            cards.forEach(function(card) {{
              card.addEventListener('click', function() {{ selectCard(card); }});
            }});

            var master = document.getElementById('mount-nfs');
            var mountArea = document.getElementById('spawn-face-back');
            function syncNfsControls() {{
              var enabled = master ? master.checked : true;
              if (!mountArea) {{
                return;
              }}
              mountArea.querySelectorAll('input[name$="_nfs"], input[name^="custom_nfs_"], select, textarea').forEach(function(field) {{
                if (field === master || field.name === 'profile' || field.name === 'custom_image' || field.name === 'custom_gpus') {{
                  return;
                }}
                field.disabled = !enabled;
              }});
            }}
            if (master) {{
              master.addEventListener('change', syncNfsControls);
              syncNfsControls();
            }}

            var flipFrame = document.getElementById('spawn-flip-frame');
            var flipCard = document.getElementById('spawn-flip-card');
            var flipToggle = document.getElementById('flip-toggle');
            var flipCopy = document.getElementById('flip-copy');
            var frontFace = document.getElementById('spawn-face-front');
            var backFace = document.getElementById('spawn-face-back');

            function syncFlipHeight() {{
              if (!flipFrame || !flipCard || !frontFace || !backFace) {{
                return;
              }}
              var activeFace = flipCard.classList.contains('is-flipped') ? backFace : frontFace;
              flipFrame.style.height = activeFace.offsetHeight + 'px';
            }}

            function setFlipState(flipped) {{
              if (!flipCard || !flipToggle) {{
                return;
              }}
              flipCard.classList.toggle('is-flipped', flipped);
              flipToggle.textContent = flipped ? 'Back to Quick Start' : 'Options';
              flipToggle.setAttribute('aria-pressed', flipped ? 'true' : 'false');
              if (flipCopy) {{
                flipCopy.textContent = flipped
                  ? 'These settings change what Start Server launches. Flip back if you just want the default environment.'
                  : 'Start Server uses the default profile unless you open Options and change the configuration.';
              }}
              window.requestAnimationFrame(syncFlipHeight);
            }}

            if (flipToggle) {{
              flipToggle.addEventListener('click', function() {{
                setFlipState(!flipCard.classList.contains('is-flipped'));
              }});
            }}

            window.addEventListener('resize', syncFlipHeight);
            window.requestAnimationFrame(syncFlipHeight);
          }})();
          </script>
          """

      c.KubeSpawner.options_form = get_options_form

      # ---------- Parse form ----------
      def options_from_form(formdata):
          opts = {}
          opts['profile'] = formdata.get('profile', ['cpu-default'])[0]
          opts['mount_nfs'] = form_bool(formdata, 'mount_nfs', False)
          opts['mount_personal_nfs'] = form_bool(formdata, 'mount_personal_nfs', False)
          opts['mount_persistent1_shared_nfs'] = form_bool(formdata, 'mount_persistent1_shared_nfs', False)
          opts['mount_scratch_nfs'] = form_bool(formdata, 'mount_scratch_nfs', False)
          opts['mount_scratch_recovery_nfs'] = form_bool(formdata, 'mount_scratch_recovery_nfs', False)
          opts['custom_nfs_enabled'] = form_bool(formdata, 'custom_nfs_enabled', False)
          opts['custom_nfs_server'] = formdata.get('custom_nfs_server', [''])[0].strip()
          opts['custom_nfs_path'] = formdata.get('custom_nfs_path', [''])[0].strip()
          opts['custom_nfs_mount_path'] = formdata.get('custom_nfs_mount_path', [''])[0].strip()
          custom_image = formdata.get('custom_image', [''])[0].strip()
          if custom_image:
              opts['custom_image'] = custom_image
          try:
              opts['custom_gpus'] = int(formdata.get('custom_gpus', ['0'])[0])
          except Exception:
              opts['custom_gpus'] = 0
          return opts
      c.Spawner.options_from_form = options_from_form
      c.Spawner.http_timeout = 300
      c.Spawner.start_timeout = 300

      # ---------- Canonical profile configs ----------
