            cards.forEach(c=>c.addEventListener('click', ()=>selectCard(c)));

            var master = document.getElementById('mount-nfs');
            var mountEditors = document.querySelectorAll('.mount-editor');

            function syncNfsControls() {{
              var enabled = master ? master.checked : true;
              mountEditors.forEach(function(editor) {{
                editor.querySelectorAll('input, select, textarea').forEach(function(field) {{
                  if (field === master) {{
                    return;
                  }}
                  field.disabled = !enabled;
                }});
              }});
            }}

            if (master) {{
              master.addEventListener('change', syncNfsControls);
              syncNfsControls();
            }}

            var teaserPanels = Array.from(document.querySelectorAll('details.profile-category, details.mount-editor'));
            var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var teaserKey = 'jupyterhub-mount-profile-teaser-seen';
            var teaserSeen = false;

            try {{
              teaserSeen = window.sessionStorage.getItem(teaserKey) === '1';
            }} catch (e) {{
              teaserSeen = false;
            }}

            function teasePanel(panel, delay) {{
              if (prefersReducedMotion || teaserSeen || !panel || panel.open) {{
                return;
              }}
              window.setTimeout(function() {{
                if (panel.open) {{
                  return;
                }}
                panel.style.setProperty('--tease-height', (panel.dataset.teaseHeight || 84) + 'px');
                panel.classList.add('teasing');
                panel.open = true;
                window.setTimeout(function() {{
                  panel.open = false;
                  window.setTimeout(function() {{
                    panel.classList.remove('teasing');
                    panel.style.removeProperty('--tease-height');
                  }}, 24);
                }}, 720);
              }}, delay);
            }}

            if (!teaserSeen) {{
              teaserPanels.forEach(function(panel, idx) {{
                teasePanel(panel, 900 + (idx * 700));
              }});
              window.setTimeout(function() {{
                try {{
                  window.sessionStorage.setItem(teaserKey, '1');
                }} catch (e) {{}}
              }}, 900 + (teaserPanels.length * 700) + 500);
            }}
          }})();
          </script>
