proxy:
  # secretToken is intentionally NOT set here (was previously a plaintext
  # placeholder literal, now removed). An attempt (2026-07-23) to instead
  # override CONFIGPROXY_AUTH_TOKEN via a second same-named extraEnv entry
  # (relying on "last one wins" container env semantics) was REVERTED the
  # same day: it broke Fleet's strategic-merge-patch apply against the live
  # hub Deployment ("doesn't match $setElementOrder list") because two env
  # entries sharing one name make the patch's list-merge undecidable --
  # this blocked ALL further reconciliation of this bundle, not just this
  # field. Reverted to the chart's own default auto-generated/persisted
  # CONFIGPROXY_AUTH_TOKEN (chart's own "hub" Secret), which was already
  # working correctly before this was touched. See
  # docs/sops-secrets-migration.md for the incident writeup and the
  # unused-but-harmless proxy-sopssecret.yaml this attempt left behind
  # (kept for a future properly-verified retry, not wired into any
  # kustomization resources list, so it has no live effect).
  service:
    type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - jupyterhub.cps.unileoben.ac.at
    - jupyterhub.dshl.unileoben.ac.at
  tls:
    - secretName: wildcard-cps-cert
      hosts: [jupyterhub.cps.unileoben.ac.at]
    - secretName: dshl-wildcard
      hosts: [jupyterhub.dshl.unileoben.ac.at]

hub:
  extraEnv:
    - name: OAUTH_CLIENT_SECRET
      # client-secret sourced from jupyterhub-oauth-secret, now SOPS-managed — see oauth-sopssecret.yaml
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oauth-secret
          key: client-secret
    # POSTGRES_PASSWORD is read from the postgresql-secret Secret (produced
    # by postgres-sopssecret.yaml) and used to build db_url below at
    # startup via extraConfig/00-postgres-db-url -- avoids a plaintext
    # password literal in this values file. Same pattern as OAUTH_CLIENT_SECRET.
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgresql-secret
          key: postgres-password
    # LDAP_BIND_PASSWORD is read from the jupyterhub-ldap-credentials Secret
    # (produced by ldap-sopssecret.yaml) and used by get_ldap_info() in
    # extraConfig/02-profiles below -- avoids the LDAP bind-service-account
    # password being a plaintext literal in this values file. Same pattern
    # as OAUTH_CLIENT_SECRET/POSTGRES_PASSWORD. NOTE: this reuses the
    # existing 'ldapservice' credential value as-is; it is NOT a rotated
    # password -- see docs/sops-secrets-migration.md rotation checklist.
    - name: LDAP_BIND_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jupyterhub-ldap-credentials
          key: bind-password
    # SSH_GATEWAY_TOKEN is a dedicated admin-scoped JupyterHub API token for
    # the jupyterhub-ssh gateway service (see
    # ../jupyterhub-ssh/ssh-gateway-sopssecret.yaml), registered as a
    # JupyterHub service below (extraConfig/00-ssh-gateway-service) so the
    # gateway can start/locate any user's server for SSH public-key auth,
    # where (unlike password/token auth) there is no per-request user token
    # available. The SAME token value is also injected into the
    # jupyterhub-ssh pod itself (see
    # ../jupyterhub-ssh/chart/templates/ssh/deployment.yaml) from the same
    # Secret, so both sides agree on the credential.
    - name: SSH_GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: jupyterhub-ssh-gateway-token
          key: admin-api-token
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: oauthenticator.generic.GenericOAuthenticator
      allow_named_servers: true
      named_server_limit_per_user: 3
      # Allow Prometheus to scrape /hub/metrics without a token -- added
      # 2026-07-07 to support the JupyterHub Stats Grafana dashboard
      # (grafana.com ID 23694). Confirmed live the endpoint was 403ing
      # unauthenticated scrapes before this; metrics content itself has
      # no sensitive data (aggregate counts only).
      authenticate_prometheus: false
      # db_url is NOT set here (was previously a literal with the
      # password embedded, duplicating the plaintext in postgresql.yaml's
      # Secret). It is now assembled at runtime in
      # extraConfig/00-postgres-db-url below from the POSTGRES_PASSWORD
      # env var (sourced from the postgresql-secret Secret via extraEnv
      # above), so no password literal exists in this file.
      template_vars:
        org:
          name: "Montanuniversität Leoben"
          logo_url: "https://www.unileoben.ac.at/fileadmin/shares/allgemeine_datenbank/logos/1-mul-logo/2-mul-logo-smoke-quer.svg"
          url: "https://www.unileoben.ac.at"
    GenericOAuthenticator:
      # REPOINTED TO DEX 2026-07-24 (docs/dex-idp-broker.md): this instance
      # now authenticates through the Dex broker instead of CPS Authentik
      # directly, so users can choose either CPS or CIT login at Dex's
      # connector-selection screen. username_claim/claim_groups_key are
      # UNCHANGED on purpose -- Dex's default claim mapping forwards
      # Authentik's preferred_username/groups claims through unchanged
      # (verified against dexidp/dex source: connector/oidc/oidc.go's
      # default ClaimMapping keys are literally "preferred_username" and
      # "groups", matching Authentik's own claim names), so existing users'
      # usernames -- and therefore their PVC-backed home directories --
      # must resolve identically whether they log in via CPS or CIT.
      # VERIFY LIVE with a known existing user before trusting this in
      # production: confirm no new claim-<username> PVC gets created.
      #
      # ROLLBACK: to revert to direct CPS Authentik (pre-Dex), restore
      # client_id/authorize_url/token_url/userdata_url/login_service to:
      #   client_id: "vUhzKqEF0UxPtZNM8aRbA1ncaehhIAIA2x9r83FI"
      #   authorize_url: "https://auth.cps.unileoben.ac.at/application/o/authorize/"
      #   token_url: "https://auth.cps.unileoben.ac.at/application/o/token/"
      #   userdata_url: "https://auth.cps.unileoben.ac.at/application/o/userinfo/"
      #   login_service: "CPS Authentik"
      #   tls_verify: false
      # and restore jupyterhub-oauth-secret's client-secret to the old
      # Authentik-issued value (rotate a new one in Authentik if the old
      # one was ever exposed -- do not reuse a burned secret).
      #
      # RE-ENABLED 2026-07-24: was disabled for self-signed Authentik certs
      # (direct-to-Authentik OIDC endpoints). Dex serves a real, publicly
      # trusted HARICA wildcard cert (confirmed live via `openssl s_client`
      # and a plain `curl` without `-k`, see docs/troubleshooting.md's TLS
      # incident and docs/dex-idp-broker.md), so this workaround is no
      # longer needed now that all OIDC endpoints point at Dex, not
      # Authentik directly.
      tls_verify: true
      client_id: "jupyterhub"
      # client_secret is set via extraConfig/00-oauth-secret below, read from
      # the OAUTH_CLIENT_SECRET env var (injected from the jupyterhub-oauth-secret
      # k8s Secret via hub.extraEnv). Now holds Dex's static client shared
      # secret (dex-jhub-client), not an Authentik-issued one -- see
      # system/auth/dex/jhub-client-sopssecret.yaml.
      oauth_callback_url: "https://jupyterhub.dshl.unileoben.ac.at/hub/oauth_callback"
      authorize_url: "https://dex.dshl.unileoben.ac.at/auth"
      token_url: "https://dex.dshl.unileoben.ac.at/token"
      userdata_url: "https://dex.dshl.unileoben.ac.at/userinfo"
      login_service: "Login (CPS or CIT via Dex)"
      username_claim: "preferred_username"
      scope: ["openid","profile","email","groups"]
      claim_groups_key: "groups"
      manage_groups: true
      admin_groups: ["jupyter_admin"]
      # Allow all users authenticated by Authentik
      allow_all: true

  # z2jh's default hub NetworkPolicy only allows ingress from pods labeled
  # hub.jupyter.org/network-access-hub=true, blocking Prometheus (added
  # 2026-07-07 for the JupyterHub Stats dashboard, grafana.com 23694) from
  # reaching /hub/metrics -- confirmed live: `dial tcp ...: connection
  # refused` from the Prometheus pod despite the endpoint working fine
  # in-pod/via authenticate_prometheus:false. Adds a second ingress rule
  # permitting the monitoring namespace on the metrics port, without
  # removing the existing label-based rule.
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: cattle-monitoring-system
        ports:
          - port: http
            protocol: TCP

  db:
    pvc:
      storageClassName: longhorn
      storage: 10Gi


  extraVolumes:
    - name: ca-bundle
      emptyDir: {}
    - name: harica-ca
      configMap:
        name: harica-ca
        items:
          - key: harica-root
            path: harica-root.pem
          - key: geant-intermediate
            path: geant-intermediate.pem

  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /ca-bundle
    - name: harica-ca
      mountPath: /harica

  extraConfig:
    00-oauth-secret: |
      import os
      c.GenericOAuthenticator.client_secret = os.environ['OAUTH_CLIENT_SECRET']

    00-ssh-gateway-service: |
      import os
      # Registers the jupyterhub-ssh gateway as an admin-scoped JupyterHub
      # service so it can start/locate any user's server for SSH
      # public-key auth (see jupyterhub-ssh's patch-configmap.yaml
      # validate_public_key, which uses this same token). The token value
      # itself lives in the jupyterhub-ssh-gateway-token Secret (SOPS,
      # see ../jupyterhub-ssh/ssh-gateway-sopssecret.yaml) and is injected
      # here via SSH_GATEWAY_TOKEN (hub.extraEnv above).
      #
      # MUST append, not overwrite: the chart's own `cull:` config
      # (jupyterhub-idle-culler) already populates c.JupyterHub.services
      # by this point in extraConfig evaluation order (config sections
      # execute in key-sorted order, and the chart's own hub-config
      # template is loaded before any extraConfig entry) -- replacing the
      # list wholesale here previously clobbered the idle-culler service,
      # crash-looping the whole hub with "Found undefined service
      # jupyterhub-idle-culler in role jupyterhub-idle-culler" (confirmed
      # live, 2026-08-04).
      c.JupyterHub.services = c.JupyterHub.services + [
          {
              "name": "ssh-gateway",
              "admin": True,
              "api_token": os.environ["SSH_GATEWAY_TOKEN"],
          }
      ]

    00-postgres-db-url: |
      import os
      c.JupyterHub.db_url = "postgresql://jhub:{}@postgresql:5432/jhub".format(
          os.environ['POSTGRES_PASSWORD']
      )

    00-install-packages: |
      import subprocess, sys
      try:
          import oauthenticator
          import ldap3
      except ImportError:
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'oauthenticator', 'ldap3'])

    01-custom-templates: |
      # Custom template functionality disabled to avoid ConfigMap conflicts
      # Templates are managed separately if needed

    02-profiles: |
      # ---------- Access logic ----------
      # Groups that have full access (GPU + Shared Storage)
      # Groups that have full access (GPU + Shared Storage)
      POWER_USER_GROUPS = {'app_jupyterhub_poweruser', 'jupyter_admin'}

      # TODO(platform-owner): placeholder group name(s) - replace with the real
      # Authentik/LDAP group(s) used for enrolled course/student accounts once known.
      STUDENT_GROUPS = {'app_jupyterhub_student'}

      def is_power_user(user):
          user_groups = {getattr(g, "name", g) for g in user.groups}
          return bool(user.admin) or bool(user_groups & POWER_USER_GROUPS)

      def is_student(user):
          user_groups = {getattr(g, "name", g) for g in user.groups}
          return bool(user_groups & STUDENT_GROUPS)

      STANDARD_NFS_MOUNTS = [
          {
              'key': 'personal',
              'label': 'Personal user share',
              'description': 'Mount your per-user NFS share for long-lived files.',
              'volume_name': 'cps-persistent1-users',
              'claim_name': 'cps-persistent1-users-pvc',
              'mount_path': '/home/jovyan/cps_persistent1_users',
              'mount_options': [
