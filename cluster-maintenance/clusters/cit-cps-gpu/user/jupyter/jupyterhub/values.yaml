              'default_checked': True,
              'power_user_only': True,
          },
          {
              'key': 'scratch',
              'label': 'Scratch storage',
              'description': 'Temporary high-capacity storage for large intermediate artifacts.',
              'volume_name': 'cps-scratch1-tmp',
              'claim_name': 'cps-scratch1-tmp-pvc',
              'mount_path': '/home/jovyan/cps_scratch1_tmp',
              'mount_options': [
                  'nfsvers=4.2',
                  'proto=tcp',
                  'hard',
                  'timeo=150',
                  'retrans=2',
                  'rsize=1048576',
                  'wsize=1048576',
                  'nconnect=8',
                  'noresvport',
                  'noatime',
                  '_netdev',
                  'x-systemd.automount',
                  'x-systemd.idle-timeout=600s',
                  'x-systemd.requires=network-online.target',
                  'x-systemd.after=network-online.target',
                  'nofail',
              ],
              'kind': 'pvc',
              'default_checked': True,
              'power_user_only': True,
          },
      ]

      CUSTOM_NFS_DEFAULT_SERVER = '193.170.30.58'
      CUSTOM_NFS_DEFAULT_MOUNT_PATH = '/home/jovyan/custom_nfs'

      def form_bool(formdata, key, default=False):
          values = formdata.get(key, [])
          if not values:
              return default
          return values[0].strip().lower() in ('1', 'true', 'on', 'yes', 'checked')

      def append_volume_mount(spawner, volume_spec, mount_spec):
          if spawner.volumes is None:
              spawner.volumes = []
          if isinstance(spawner.volumes, list):
              spawner.volumes.append(volume_spec)
          elif isinstance(spawner.volumes, dict):
              spawner.volumes[volume_spec['name']] = volume_spec

          if spawner.volume_mounts is None:
              spawner.volume_mounts = []
          if isinstance(spawner.volume_mounts, list):
              spawner.volume_mounts.append(mount_spec)
          elif isinstance(spawner.volume_mounts, dict):
              spawner.volume_mounts[mount_spec['name']] = mount_spec

      def sanitize_nfs_volume_name(raw_name):
          import re
          cleaned = re.sub(r'[^a-z0-9-]+', '-', raw_name.lower()).strip('-')
          return cleaned[:48] or 'custom-nfs'

      # ---------- LDAP Lookup ----------
      def get_ldap_info(username, log=None):
          from ldap3 import Server, Connection, ALL
          
          # LDAP Config
          LDAP_SERVER = 'ldaps://auth.cps.unileoben.ac.at:636'
          LDAP_USER = 'cn=ldapservice,ou=users,dc=ldap,dc=goauthentik,dc=io'
          LDAP_PASSWORD = 'ldapservice'
          SEARCH_BASE = 'ou=users,dc=ldap,dc=goauthentik,dc=io'
          
          try:
              if log: log.info(f"LDAP: Connecting to {LDAP_SERVER}...")
              server = Server(LDAP_SERVER, get_info=ALL, connect_timeout=5)
              conn = Connection(server, user=LDAP_USER, password=LDAP_PASSWORD, auto_bind=True, receive_timeout=5)
              
              # Search for user
              if log: log.info(f"LDAP: Searching for {username}...")
              search_filter = f'(cn={username})'
              conn.search(SEARCH_BASE, search_filter, attributes=['uidNumber', 'gidNumber'])
              
              if len(conn.entries) > 0:
                  entry = conn.entries[0]
                  if log: log.info(f"LDAP: Found user {username}: {entry.entry_dn}")
                  return {
                      'uid': int(entry.uidNumber.value),
                      'gid': int(entry.gidNumber.value)
                  }
              else:
                  if log: log.warning(f"LDAP: User {username} not found")
                  return None
          except Exception as e:
              if log: log.error(f"LDAP Error for {username}: {e}")
              else: print(f"LDAP Error for {username}: {e}")
              return None

      # ---------- Dynamic UI Generation ----------
      def get_options_form(spawner):
          power_user = is_power_user(spawner.user)
          # We need PROFILE_CONFIGS here, but it is defined later.
          # In Python script execution order, functions are defined but not executed until called.
          # So as long as PROFILE_CONFIGS is defined before get_options_form is CALLED, it's fine.
          
          allowed_profiles = get_profile_list(spawner)
          
          # Helper to render a card
          def render_card(slug, cfg, selected=False):
              gpu = cfg.get('gpu', 0)
              cpu = cfg.get('cpu_limit', 0)
              mem = cfg.get('mem_limit', '0G')
              
              chips = []
              if gpu > 0:
                  chips.append(f'<span class="chip gpu-chip">{gpu}× GPU</span>')
              elif 'mig' in slug:
                   chips.append(f'<span class="chip gpu-chip">MIG</span>')
              
              chips.append(f'<span class="chip cpu-chip">{int(cpu)} vCPU</span>')
              chips.append(f'<span class="chip ram-chip">{mem} RAM</span>')
              if selected:
                  chips.append('<span class="chip default-chip">Default start</span>')
              
              cls = "card selected" if selected else "card"
              checked = "checked" if selected else ""
              
              return f"""
              <label class="{cls}" data-slug="{slug}">
                <input type="radio" name="profile" value="{slug}" {checked}>
                <div class="row">
                  <div class="name">{cfg['display_name']}</div>
                  <div class="meta">{''.join(chips)}</div>
                </div>
              </label>
              """

          # Generate Grid
          cards_html = []
          
          # Define Categories
          categories = {
              'CPU-only (general purpose)': [],
              'GPU-enabled': [],
              'Special': []
          }
          
          # Sort profiles into categories
          for p in allowed_profiles:
              slug = p['slug']
              cfg = PROFILE_CONFIGS[slug]
              cat = cfg.get('category', 'Special')
              if cat in categories:
                  categories[cat].append(p)
              else:
                  categories['Special'].append(p)

          # Render Categories
          for cat_name, profiles in categories.items():
              if not profiles: continue
              
              # Render cards for this category
              cat_cards = []
              for p in profiles:
                  slug = p['slug']
                  cfg = PROFILE_CONFIGS[slug]
                  is_default = cfg.get('default', False)
                  cat_cards.append(render_card(slug, cfg, selected=is_default))
              
              cat_grid = "\n".join(cat_cards)
              
              # Collapsible Section
              cards_html.append(f"""
              <details class="profile-category" data-tease-height="104" style="margin-bottom: 16px; width: 100%;">
                <summary style="font-weight: 600; color: #374151; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; margin-bottom: 8px; list-style: none; display: flex; align-items: center;">
                  <span style="margin-right: 6px;">▶</span> {cat_name}
                </summary>
                <div class="teaser-content">
                  <div class="grid">
                    {cat_grid}
                  </div>
                </div>
              </details>
              """)
          
          grid_html = "\n".join(cards_html)
          
          nfs_mounts_html = []
          for spec in STANDARD_NFS_MOUNTS:
              if spec.get('power_user_only') and not power_user:
                  continue
              checked = "checked" if spec.get('default_checked', False) else ""
              nfs_mounts_html.append(f"""
              <label class="mount-item">
                <div class="mount-item-header">
                  <div>
                    <div class="mount-item-title">
                      <input type="checkbox" name="mount_{spec['key']}_nfs" value="1" {checked} style="width:auto; margin:0 8px 0 0;">
                      <span>{spec['label']}</span>
                    </div>
                    <div class="hint">{spec['description']}</div>
                  </div>
                  <div class="mount-pill">{spec['mount_path']}</div>
                </div>
                <div class="mount-details">
                  <div><strong>Source:</strong> {spec['claim_name']}</div>
                  <div><strong>Mount options:</strong> {', '.join(spec['mount_options'])}</div>
                </div>
              </label>
              """)

          custom_nfs_html = ""
          if power_user:
              custom_nfs_html = f"""
              <details class="mount-editor" data-tease-height="88">
                <summary style="font-weight: 600; color: #374151; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; margin-bottom: 8px; list-style: none; display: flex; align-items: center;">
                  <span style="margin-right: 6px;">▶</span> Custom NFS mount
                </summary>
                <div class="teaser-content">
                  <label style="display:flex; align-items:center; gap:10px; font-weight:500; color:#111827; cursor:pointer; margin-top: 8px;">
                    <input type="checkbox" name="custom_nfs_enabled" value="1" style="width:auto; margin:0;">
                    <span>Enable custom NFS mount</span>
                  </label>
                  <div class="hint">Use this for a user-specific export that is not part of the standard NFS mount list.</div>
                  <div class="mount-grid">
                    <div>
                      <div class="name" style="margin-bottom:6px;">NFS server</div>
                      <input class="input" type="text" name="custom_nfs_server" value="{CUSTOM_NFS_DEFAULT_SERVER}" placeholder="192.0.2.10 or storage.example.org" />
                      <div class="hint">Host or IP of the NFS server.</div>
                    </div>
                    <div>
                      <div class="name" style="margin-bottom:6px;">Export path</div>
                      <input class="input" type="text" name="custom_nfs_path" placeholder="/exports/project-data" />
                      <div class="hint">Absolute path exported by the server.</div>
                    </div>
                    <div>
                      <div class="name" style="margin-bottom:6px;">Mount path inside the notebook</div>
                      <input class="input" type="text" name="custom_nfs_mount_path" value="{CUSTOM_NFS_DEFAULT_MOUNT_PATH}" placeholder="/home/jovyan/custom_nfs" />
                      <div class="hint">Where the custom export should appear in the container.</div>
                    </div>
                    <div>
                      <div class="name" style="margin-bottom:6px;">Notes</div>
                      <div class="hint">Custom NFS mounts use the same fail-safe spawn flow, but they do not inherit the PV-level mount options shown above.</div>
                    </div>
                  </div>
                </div>
              </details>
              """

          storage_options_html = f"""
          <div class="layer">
            <div class="row" style="align-items:flex-start; gap:16px; flex-wrap: wrap;">
              <div style="flex:1; min-width: 260px;">
                <div class="name" style="margin-bottom:6px;">Network Storage</div>
                <label style="display:flex; align-items:center; gap:10px; font-weight:500; color:#111827; cursor:pointer;">
                  <input type="checkbox" id="mount-nfs" name="mount_nfs" value="1" checked style="width:auto; margin:0;">
                  <span>Enable network mounts</span>
                </label>
                <div class="hint">Uncheck this to start on Longhorn-only storage. Power users can expand the mount editor below to choose specific NFS mounts or add a custom export.</div>
                <div class="hint">The Longhorn shared workspace at <code>/home/jovyan/shared</code> stays available for power users.</div>
              </div>
            </div>

            <details class="mount-editor" data-tease-height="92">
              <summary style="font-weight: 600; color: #374151; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; margin-bottom: 8px; list-style: none; display: flex; align-items: center;">
                <span style="margin-right: 6px;">▶</span> Standard mounts
              </summary>
              <div class="teaser-content">
                <div class="hint">Each item shows the cluster-default mount options for the underlying NFS PV. Clear the boxes you do not want.</div>
                <div class="mount-list">
                  {''.join(nfs_mounts_html)}
                </div>
              </div>
            </details>

            {custom_nfs_html}
          </div>
          """

          # Custom Image Section (Only for power users)
          custom_image_html = ""
          if power_user:
              custom_image_html = """
              <div class="layer">
                <div class="row" style="align-items:flex-start; gap:16px; flex-wrap: wrap;">
                  <div style="flex:1; min-width: 260px;">
                    <div class="name" style="margin-bottom:6px;">Optional: Custom Image</div>
