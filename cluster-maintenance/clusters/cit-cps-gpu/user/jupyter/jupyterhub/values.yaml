      # ---------- Generate profile list ----------
      c.KubeSpawner.image_pull_policy = 'Always'
      # Route every spawned pod through KAI Scheduler by default, not just
      # GPU profiles -- previously only set inside apply_profile_settings
      # for GPU profiles, which left any non-GPU pod (and any pod spawned
      # before the profile hook's scheduler_name assignment took effect)
      # eligible for whatever scheduler the chart's built-in
      # scheduling.userScheduler happened to be running, causing
      # inconsistent routing between kai-scheduler and
      # jupyterhub-user-scheduler. See docs/troubleshooting.md and
      # scheduling.userScheduler.enabled: false below -- both changes are
      # required together (a per-spawner default here does not stop a
      # second, independently-active scheduler from also competing for
      # placement of the same pods). gpu-slurm profile still overrides
      # this via cfg['scheduler_name'] in apply_profile_settings.
      c.KubeSpawner.scheduler_name = 'kai-scheduler'
      
      def get_profile_list(spawner):
          # Filter profiles based on user groups
          power_user = is_power_user(spawner.user)
          student_user = is_student(spawner.user)

          profiles = []
          for slug, cfg in PROFILE_CONFIGS.items():
              # 'gpu-student' is a special case: not gated by power-user status,
              # only by STUDENT_GROUPS membership (mirrors the 'power_user_only'
              # gating pattern used for STANDARD_NFS_MOUNTS).
              if cfg.get('student_profile'):
                  if not (student_user or power_user):
                      continue
                  profiles.append({
                      'display_name': cfg['display_name'],
                      'slug': slug,
                      'description': cfg.get('description', ''),
                      'default': cfg.get('default', False),
                  })
                  continue

              # If not power user, skip GPU profiles and advanced profiles
              if not power_user:
                  if cfg.get('gpu', 0) > 0:
                      continue
                  if slug in {'dask-cluster', 'gpu-slurm'}:
                      continue

              profiles.append({
                  'display_name': cfg['display_name'],
                  'slug': slug,
                  'description': cfg.get('description', ''),
                  'default': cfg.get('default', False),
              })
          return profiles

      c.KubeSpawner.profile_list = get_profile_list

      # ---------- Apply profile & per-profile knobs ----------
      async def apply_profile_settings(spawner):
          profile_slug = spawner.user_options.get('profile', 'cpu-default')
          mount_nfs = bool(spawner.user_options.get('mount_nfs', False))
          mount_personal_nfs = bool(spawner.user_options.get('mount_personal_nfs', False))
          mount_persistent1_shared = bool(spawner.user_options.get('mount_persistent1_shared_nfs', False))
          mount_scratch_nfs = bool(spawner.user_options.get('mount_scratch_nfs', False))
          mount_scratch_recovery_nfs = bool(spawner.user_options.get('mount_scratch_recovery_nfs', False))
          custom_nfs_enabled = bool(spawner.user_options.get('custom_nfs_enabled', False))
          custom_nfs_server = spawner.user_options.get('custom_nfs_server', '').strip()
          custom_nfs_path = spawner.user_options.get('custom_nfs_path', '').strip()
          custom_nfs_mount_path = spawner.user_options.get('custom_nfs_mount_path', '').strip()
          custom_image = spawner.user_options.get('custom_image', '').strip()
          custom_gpus = int(spawner.user_options.get('custom_gpus', 0) or 0)
          cfg = PROFILE_CONFIGS.get(profile_slug, PROFILE_CONFIGS['cpu-default'])
          requested_network_mounts = []
          requested_storage_mounts = []
          spawner.log.info(
              f"{spawner.user.name} -> profile={profile_slug}, mount_nfs={mount_nfs}, "
              f"mount_personal_nfs={mount_personal_nfs}, mount_persistent1_shared={mount_persistent1_shared}, "
              f"mount_scratch_nfs={mount_scratch_nfs}, mount_scratch_recovery_nfs={mount_scratch_recovery_nfs}, "
              f"custom_nfs_enabled={custom_nfs_enabled}, "
              f"custom_image={'set' if custom_image else 'none'}, custom_gpus={custom_gpus}"
          )

          # LDAP Lookup for UID/GID
          ldap_info = get_ldap_info(spawner.user.name, spawner.log)
          
          # Default to jovyan (fail-safe)
          spawner.uid = 1000
          spawner.fs_gid = 100
          
          if ldap_info:
              spawner.uid = ldap_info['uid']
              spawner.gid = ldap_info['gid']
              spawner.fs_gid = ldap_info['gid']
              spawner.log.info(f"LDAP: Set {spawner.user.name} to UID={spawner.uid}, GID={spawner.gid}")
          else:
              spawner.log.warning(f"LDAP: Could not find UID/GID for {spawner.user.name}, using default UID 1000/100. NFS share will NOT be mounted.")

          if not mount_nfs:
              mount_personal_nfs = False
              mount_persistent1_shared = False
              mount_scratch_nfs = False
              mount_scratch_recovery_nfs = False
              custom_nfs_enabled = False

          if mount_nfs and mount_personal_nfs and ldap_info:
              user_nfs_vol = {'name': 'cps-persistent1-users', 'persistentVolumeClaim': {'claimName': 'cps-persistent1-users-pvc'}}
              user_nfs_mount = {'name': 'cps-persistent1-users', 'mountPath': '/home/jovyan/cps_persistent1_users'}
              append_volume_mount(spawner, user_nfs_vol, user_nfs_mount)
              requested_network_mounts.append('personal')
          elif mount_nfs and mount_personal_nfs and not ldap_info:
              spawner.log.warning(f"NFS personal share requested for {spawner.user.name} but LDAP UID/GID lookup failed; skipping")

          if is_power_user(spawner.user):
              # Keep a larger working volume for power users even when network mounts are off.
              spawner.storage_capacity = '100Gi'
              shared_vol = {'name': 'shared', 'persistentVolumeClaim': {'claimName': 'jupyterhub-shared-storage'}}
              shared_mount = {'name': 'shared', 'mountPath': '/home/jovyan/shared'}
              append_volume_mount(spawner, shared_vol, shared_mount)
              requested_storage_mounts.append('shared-longhorn')

              if mount_nfs and mount_persistent1_shared:
                  shared_pvc_vol = {'name': 'cps-persistent1-shared', 'persistentVolumeClaim': {'claimName': 'cps-persistent1-shared-pvc'}}
                  shared_pvc_mount = {'name': 'cps-persistent1-shared', 'mountPath': '/home/jovyan/cps_persistent1_shared'}
                  append_volume_mount(spawner, shared_pvc_vol, shared_pvc_mount)
                  requested_network_mounts.append('persistent1-shared')
              if mount_nfs and (mount_scratch_nfs or mount_scratch_recovery_nfs):
                  scratch_vol = {'name': 'cps-scratch1-tmp', 'persistentVolumeClaim': {'claimName': 'cps-scratch1-tmp-v2-pvc'}}
                  scratch_mount = {'name': 'cps-scratch1-tmp', 'mountPath': '/home/jovyan/cps_scratch1'}
                  append_volume_mount(spawner, scratch_vol, scratch_mount)
                  requested_network_mounts.append('scratch1-root')
          elif mount_nfs and (mount_persistent1_shared or mount_scratch_nfs or mount_scratch_recovery_nfs):
              spawner.log.warning(f"Shared network mounts were requested for {spawner.user.name}, but the user is not a power user; skipping")

          if mount_nfs and custom_nfs_enabled:
              if custom_nfs_server and custom_nfs_path and custom_nfs_mount_path:
                  if custom_nfs_path.startswith('/') and custom_nfs_mount_path.startswith('/'):
                      custom_volume_name = sanitize_nfs_volume_name(
                          f"custom-{spawner.user.name}-{custom_nfs_mount_path}"
                      )
                      custom_nfs_vol = {
                          'name': custom_volume_name,
                          'nfs': {
                              'server': custom_nfs_server,
                              'path': custom_nfs_path,
                          },
                      }
                      custom_nfs_mount = {'name': custom_volume_name, 'mountPath': custom_nfs_mount_path}
                      append_volume_mount(spawner, custom_nfs_vol, custom_nfs_mount)
                      requested_network_mounts.append(f"custom:{custom_nfs_server}{custom_nfs_path}")
                  else:
                      spawner.log.warning(
                          f"Custom NFS mount for {spawner.user.name} was rejected because path or mount path is not absolute"
                      )
              else:
                  spawner.log.warning(f"Custom NFS mount requested for {spawner.user.name} but server/path/mount path were incomplete")

          # Set Notebook Dir to User's Folder on NFS
          # spawner.notebook_dir = f"/home/jovyan/cps_persistent1_users/{spawner.user.name}"
          # spawner.default_url = "/lab/tree/cps_persistent1_users/" + spawner.user.name

          # Base image
          spawner.image = cfg['image'] if not custom_image else spawner.image
          # Resources
          spawner.cpu_limit = cfg['cpu_limit']; spawner.cpu_guarantee = cfg['cpu_guarantee']
          spawner.mem_limit = cfg['mem_limit']; spawner.mem_guarantee = cfg['mem_guarantee']
          # RuntimeClass (helps nvidia-smi passthrough with some clusters)
          spawner.extra_pod_config = spawner.extra_pod_config or {}
          if cfg['runtime_class']:
              spawner.extra_pod_config['runtimeClassName'] = cfg['runtime_class']
          
          # UID Override (e.g. for RapidsAI which uses 1001)
          if cfg.get('uid'):
              spawner.uid = cfg['uid']

          # --- SSH sidecar credential (VS Code Remote-SSH support) ---
          # WARNING: this hook runs for EVERY spawn. If `cryptography` and
          # `kubernetes_asyncio` are not already present in the JupyterHub hub
          # image's Python environment, this import will raise ImportError on
          # every single spawn attempt for every user (a full outage), not just
          # for SSH users. VERIFIED LIVE? -- if you are reading this and have not
          # confirmed `pip show cryptography` and `pip show kubernetes_asyncio`
          # succeed inside a running hub pod, STOP and verify before deploying
          # this change. See docs/superpowers/specs/2026-08-03-vscode-remote-ssh-design.md.
          import re
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from kubernetes_asyncio import client as k8s_client
          from kubernetes_asyncio.client.rest import ApiException
          from kubespawner.clients import load_config, shared_client

          safe_username = re.sub(r'[^a-z0-9-]', '-', spawner.user.name.lower())[:40]
          safe_server_name = re.sub(r'[^a-z0-9-]', '-', (spawner.name or '').lower())[:40]
          sidecar_secret_name = f"ssh-sidecar-{safe_username}-{safe_server_name or 'default'}"

          priv_key = Ed25519PrivateKey.generate()
          priv_pem = priv_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.OpenSSH,
              encryption_algorithm=serialization.NoEncryption(),
          )
          pub_openssh = priv_key.public_key().public_bytes(
              encoding=serialization.Encoding.OpenSSH,
              format=serialization.PublicFormat.OpenSSH,
          )

          secret_body = k8s_client.V1Secret(
              metadata=k8s_client.V1ObjectMeta(
                  name=sidecar_secret_name,
                  namespace="jupyterhub",
                  labels={"app.kubernetes.io/component": "ssh-sidecar-credential"},
              ),
              string_data={
                  "private_key": priv_pem.decode(),
                  "public_key": pub_openssh.decode(),
              },
              type="Opaque",
          )

          # KubeSpawner instances have no `.api_client`/`.api` attribute of
          # their own (confirmed live against the running hub pod's
          # installed kubespawner: KubeSpawner exposes no api/api_client
          # trait at all) -- kubespawner itself gets its Kubernetes API
          # clients via kubespawner.clients.shared_client(), which reuses
          # the config KubeSpawner already loaded globally at hub startup.
          # A prior version of this code called
          # `k8s_client.CoreV1Api(spawner.api_client)` here, which raised
          # `AttributeError: 'KubeSpawner' object has no attribute
          # 'api_client'` on every single spawn attempt -- confirmed live
          # via `kubectl logs deploy/hub` after this bug reached
          # production. Use the same shared_client() pattern kubespawner
          # itself uses instead. load_config() is idempotent (@lru_cache)
          # and safe to call even if kubespawner already loaded config
          # elsewhere in the process -- call it explicitly here so this
          # code doesn't depend on incidental prior calls having already
          # happened before this hook runs.
          load_config()
          core_api = shared_client("CoreV1Api")
          # The z2jh chart's own "hub" Role (not ours to edit -- Helm
          # re-templates it on every upgrade) grants
          # get/watch/list/create/delete on secrets, but NOT update/patch.
          # `replace_namespaced_secret` needs `update` and was confirmed
          # live to fail with a 403 Forbidden for the hub's own
          # ServiceAccount. Use only the verbs the hub SA actually has:
          # delete (ignore 404 if it didn't exist yet) then create. A
          # concurrent spawn for the same identity racing this same
          # delete+create is handled by retrying once on a 409 from create.
          try:
              await core_api.delete_namespaced_secret(sidecar_secret_name, "jupyterhub")
          except ApiException as e:
              if e.status != 404:
                  raise
          try:
              await core_api.create_namespaced_secret("jupyterhub", secret_body)
          except ApiException as e:
              if e.status == 409:
                  # Lost the create race to a concurrent spawn for the same
                  # identity; delete+create once more to take over cleanly.
                  await core_api.delete_namespaced_secret(sidecar_secret_name, "jupyterhub")
                  await core_api.create_namespaced_secret("jupyterhub", secret_body)
              else:
                  raise

          # REDESIGNED 2026-08-03 (live, mid-incident): originally this ran
          # a separate "ssh-sidecar" container (minimal debian + openssh),
          # sharing only volume mounts with the main "notebook" container.
          # Confirmed live via a real VS Code Remote-SSH session that this
          # left the ssh session with none of the main container's actual
          # software -- no nvidia-smi, no CUDA, no conda/pip environment,
          # no GPU device access at all (K8s grants GPU resources
          # per-container, not per-pod). A sidecar can share the
          # filesystem via matching volumeMounts, but never the image
          # layers or GPU device access of a DIFFERENT container. Fixed by
          # running sshd inside the main container itself instead, via the
          # postStart hook below (same mechanism already used to ensure
          # tmux is present) -- this gets full parity with the Jupyter web
          # terminal for free, and eliminates the separate sidecar image
          # entirely (no more build/push/tag-caching maintenance burden).
          # The public key is passed in via an env var the postStart
          # script writes to ~/.ssh/authorized_keys.
          spawner.environment["SSH_SIDECAR_AUTHORIZED_KEY"] = pub_openssh.decode()
          # --- end SSH sidecar credential ---

          # Command override (e.g. for Dask profile)
          if cfg.get('cmd'):
              spawner.cmd = cfg['cmd']

          # Ensure tmux is present, and (2026-08-03) run a real sshd inside
          # this container itself for VS Code Remote-SSH support -- see
          # the SSH_SIDECAR_AUTHORIZED_KEY comment above for why this
          # replaced a separate sidecar container.
          #
          # CRITICAL (found live 2026-08-03, ~1 minute after first
          # deploying this): postStart hooks are BLOCKING -- the
          # container is killed and restarted if the hook doesn't return
          # (successfully) within the kubelet's hook timeout. This image
          # does not have openssh-server preinstalled, so the first cut
          # of this hook ran `apt-get update && apt-get install -y
          # openssh-server` SYNCHRONOUSLY inside postStart on every single
          # spawn -- confirmed live via `kubectl describe pod` showing
          # repeated `FailedPostStartHook` / `Killing` / `BackOff`
          # (PostStartHookError), i.e. a permanent crashloop for every
          # user, not just an SSH-only degradation. Fixed by moving the
          # entire SSH setup (including the slow apt-get) into a fully
          # detached background subshell, with its stdin/stdout/stderr
          # redirected away from the hook's own pipe -- postStart itself
          # now only does `mkdir` + backgrounding and returns in
          # milliseconds, unconditionally succeeding regardless of how
          # long the background install takes or whether it fails.
          # SSH access simply becomes available a few seconds after the
          # rest of the pod, instead of blocking notebook startup on it.
          # This exact mechanism (setsid + a one-line `sh -c '...' &`
          # script embedded as a shell string) went through several live
          # failed iterations before landing here -- see git history on
          # this block for the full trail (sudo silently failing under a
          # TTY-less setsid session; sshd's own self-daemonizing
          # double-fork silently vanishing when backgrounded with a
          # trailing `&` inside a nested `sh -c` string). The version
          # below was verified end-to-end in an isolated debug pod
          # (real listening sshd process observed via `ps aux`, not just
          # assumed) before being wired into the real spawn path:
          # - the script is written to a real FILE first, not passed as
          #   a nested-quoted inline string, to eliminate an entire class
          #   of shell-quoting ambiguity;
          # - it ends with `exec sshd -D ...` rather than backgrounding
          #   sshd with a trailing `&` -- `exec` replaces the script's
          #   own process image with sshd directly, so sshd BECOMES the
          #   setsid'd session leader instead of being a background child
          #   whose survival depends on job-control semantics that proved
          #   unreliable in this nested context.
          spawner.extra_container_config = spawner.extra_container_config or {}
          _ssh_setup_script = (
              "#!/bin/sh\n"
              "command -v tmux >/dev/null 2>&1 && [ -e /usr/lib/openssh/sftp-server ] || (apt-get update && apt-get install -y tmux openssh-sftp-server || true)\n"
              "command -v sshd >/dev/null 2>&1 || (apt-get update && apt-get install -y openssh-server || true)\n"
              "mkdir -p /home/jovyan/.ssh && chmod 700 /home/jovyan/.ssh\n"
              'printf "%s\\n" "$SSH_SIDECAR_AUTHORIZED_KEY" > /home/jovyan/.ssh/authorized_keys\n'
              "chmod 600 /home/jovyan/.ssh/authorized_keys\n"
              # Owner-only chown (no group): "jovyan:jovyan" confirmed
              # live to fail with "invalid group" in this image (jovyan's
              # primary group isn't literally named "jovyan") -- owner
              # ownership alone is what sshd's StrictModes check needs.
              "chown jovyan /home/jovyan/.ssh /home/jovyan/.ssh/authorized_keys\n"
              # Non-sudo profiles (grant_sudo: False, e.g. cpu-default) run
              # this whole container -- postStart included -- as the plain
              # jovyan user, not root (only grant_sudo: True profiles get
              # spawner.uid = 0). Confirmed live (2026-08-04) that this
              # setup previously ALWAYS failed silently on such profiles:
              # `mkdir /run/sshd` -> Permission denied (root-owned tmpfs),
              # then `ssh-keygen -A`'s default /etc/ssh/ssh_host_*_key
              # location is also root-owned -> silently produced no host
              # keys -> sshd's own fatal "no hostkeys available -- exiting"
              # on every single attempt, meaning SSH into any non-sudo
              # profile never actually worked via this in-container sshd at
              # all (always fell back to the old Terminado bridge, which
              # can't service non-interactive exec commands like
              # `ssh-copy-id` uses). Fixed to not require root anywhere:
              # host key generated into the user's own home directory
              # instead of /etc/ssh, and /run/sshd's mkdir is now best-effort
              # (`|| true`) since this sshd runs fully unprivileged from the
              # start -- there is no root process to privilege-separate
              # FROM, so a missing privsep directory does not stop it from
              # serving connections (verified: the only fatal this setup
              # ever produced was the hostkeys one, never one naming
              # /run/sshd).
              "mkdir -p /run/sshd 2>/dev/null || true\n"
              "mkdir -p /home/jovyan/.ssh/host_keys && chmod 700 /home/jovyan/.ssh/host_keys\n"
              "[ -f /home/jovyan/.ssh/host_keys/ssh_host_ed25519_key ] || ssh-keygen -q -t ed25519 -f /home/jovyan/.ssh/host_keys/ssh_host_ed25519_key -N '' >/dev/null 2>&1\n"
              # "sshd -p 2200" (without .*) does NOT match the actual
              # running cmdline "sshd -D -p 2200" (the -D flag sits
              # between "sshd" and "-p 2200"), confirmed live: this
              # silently failed to kill a still-running prior instance
              # during manual re-testing, causing a bind conflict that
              # masked an unrelated fix for several iterations.
              'pkill -f "sshd.*-p 2200" >/dev/null 2>&1 || true\n'
              # StrictModes=no: confirmed live that /home/jovyan itself is
              # world-writable (drwxrwxrwx) in this image, which makes
              # sshd's default StrictModes check reject key auth
              # ("Auth failed for user jovyan" / Permission denied)
              # regardless of .ssh's own correct permissions -- matches
              # why the original standalone sidecar's sshd_config also
              # had to set this.
              # UsePAM=no: confirmed live (2026-08-04) that PAM's ACCOUNT
              # phase (not the key check itself, which succeeded) rejects
              # jovyan outright -- "Access denied for user jovyan by PAM
              # account configuration" -- in this minimal image's default
              # PAM config, most likely because jovyan's /etc/shadow
              # password field is locked/disabled, which pam_unix's
              # account phase treats as an expired/disabled account
              # regardless of auth method. PasswordAuthentication is
              # already off and AllowUsers already restricts to jovyan
              # only, so PAM adds nothing security-relevant here for this
              # internal-only (never externally exposed) sidecar sshd --
              # simplest fix is to not invoke it at all.
              "exec /usr/sbin/sshd -D -p 2200 -h /home/jovyan/.ssh/host_keys/ssh_host_ed25519_key -o UsePAM=no -o StrictModes=no -o PermitRootLogin=no -o PasswordAuthentication=no -o AllowUsers=jovyan -o PidFile=/tmp/sshd-2200.pid\n"
          )
          _ssh_setup_cmd = (
              "mkdir -p /tmp/ssh-setup-logs && cat > /tmp/ssh-setup.sh << 'SCRIPT_EOF'\n"
              + _ssh_setup_script
              + "SCRIPT_EOF\n"
              "chmod +x /tmp/ssh-setup.sh\n"
              "setsid /tmp/ssh-setup.sh </dev/null >/tmp/ssh-setup-logs/setup.log 2>&1 &"
          )
          spawner.extra_container_config['lifecycle'] = {
              'postStart': {
                  'exec': {
                      'command': ['/bin/sh', '-c', _ssh_setup_cmd]
                  }
              }
          }

          # GPU resources (profile)
          #
          # CRITICAL (found live 2026-07-07, capacity-planning pass for the
          # 30-concurrent-student-session requirement): `gpu-memory` (MPS
          # fractional sharing, set below via 'memory_mib') and
          # `resources.limits."nvidia.com/gpu"` are ALTERNATIVE, non-combinable
          # allocation paths in KAI -- setting both on the same pod is
          # unconditionally rejected by the admission webhook
          # (admission.kai-scheduler.svc) with "cannot request both GPU and
          # GPU memory" (pkg/binder/plugins/gpusharing/gpu-request/gpu_request_validator.go:36-38
          # in NVIDIA/KAI-Scheduler v0.14.6). This file's example templates and
          # docs/troubleshooting.md already documented this rule, but every
          # VRAM-tiered ('memory_mib') profile below was still unconditionally
          # given a `nvidia.com/gpu` resource limit/guarantee too, via this
          # block -- confirmed live: a synthetic pod built from this exact
          # profile shape (gpu:1 limit + gpu-memory annotation) was rejected
          # by the same admission error. This meant EVERY course/MPS-shared
          # 'gpu-*gb' profile spawn attempt failed at admission, unconditionally
          # -- not a capacity or queue-quota problem, a total block regardless
          # of student count. Fixed by excluding memory_mib profiles from the
          # nvidia.com/gpu resource assignment; they rely solely on the
          # 'gpu-memory' annotation set further below.
          spawner.extra_resource_limits = {}
          spawner.extra_resource_guarantees = {}
          if cfg['gpu'] and cfg.get('resource_key'):
              # Only whole-GPU (non-MPS) profiles get an actual nvidia.com/gpu
              # resource limit/guarantee. MPS/'memory_mib' profiles must NOT --
              # see the comment above this block -- they rely solely on the
              # 'gpu-memory' annotation set later in this same block.
              # Everything else below (NVIDIA_VISIBLE_DEVICES, node_selector,
              # the memory_mib annotation/env/mounts) still applies to BOTH
              # kinds of GPU profile, so it stays outside this inner if.
              if not cfg.get('memory_mib'):
                  spawner.extra_resource_limits[cfg['resource_key']] = str(cfg['gpu'])
                  spawner.extra_resource_guarantees[cfg['resource_key']] = str(cfg['gpu'])
              if not getattr(spawner, "environment", None):
                  spawner.environment = {}
              spawner.environment.update({'NVIDIA_VISIBLE_DEVICES':'all','NVIDIA_DRIVER_CAPABILITIES':'compute,utility'})
              spawner.node_selector = dict(getattr(spawner,'node_selector',{}) or {}, **{'accelerator':'nvidia'})

              # Multi-GPU exclusive profiles (whole-device, gpu > 1, no MPS
              # 'memory_mib' fractional sharing) request more than one whole
              # nvidia.com/gpu on a SINGLE pod/node. With 4 workers x 2 GPUs
              # each, free GPUs can legitimately be fragmented 1+1 across two
              # nodes even though the cluster-wide total is sufficient -- KAI
              # then leaves the pod pending while it waits for reclaim/
              # consolidation (or a session to end) to free 2 GPUs on one
              # node. c.Spawner.start_timeout (global, set above to 300s/5m)
              # is nowhere near long enough to wait that out, and its
              # generic-looking timeout kills the pending pod and PodGroup
              # before KAI can resolve it (see docs/troubleshooting.md,
              # "JupyterHub '2x GPU' profile spawn failure", 2026-07-07).
              # KubeSpawner's start_timeout is a per-instance traitlet, so
              # overriding it here in the pre-spawn hook only affects this
              # spawner instance/profile -- single-GPU and MPS-shared
              # profiles keep the fast 5-minute default so genuine failures
              # still surface quickly.
              #
              # UPDATED 2026-07-07: measured live that KAI's reclaim/
              # consolidation defragmentation itself only takes ~30-45s
              # end-to-end (bounded by the real 30s terminationGracePeriodSeconds
              # used by ablator-* batch jobs at the time), or ~9-10s via
              # consolidation's live-relocation path. Per explicit product
              # requirement, ANY spawn attempt (success or failure) must
              # resolve quickly rather than being left long "for safety"
              # against the separate, unbounded case where the requesting
              # queue is already over its own fair share (reclaim/
              # consolidation both refuse to act at all in that case, per
              # docs/gpu-scheduling-architecture.md) -- that case still fails
              # fast rather than hanging for up to 20 minutes.
              #
              # UPDATED 2026-07-07 (later, verification pass): live
              # ablator-* batch jobs were found to actually use
              # terminationGracePeriodSeconds=150, not 30 -- reclaim's bind
              # time is bounded by the victim's real grace period, so on a
              # fully-saturated cluster the eviction alone can take close to
              # 150s. 110s was too tight against that realistic worst case
              # (see docs/troubleshooting.md verification-pass entry).
              # Raised to 200s to give reclaim room to complete against a
              # real 150s-grace-period victim with margin, while still
              # resolving far faster than the original 1200s.
              #
              # UPDATED 2026-07-07 (again): live-tested a SECOND concurrent
              # 2-GPU request against phd-interactive's quota=2 (which only
              # guarantees one such session) with the cluster fully
              # saturated (8/8 GPUs in use) -- it succeeded via reclaim but
              # took ~165s, leaving only ~35s of margin under 200s. Raised
              # to 250s for real margin on concurrent/contended multi-GPU
              # requests, not just the single-request case.
              if cfg['gpu'] > 1 and not cfg.get('memory_mib'):
                  spawner.start_timeout = 250

              # MPS-based memory sharing: for VRAM-tiered profiles (those carrying a
              # 'memory_mib' key), pin the container's MPS memory ceiling and tell
              # KAI Scheduler's bin-packer the same figure via the 'gpu-memory' pod
              # annotation, so scheduling accounting and enforcement stay in sync by
              # construction. Full-GPU profiles (no 'memory_mib') are left alone -
              # they get the whole device as before.
              #
              # CRITICAL (found live, 2026-07-06): CUDA_MPS_PINNED_DEVICE_MEM_LIMIT
              # alone does NOT connect the process to the MPS daemon -- without also
              # setting CUDA_MPS_PIPE_DIRECTORY/CUDA_MPS_LOG_DIRECTORY (and mounting
              # the daemon's actual pipe/log hostPath), CUDA silently falls back to
              # direct GPU access and the memory limit is never enforced at all. A
              # test pod missing this wiring allocated 16x its configured 1GB limit
              # with zero errors; the identical test WITH this wiring correctly
              # failed at ~1GB. See docs/troubleshooting.md for the full incident.
              memory_mib = cfg.get('memory_mib')
              if memory_mib:
                  spawner.environment['CUDA_MPS_PINNED_DEVICE_MEM_LIMIT'] = f"0={memory_mib}M"
                  spawner.environment['CUDA_MPS_PIPE_DIRECTORY'] = '/mps/nvidia.com/gpu/pipe'
                  spawner.environment['CUDA_MPS_LOG_DIRECTORY'] = '/mps/nvidia.com/gpu/log'
                  spawner.extra_annotations = spawner.extra_annotations or {}
                  spawner.extra_annotations.update({'gpu-memory': str(memory_mib)})

                  mps_pipe_volume = {'name': 'mps-pipe', 'hostPath': {'path': '/run/nvidia/mps/nvidia.com/gpu/pipe', 'type': 'DirectoryOrCreate'}}
                  mps_log_volume = {'name': 'mps-log', 'hostPath': {'path': '/run/nvidia/mps/nvidia.com/gpu/log', 'type': 'DirectoryOrCreate'}}
                  mps_pipe_mount = {'name': 'mps-pipe', 'mountPath': '/mps/nvidia.com/gpu/pipe'}
                  mps_log_mount = {'name': 'mps-log', 'mountPath': '/mps/nvidia.com/gpu/log'}
                  if spawner.volumes is None:
                      spawner.volumes = []
                  if spawner.volume_mounts is None:
                      spawner.volume_mounts = []
                  if isinstance(spawner.volumes, list):
                      spawner.volumes.extend([mps_pipe_volume, mps_log_volume])
                  elif isinstance(spawner.volumes, dict):
                      spawner.volumes[mps_pipe_volume['name']] = mps_pipe_volume
                      spawner.volumes[mps_log_volume['name']] = mps_log_volume
                  if isinstance(spawner.volume_mounts, list):
                      spawner.volume_mounts.extend([mps_pipe_mount, mps_log_mount])
                  elif isinstance(spawner.volume_mounts, dict):
                      spawner.volume_mounts[mps_pipe_mount['name']] = mps_pipe_mount
                      spawner.volume_mounts[mps_log_mount['name']] = mps_log_mount

              # Route all GPU profiles (except gpu-slurm, which has gpu=0 and is
              # handled separately below via 'scheduler_name'/'extra_labels') through
              # KAI Scheduler. Student sessions use the existing 'courses' queue with
              # kai-course-high priority; staff/general interactive sessions use the
              # 'phd-interactive' queue with kai-phd-interactive priority.
              spawner.scheduler_name = 'kai-scheduler'
              spawner.extra_labels = spawner.extra_labels or {}
              if cfg.get('student_profile'):
                  spawner.extra_labels.update({'kai.scheduler/queue': 'courses'})
                  spawner.extra_pod_config['priorityClassName'] = 'kai-course-high'
              else:
                  spawner.extra_labels.update({'kai.scheduler/queue': 'phd-interactive'})
                  spawner.extra_pod_config['priorityClassName'] = 'kai-phd-interactive'

          # Custom image (admins only)
          if custom_image:
              is_admin = spawner.user.admin or any(getattr(g,"name",g) == 'jupyter_admin' for g in spawner.user.groups)
              if is_admin:
                  import re
                  if re.fullmatch(r"[A-Za-z0-9._:/\\-]+", custom_image):
                      spawner.image = custom_image
                  else:
                      spawner.log.warning(f"Invalid custom image '{custom_image}', ignoring")
              else:
                  spawner.log.warning(f"Non-admin custom image ignored for {spawner.user.name}")

          # Custom GPU override
          if custom_gpus > 0:
              if not is_power_user(spawner.user):
                  raise Exception("🚫 GPU Access Denied\n\nGPU resources require 'app_jupyterhub_poweruser' or admin.")
              # Choose resource key: respect the selected profile's key if set; else full GPU
              rkey = cfg.get('resource_key', 'nvidia.com/gpu')
              spawner.extra_resource_limits = {rkey: str(custom_gpus)}
              spawner.extra_resource_guarantees = {rkey: str(custom_gpus)}
              if not getattr(spawner, "environment", None):
                  spawner.environment = {}
              spawner.environment.update({'NVIDIA_VISIBLE_DEVICES':'all','NVIDIA_DRIVER_CAPABILITIES':'compute,utility'})
              spawner.node_selector = dict(getattr(spawner,'node_selector',{}) or {}, **{'accelerator':'nvidia'})
              # Same fragmentation risk as the built-in multi-GPU profiles above
              # applies to a power-user's custom_gpus override -- extend the
              # timeout whenever more than one whole GPU is requested this way.
              # See 2026-07-07 updates above: raised to 250s to cover real
              # ablator-* batch jobs' 150s terminationGracePeriodSeconds and
              # concurrent multi-GPU contention with margin, while still
              # resolving far faster than the original 1200s.
              if custom_gpus > 1:
                  spawner.start_timeout = 250

          # Record profile on the server (used by per-profile culler)
          spawner.environment = spawner.environment or {}
          spawner.environment['HUB_PROFILE_SLUG'] = profile_slug
          spawner.environment['HUB_NFS_MOUNTS'] = ','.join(requested_network_mounts) if requested_network_mounts else 'disabled'
          spawner.environment['HUB_STORAGE_MOUNTS'] = ','.join(requested_storage_mounts) if requested_storage_mounts else 'disabled'

          # Scheduler override (e.g. for Slurm)
          if cfg.get('scheduler_name'):
              spawner.scheduler_name = cfg['scheduler_name']
          
          # Extra labels (e.g. for Slurm accounting)
          if cfg.get('extra_labels'):
              spawner.extra_labels.update(cfg['extra_labels'])
              # Dynamic user label for Slurm
              if cfg['scheduler_name'] == 'slurm-bridge-scheduler':
                  spawner.extra_labels.update({"slinky.slurm.net/user": spawner.user.name})

          # Sudo access
          if cfg.get('grant_sudo'):
              spawner.environment['GRANT_SUDO'] = 'yes'
              spawner.extra_container_config = spawner.extra_container_config or {}
              spawner.extra_container_config['securityContext'] = {
                  'allowPrivilegeEscalation': True,
                  'runAsUser': 0,
              }
              # Run as root to configure sudo, then switch to NB_UID
              spawner.uid = 0
              target_uid = cfg.get('uid', 1000)
              spawner.environment['NB_UID'] = str(target_uid)
              spawner.environment['NB_USER'] = 'jovyan'
              spawner.environment['CHOWN_HOME'] = 'yes'
              spawner.environment['CHOWN_HOME_OPTS'] = '' # Non-recursive to avoid RO mount errors

          spawner.log.info(f"Final: image={spawner.image} CPU={spawner.cpu_limit}/{spawner.cpu_guarantee} MEM={spawner.mem_limit}/{spawner.mem_guarantee} RES={spawner.extra_resource_limits}")
      c.KubeSpawner.pre_spawn_hook = apply_profile_settings

    gpu-config: |
      # Base env (profiles may extend)
      c.KubeSpawner.environment = {
          'NVIDIA_VISIBLE_DEVICES': 'all',
          'NVIDIA_DRIVER_CAPABILITIES': 'compute,utility'
      }

singleuser:
  image:
    name: quay.io/jupyter/tensorflow-notebook
    tag: "2025-11-06"
    pullPolicy: Always

  serviceAccountName: dask-sa

  networkPolicy:
    enabled: true
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: jupyterhub-ssh
                app.kubernetes.io/component: ssh
        ports:
          - port: 2200
            protocol: TCP
    egress:
      - ports:
          - port: 443
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                name: kube-system
    egressAllowRules:
      cloudMetadataServer: false
      dnsPortsCloudMetadataServer: true
      dnsPortsKubeSystemNamespace: true
      dnsPortsPrivateIPs: true
      nonPrivateIPs: true
      privateIPs: true

  extraFiles:
    jupyter-server-config:
      mountPath: /etc/jupyter/jupyter_server_config.py
      stringData: |
        # /etc/jupyter/jupyter_server_config.py
        c = get_config()  # noqa

        # ensure extensions are wired – these calls are idempotent if the package is missing
        # NOTE (2026-07-24 incident): c.ServerApp.jpserver_extensions
        # auto-vivifies as a traitlets LazyConfigValue (not a plain dict)
        # on nested attribute access like this -- LazyConfigValue supports
        # neither .setdefault() (the original form here) NOR item
        # assignment (confirmed live: both raise). Either form threw an
        # exception and silently aborted this entire config file's
        # execution partway through, on every profile, since this file
        # was first introduced -- meaning everything below this point
        # (including host_allowlist and, later, the Xpra server_proxy
        # entry) never actually ran. Confirmed live via pod startup logs
        # and by testing both forms directly against the real traitlets
        # library in a running pod. Fixed by assigning a plain dict in
        # one shot instead of trying to mutate the auto-vivified value.
        c.ServerApp.jpserver_extensions = {
            "jupyter_server_proxy": True,
            "jupyter_code_server": True,
            "jupyter_remote_desktop_proxy": True,
        }

        # Optional: always allow proxied hosts (you already do something similar)
        c.ServerProxy = getattr(c, "ServerProxy", {})
        c.ServerProxy["host_allowlist"] = lambda app, host: True

        # Xpra desktop (gpu-desktop-xpra profile). This entry only actually
        # spawns `xpra` when the launcher tile is clicked, so it's harmless
        # in images that don't have xpra installed -- same lazy behavior as
        # jupyter_remote_desktop_proxy already relies on for non-desktop
        # profiles above.
        #
        # --xvfb override (2026-07-24 incident): Xpra's default Xvfb
        # command enables `+extension GLX` -- same root cause as the
        # TurboVNC/Xvnc segfault fixed earlier this session. Xpra's
        # bundled Xvfb-for-Xpra crashed identically here (confirmed live:
        # "Fatal server error" / "Xvfb command has terminated!", crash
        # stack touching libEGL/eglGetError during InitExtensions).
        # GPU acceleration for apps doesn't need Xvfb's own GLX -- it
        # comes from VirtualGL's EGL backend (_vglwrap), independent of
        # this 2D X server's own GLX support, exactly as with the
        # TurboVNC profile. Fixed by disabling GLX in the xvfb command
        # (verified live: Xvfb stays up without it).
        def _xpra_command(port):
            return [
                "xpra", "start", ":100",
                f"--bind-tcp=0.0.0.0:{port}",
                "--html=on",
                "--daemon=no",
                "--exit-with-children=yes",
                "--start-child=/usr/local/bin/start-xpra-desktop.sh",
                "--systemd-run=no",
                "--pulseaudio=no",
                "--xvfb=Xvfb -screen 0 1680x1050x24 -extension GLX "
                "+extension RANDR +extension RENDER +extension Composite "
                "-nolisten tcp -noreset -dpi 96 -auth $XAUTHORITY",
                # NOTE (2026-07-24): --resize-display=no was tried here
                # first, on the theory that xfce4-panel/xfwm4 couldn't
                # handle Xpra's dynamic screen resize -- but a fixed
                # 1680x1050 screen doesn't match the real browser
                # viewport size, leaving a cut-off/blank strip when the
                # viewport is wider (confirmed live). The original
                # panel/window misplacement was more likely caused by
                # the DPI mismatch below, not resizing itself. Reverted
                # to Xpra's default dynamic resize (matches viewport,
                # no cutoff) and kept only the DPI fix.
                #
                # Xvfb otherwise derives DPI from an assumed physical
                # screen size, producing an anisotropic mismatch
                # ("DPI set to 56 x 90 (wanted 96 x 96)", confirmed
                # live) -- causes font/UI scaling problems. -dpi above
                # fixes the X server side; this fixes the Xpra client
                # side to match.
                "--dpi=96",
            ]

        c.ServerProxy["servers"] = {
            "xpra": {
                "command": _xpra_command,
                "timeout": 60,
                "new_browser_tab": True,
                "launcher_entry": {
                    "title": "Desktop (Xpra)",
                },
            }
        }
    dask-dashboard-config:
      mountPath: /home/jovyan/.config/dask/distributed.yaml
      stringData: |
        distributed:
          dashboard:
            link: "/user/{JUPYTERHUB_USER}/proxy/{host}:{port}/status"

  storage:

    capacity: 10Gi
    dynamic:
      storageClass: longhorn-fast
      pvcNameTemplate: "claim-{username}"
      storageAccessModes: ["ReadWriteMany"]
    homeMountPath: /home/jovyan


    extraVolumes:
      dshm:
        name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      ephemeral-work:
        name: ephemeral-work
        emptyDir: {}

      user-docs:
        name: user-docs
        configMap:
          name: jupyterhub-user-docs


    extraVolumeMounts:
      dshm:
        name: dshm
        mountPath: /dev/shm
      ephemeral-work:
        name: ephemeral-work
        mountPath: /home/jovyan/work

      user-docs-warning:
        name: user-docs
        mountPath: /home/jovyan/00_IMPORTANT_STORAGE_WARNING.md
        subPath: 00_IMPORTANT_STORAGE_WARNING.md
        readOnly: true
      user-docs-guide:
        name: user-docs
        mountPath: /home/jovyan/01_CLUSTER_GUIDE.md
        subPath: 01_CLUSTER_GUIDE.md
        readOnly: true


  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 4G
    guarantee: 2G

  # uid: 1000
  # fsGid: 100
  extraEnv:
    NOTEBOOK_ARGS: "--allow-root"
    DASK_KUBERNETES__OPERATOR__NAMESPACE: "dask-compute"

scheduling:
  # Disabled 2026-07-06: this chart's built-in user-scheduler is a
  # relabeled kube-scheduler whose only purpose is bin-packing pods onto
  # the most-utilized node for cloud autoscaling (see
  # https://z2jh.jupyter.org/en/stable/administrator/optimization.html --
  # "Only activate the user scheduler if you have an autoscaling node
  # pool"). We don't autoscale nodes, and running it alongside
  # kai-scheduler caused a real incident: a live user session
  # (jupyter-gottam) was scheduled by userScheduler instead of
  # kai-scheduler and was not subject to KAI's GPU reservation/priority
  # accounting at all, double-booking a physical GPU that KAI had already
  # allocated to a batch job on the same node (see
  # docs/troubleshooting.md). Two independently-active schedulers with
  # overlapping placement targets is a known unstable pattern (same class
  # of bug as jupyterhub/zero-to-jupyterhub-k8s#1592). KAI's own
  # priority/queue system already provides the scheduling intelligence
  # this cluster needs; disable userScheduler entirely rather than rely on
  # every current and future profile remembering to set scheduler_name.
  userScheduler:
    enabled: false
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: false

# Global idle culler (built-in JupyterHub culler)
cull:
  enabled: true
  timeout: 172800 # 2 days idle timeout #3600     # 1h idle timeout
  every: 600        # check every 10 min
  maxAge: 0         # Disable max age limit
  users: false
  adminUsers: false
  removeNamedServers: false
  concurrency: 10

prePuller:
  continuous:
    enabled: true
  extraImages:
