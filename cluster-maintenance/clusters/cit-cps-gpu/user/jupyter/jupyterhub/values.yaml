                  'nofail',
              ],
              'kind': 'pvc',
              'default_checked': True,
              'power_user_only': False,
          },
          {
              'key': 'persistent1_shared',
              'label': 'Project share',
              'description': 'Shared NFS workspace for team notebooks and datasets.',
              'volume_name': 'cps-persistent1-shared',
              'claim_name': 'cps-persistent1-shared-pvc',
              'mount_path': '/home/jovyan/cps_persistent1_shared',
              'mount_options': [
                  'nfsvers=4.2',
                  'proto=tcp',
                  'hard',
                  'timeo=150',
                  'retrans=3',
