            .cpu-chip {{ border-color:#bae6fd; background:#e0f2fe; color:#075985; }}
            .ram-chip {{ border-color:#c7f9cc; background:#ecfccb; color:#166534; }}
            .default-chip {{ border-color:#fde68a; background:#fffbeb; color:#92400e; }}
            .input, .select {{
