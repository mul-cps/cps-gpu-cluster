          assert hashlib.sha256(raw).hexdigest()=='783186708551217d436aca9a4934136be2e5dfe2dc5bd8929a5fe095f30f1c87',
          'Immutable settings bytes differ'; p=Path('/kai-hub-private/config'); p.mkdir(mode=0o700,exist_ok=True);
          dfd=os.open(p,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW); s=os.fstat(dfd);
          assert stat.S_ISDIR(s.st_mode) and s.st_uid==os.geteuid() and stat.S_IMODE(s.st_mode)
          in (0o700,0o2700); os.fchmod(dfd,0o700); fd=os.open('settings.json',os.O_WRONLY|os.O_CREAT|os.O_NOFOLLOW,0o600,dir_fd=dfd);
          s=os.fstat(fd); assert stat.S_ISREG(s.st_mode) and s.st_uid==os.geteuid()
          and s.st_nlink==1 and stat.S_IMODE(s.st_mode)==0o600; os.ftruncate(fd,0);
          stream=os.fdopen(fd,'wb'); stream.write(raw); stream.flush(); os.fsync(stream.fileno());
          stream.close(); os.fsync(dfd); os.close(dfd)
