apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include the storage PVCs, PostgreSQL, and namespace
resources:
  # - namespace.yaml
  # - storage-class.yaml
  - shared-pvc.yaml
  - cps-scratch1-tmp.yaml
  - cps-scratch1-recovery.yaml
  - cps-persistent1-users.yaml
  - postgresql.yaml
  - harica-ca-configmap.yaml
  - user-docs-configmap.yaml

  - dask-rbac.yaml

  # SOPS-encrypted secrets (decrypted in-cluster by the shared
  # sops-secrets-operator) — see docs/sops-secrets-migration.md
  - postgres-sopssecret.yaml
  - ldap-sopssecret.yaml
  - proxy-sopssecret.yaml
  - oauth-sopssecret.yaml

# Ensure all resources are in the jupyterhub namespace
namespace: jupyterhub
