apiVersion: v1
kind: ServiceAccount
metadata:
  name: dask-sa
  namespace: jupyterhub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dask-admin
  namespace: dask-compute
rules:
  - apiGroups: ["kubernetes.dask.org"]
    resources:
      - daskclusters
      - daskworkergroups
      - daskworkergroups/scale
      - daskjobs
      - daskautoscalers
    verbs: ["get", "list", "watch", "patch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dask-admin-binding
  namespace: dask-compute
subjects:
  - kind: ServiceAccount
    name: dask-sa
    namespace: jupyterhub
roleRef:
  kind: Role
  name: dask-admin
  apiGroup: rbac.authorization.k8s.io
