hubUrl: http://proxy-public.jupyterhub.svc.cluster.local
ssh:
  enabled: true
  service:
    type: ClusterIP
  # SSH_GATEWAY_TOKEN: admin-scoped JupyterHub API token used by
  # validate_public_key (patch-configmap.yaml) to start/locate a user's
  # server during SSH public-key auth, where there's no per-request user
  # token the way there is for password/token auth. Same Secret/value is
  # also injected into the hub pod (../jupyterhub/values.yaml
  # hub.extraEnv) to register this as a JupyterHub service — see
  # ssh-gateway-sopssecret.yaml.
  extraEnv:
    - name: SSH_GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: jupyterhub-ssh-gateway-token
          key: admin-api-token
# The separate standalone jupyterhub-sftp component (port 2222, shared
# storage) was removed 2026-08-04: the default ssh gateway (port 22, same
# connection as `ssh`) now has a real SFTP subsystem (RelaySFTPServer, see
# chart/templates/patch-configmap.yaml) that relays into each user's own
# notebook pod via the sidecar -- giving access to the user's actual
# personal home directory rather than shared storage, over the same
# key/token auth as ssh. That single method replaces this one.
