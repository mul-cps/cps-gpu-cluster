    class RelaySFTPServer(asyncssh.SFTPServer):
        """
        Proxies the SFTP subsystem into the pod's ssh-sidecar's own real
        sftp-server, instead of asyncssh's local-filesystem default.

        Confirmed live (2026-08-03) that asyncssh's server-side SFTP
        subsystem handling is entirely separate from the generic
        session_requested() callback used for shell/exec:
        SSHServerStreamSession.subsystem_requested('sftp') returns
        bool(sftp_factory) -- with no sftp_factory configured, the
        subsystem request is rejected outright before our relay code
        ever runs (client sees "subsystem request failed on channel
        0"), and even WITH an sftp_factory, session_started() routes
        sftp requests through asyncssh's own SFTPServer machinery, not
        the session_factory callback. This class plugs into that
        machinery instead of fighting it, delegating every operation to
        a real asyncssh.SFTPClient opened against the sidecar -- since
        that's a genuine remote SFTP client (not the Contents API), full
        random-access read/write is supported natively, unlike the
        whole-file-only approach considered and rejected in
        docs/sftp-via-contents-api-scoping.md.
        """

        def __init__(self, chan):
            super().__init__(chan)
            self._owner = chan.get_connection()._owner
            self._sftp_client = None

        async def _client(self):
            if self._sftp_client is None:
                conn = await self._owner._get_sidecar_connection()
                self._sftp_client = await conn.start_sftp_client()
            return self._sftp_client

        async def open(self, path, pflags, attrs):
            client = await self._client()
            return await client.open(path, pflags, attrs)

        async def close(self, file_obj):
            await file_obj.close()

        async def read(self, file_obj, offset, size):
            return await file_obj.read(size, offset)

        async def write(self, file_obj, offset, data):
            return await file_obj.write(data, offset)

        async def fstat(self, file_obj):
            return await file_obj.stat()

        async def fsetstat(self, file_obj, attrs):
            return await file_obj.setstat(attrs)

        async def stat(self, path):
            return await (await self._client()).stat(path)

        async def lstat(self, path):
            return await (await self._client()).lstat(path)

        async def setstat(self, path, attrs):
            return await (await self._client()).setstat(path, attrs)

        async def listdir(self, path):
            return await (await self._client()).listdir(path)

        async def remove(self, path):
            return await (await self._client()).remove(path)

        async def rename(self, oldpath, newpath):
            return await (await self._client()).rename(oldpath, newpath)

        async def posix_rename(self, oldpath, newpath):
            return await (await self._client()).posix_rename(oldpath, newpath)

        async def mkdir(self, path, attrs):
            return await (await self._client()).mkdir(path, attrs)

        async def rmdir(self, path):
            return await (await self._client()).rmdir(path)

        async def realpath(self, path):
            return await (await self._client()).realpath(path)

        async def readlink(self, path):
            return await (await self._client()).readlink(path)

        async def symlink(self, oldpath, newpath):
            return await (await self._client()).symlink(oldpath, newpath)

        async def statvfs(self, path):
            return await (await self._client()).statvfs(path)


    class NotebookSSHServer(asyncssh.SSHServer):
        """
        A single SSH connection mapping to a notebook server on a JupyterHub
        """

        def __init__(self, app, *args, **kwargs):
            self.app = app
            self.user_ip = None
            super().__init__(*args, **kwargs)

        def connection_made(self, conn):
            """
            Connection has been successfully established
            """
            self._conn = conn

        def password_auth_supported(self):
            return True

        def connection_requested(self, dest_host, dest_port, orig_host, orig_port):
            self.app.log.info(f"Connection requested: dest={dest_host}:{dest_port}, user_ip={self.user_ip}")
            if dest_host in ["localhost", "127.0.0.1"] and self.user_ip:
                dest_host = self.user_ip
                self.app.log.info(f"Rewrote dest to {dest_host}")
            else:
                self.app.log.info(f"Did NOT rewrite dest. dest_host={dest_host}, user_ip={self.user_ip}")
            
            async def handler(stdin, stdout):
                try:
                    reader, writer = await asyncio.open_connection(dest_host, dest_port)
                except OSError as e:
                    raise asyncssh.ChannelOpenError(
                        asyncssh.OPEN_CONNECT_FAILED, str(e)) from e

                async def forward(r, w):
                    try:
                        while not r.at_eof():
                            data = await r.read(8192)
                            if not data:
                                break
                            w.write(data)
                            await w.drain()
                    except Exception:
                        pass
                    finally:
                        w.close()

                # SSH -> Target
                t1 = asyncio.create_task(forward(stdin, writer))
                # Target -> SSH
                t2 = asyncio.create_task(forward(reader, stdout))
                
                await asyncio.wait([t1, t2], return_when=asyncio.FIRST_COMPLETED)
            
            return handler

        async def get_user_server_url(self, session, username):
            """
            Return user's server url if it is running.

            Else return None
            """
            sepChar = "+"
            serverName = ""
            if sepChar in username:
                usernameWithServer = username.split(sepChar, 1)
                username = usernameWithServer[0]
                serverName = usernameWithServer[1]
            async with session.get(self.app.hub_url / "hub/api/users" / username) as resp:
                if resp.status != 200:
                    return None
                user = await resp.json()
                
                # Resolving which server to check
                target_server_name = serverName if serverName else ""
                server = user.get("servers", {}).get(target_server_name, {})
                
                if server.get("ready", False):
                    # server.get("ip") is confirmed live (2026-08-03) to
                    # never be present at all in this Hub's server model.
                    # state.dns_name (e.g.
                    # "jupyter-<user>.jupyterhub.svc.cluster.local") is
                    # present but ALSO confirmed live to not actually
                    # resolve -- this KubeSpawner config doesn't create a
                    # per-pod Service, so that DNS name has no backing
                    # record (gaierror: Name or service not known).
                    # Passing None/an unresolvable host to
                    # asyncssh.connect() was causing every ssh-sidecar
                    # connection attempt to fail -- this affected both
                    # this feature's sidecar relay AND the pre-existing
                    # connection_requested() port-forwarding rewrite,
                    # which has the exact same self.user_ip dependency and
                    # was very likely equally broken already. The only
                    # reliable source of the pod's real address is the
                    # Kubernetes API itself -- fetch it directly using the
                    # gateway's own in-cluster credentials (RBAC already
                    # grants `pods: get`).
                    state = server.get("state", {})
                    pod_ip = None
                    if state.get("pod_name") and state.get("namespace"):
                        pod_ip = await self._get_pod_ip(
                            state["namespace"], state["pod_name"]
                        )
                    self.user_ip = pod_ip or state.get("dns_name") or server.get("ip")
                    return self.app.hub_url / server["url"][1:]
                else:
                    return None

        async def start_user_server(self, session, username):
            """ """
            # REST API reference:       https://jupyterhub.readthedocs.io/en/stable/_static/rest-api/index.html#operation--users--name--server-post
            # REST API implementation:  https://github.com/jupyterhub/jupyterhub/blob/187fe911edce06eb067f736eaf4cc9ea52e69e08/jupyterhub/apihandlers/users.py#L451-L497
            sepChar = "+"
            serverName = ""
            if sepChar in username:
                usernameWithServer = username.split(sepChar, 1)
                username = usernameWithServer[0]
                serverName = usernameWithServer[1]
            
            if serverName:
                create_url = self.app.hub_url / "hub/api/users" / username / "servers" / serverName
            else:
                create_url = self.app.hub_url / "hub/api/users" / username / "server"

            async with session.post(create_url) as resp:
                if resp.status == 201 or resp.status == 400:
                    # FIXME: code 400 can mean "pending stop" or "already running",
                    #        but we assume it means that the server is already
                    #        running.

                    # Server started quickly
                    # We manually generate this, even though it's *bad*
                    # Mostly because when the server is already running, JupyterHub
                    # doesn't respond with the whole model!
                    if serverName:
                        return self.app.hub_url / "user" / username / serverName
                    return self.app.hub_url / "user" / username
                elif resp.status == 202:
                    # Server start has been requested, now and potentially earlier,
                    # but hasn't started quickly and is pending spawn.
                    # We check for a while, reporting progress to user - until we're
                    # done
                    try:
                        async with timeout(self.app.start_timeout):
                            notebook_url = None
                            self._conn.send_auth_banner("Starting your server...")
                            while notebook_url is None:
                                # FIXME: Exponential backoff + make this configurable
                                await asyncio.sleep(0.5)
                                if serverName:
                                    notebook_url = await self.get_user_server_url(
                                        session, username + "+" + serverName
                                    )
                                else:
                                    notebook_url = await self.get_user_server_url(
                                        session, username
                                    )
                                self._conn.send_auth_banner(".")
                            self._conn.send_auth_banner("done!\n")
                            return notebook_url
                    except asyncio.TimeoutError:
                        # Server didn't start on time!
                        self._conn.send_auth_banner("failed to start server on time!\n")
                        return None
                elif resp.status == 403:
                    # Token is wrong!
                    return None
                else:
                    # FIXME: Handle other cases that pop up
                    resp.raise_for_status()

        async def _get_sidecar_connection(self):
            """
            Lazily establish (and cache) an inner asyncssh client connection
            to this session's notebook pod's ssh-sidecar container.
            """
            if getattr(self, "_sidecar_conn", None) is not None:
                return self._sidecar_conn

            import base64
            import re

            sepChar = "+"
            username = self.username
            serverName = ""
            if sepChar in username:
                username, serverName = username.split(sepChar, 1)

            safe_username = re.sub(r'[^a-z0-9-]', '-', username.lower())[:40]
            safe_server_name = re.sub(r'[^a-z0-9-]', '-', serverName.lower())[:40]
            secret_name = f"ssh-sidecar-{safe_username}-{safe_server_name or 'default'}"

            headers = {"Authorization": f"Bearer {self._k8s_token()}"}
            url = f"https://kubernetes.default.svc/api/v1/namespaces/jupyterhub/secrets/{secret_name}"
            async with ClientSession(headers=headers) as session:
                async with session.get(url, ssl=self._k8s_ssl_context()) as resp:
                    resp.raise_for_status()
                    secret = await resp.json()
            private_key_pem = base64.b64decode(secret["data"]["private_key"]).decode()

            # Agent forwarding: `asyncssh.listen(..., agent_forwarding=True)` in
            # start_server() makes asyncssh automatically create a local
            # UNIX-socket agent listener (bridged back to the real client's
            # forwarded agent) whenever the client requests forwarding (e.g.
            # `ssh -A`) -- this happens transparently at the channel/session
            # level before session_requested()'s handler ever runs, so
            # self._conn.get_agent_path() is already populated here if the
            # client asked for it. Passing that same path as `agent_path` (and
            # `agent_forwarding=True`) on this OUTBOUND connection to the
            # sidecar makes every asyncssh.SSHClientConnection.create_process()
            # call on it automatically send its own `auth-agent-req@openssh.com`
            # to the sidecar (verified against installed asyncssh==2.24.0
            # source: SSHClientConnection.create_session() derives its
            # per-session agent_forwarding flag as
            # `bool(self._agent_forward_path)`, itself set from the
            # `agent_path`/`agent_forwarding` connect() options -- there is no
            # per-call `agent_forwarding` kwarg on create_process()/
            # create_session() in this version, confirmed via
            # inspect.signature()). If the client didn't request forwarding,
            # get_agent_path() returns None and we simply don't forward,
            # matching normal ssh-agent-forwarding semantics.
            agent_path = self._conn.get_agent_path()

            self._sidecar_conn = await asyncssh.connect(
                self.user_ip,
                port=2200,
                username="jovyan",
                client_keys=[asyncssh.import_private_key(private_key_pem)],
                known_hosts=None,
                agent_path=agent_path,
                agent_forwarding=bool(agent_path),
            )
            return self._sidecar_conn

        def _k8s_token(self):
            with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                return f.read().strip()

        def _k8s_ssl_context(self):
            import ssl
            ctx = ssl.create_default_context(
                cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            )
            return ctx

        async def _get_pod_ip(self, namespace, pod_name):
            """
            Look up a pod's real IP directly via the Kubernetes API.
            Returns None (never raises) if the lookup fails for any
            reason -- callers fall back to other address sources.
            """
            url = (
                f"https://kubernetes.default.svc/api/v1/namespaces/"
                f"{namespace}/pods/{pod_name}"
            )
            headers = {"Authorization": f"Bearer {self._k8s_token()}"}
            try:
                async with ClientSession(headers=headers) as session:
                    async with session.get(url, ssl=self._k8s_ssl_context()) as resp:
                        if resp.status != 200:
                            return None
                        pod = await resp.json()
                        return pod.get("status", {}).get("podIP")
            except Exception:
                return None

        async def validate_password(self, username, token):
            self.username = username
            self.token = token

            headers = {"Authorization": f"token {token}"}
            async with ClientSession(headers=headers) as session:
                notebook_url = await self.start_user_server(session, username)
                if notebook_url is None:
                    return False
                else:
                    self.notebook_url = notebook_url
                    # start_user_server()'s fast path (server already
                    # running, Hub API returns 201/400) returns a
                    # manually-constructed URL without ever calling
                    # get_user_server_url() -- confirmed live (2026-08-03)
                    # that self.user_ip therefore stayed None for the
                    # overwhelmingly common case of connecting to an
                    # already-running server (only the slow-spawn 202
                    # polling path happened to call it). Since the fix
                    # to resolve self.user_ip from state.dns_name lives
                    # inside get_user_server_url(), explicitly call it
                    # here too so self.user_ip is reliably populated
                    # before any session/channel request needs it,
                    # regardless of which start_user_server() path ran.
                    if self.user_ip is None:
                        await self.get_user_server_url(session, username)
                    return True

        async def _handle_ws_recv(self, stdout, data_packet):
            """
            Handle receiving a single data message from terminado.
            """
            kind, data = data_packet
            if kind == "setup":
                # Signals we can get going now!
                return
            elif kind == "change":
                # Sets terminal size, but let's ignore this for now
                return
            elif kind == "disconnect":
                # Not exactly sure what to do here?
                return
            elif kind != "stdout":
                raise ValueError(f"Unknown type {data[0]} received from terminado")
            stdout.write(data)
            await stdout.drain()

        async def _handle_stdin(self, stdin, terminado):
            """
            Handle receiving a single byte from stdin

            We aren't buffering anything rn, but maybe we should?
            """
            while not stdin.at_eof():
                try:
                    # Return *upto* 4096 bytes from the stdin buffer
                    # Returns pretty immediately - doesn't *wait* for 4096 bytes
                    # to be present in the buffer.
                    data = await stdin.read(4096)
                    await terminado.send_stdin(data)
                except asyncssh.misc.TerminalSizeChanged as e:
                    await terminado.set_size(e.height, e.width)
                except asyncssh.misc.BreakReceived:
                    pass

        async def _handle_client(self, stdin, stdout, stderr):
            """
            Handle data transfer once session has been fully established.
            """
            async with ClientSession() as client, Terminado(
                self.notebook_url, self.token, client
            ) as terminado:

                # If a pty has been asked for, we tell terminado what the pty's current size is
                # Otherwise, terminado uses default size of 80x22
                channel = stdin.channel
                if channel.get_terminal_type():
                    rows, cols = channel.get_terminal_size()[:2]
                    await terminado.set_size(rows, rows)

                # We run two tasks concurrently
                #
                # terminado's stdout -> ssh stdout
                # ssh stdin -> terminado's stdin
                #
                # Terminado doesn't seem to separate out stderr, so we leave it alone
                #
                # When either of these tasks exit, we want to:
                # 1. Clean up the other task
                # 2. (Ideally) close the terminal opened by terminado on the notebook server
                # 3. Close the ssh connection
                #
                # We don't do all of these yet in a way that I can be satisfied with.

                # Pipe stdout from terminado to ssh
                ws_to_stdout = asyncio.create_task(
                    terminado.on_receive(partial(self._handle_ws_recv, stdout))
                )
                #
                # Pipe stdin from ssh to terminado
                stdin_to_ws = asyncio.create_task(self._handle_stdin(stdin, terminado))

                tasks = [ws_to_stdout, stdin_to_ws]

                # Wait for either pipe to be done
                done, pending = await asyncio.wait(
                    tasks, return_when=asyncio.FIRST_COMPLETED
                )

                # At least one of the pipes is done.
                # Close the ssh connection explicitly
                self._conn.close()

                # Explicitly cancel the other tasks currently pending
                # FIXME: I don't know if this actually does anything?
                for t in pending:
                    t.cancel()

        async def _relay_session(self, stdin, stdout, stderr):
            """
            Relay this SSH session's stdio into an equivalent session opened
            against the pod's ssh-sidecar, preserving PTY/exec/subsystem
            semantics transparently.
            """
            sidecar_conn = await self._get_sidecar_connection()
            channel = stdin.channel

            term_type = channel.get_terminal_type()
            command = channel.get_command()
            subsystem = channel.get_subsystem()

            kwargs = {}
            if term_type:
                kwargs["term_type"] = term_type
                kwargs["term_size"] = channel.get_terminal_size()

            if subsystem:
                inner_process = await sidecar_conn.create_process(subsystem=subsystem, **kwargs)
            elif command:
                inner_process = await sidecar_conn.create_process(command, **kwargs)
            else:
                inner_process = await sidecar_conn.create_process(**kwargs)

            async def pump(reader, writer):
                try:
                    while True:
                        data = await reader.read(65536)
                        if not data:
                            break
                        writer.write(data)
                        await writer.drain()
                except Exception:
                    pass
                finally:
                    try:
                        writer.close()
                    except Exception:
                        pass

            tasks = [
                asyncio.create_task(pump(stdin, inner_process.stdin)),
                asyncio.create_task(pump(inner_process.stdout, stdout)),
                asyncio.create_task(pump(inner_process.stderr, stderr)),
            ]
            await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
            self._conn.close()
            for t in tasks:
                t.cancel()

        async def _session_with_fallback(self, stdin, stdout, stderr):
            """
            Prefer relaying into the pod's ssh-sidecar, but fall back to the
            old Terminado-bridging path (_handle_client) when the sidecar is
            unavailable -- e.g. a pod that was already running before this
            sidecar/secret machinery was deployed, so it has neither the
            sidecar container nor the ssh-sidecar-* Secret yet. Without this
            fallback, every already-running notebook pod would lose SSH
            access outright on merge/deploy until the user manually restarted
            their server.
            """
            try:
                await self._get_sidecar_connection()
            except Exception as e:
                self.app.log.warning(
                    f"ssh-sidecar unavailable for {getattr(self, 'username', '?')} "
                    f"({e!r}); falling back to Terminado bridge"
                )
                return await self._handle_client(stdin, stdout, stderr)
            return await self._relay_session(stdin, stdout, stderr)

        def session_requested(self):
            # Returning a plain callable here would make asyncssh build
            # `SSHServerStreamSession(callable, sftp_factory=None, False)`
            # internally (asyncssh.connection._process_session_open,
            # confirmed against 2.7.0 source) -- sftp_factory is hardcoded
            # to None on that path, with no way to inject one. Construct
            # the same session object ourselves instead, so the sftp
            # subsystem gets a real factory (RelaySFTPServer) while
            # shell/exec still go through _session_with_fallback exactly
            # as before. legacy `scp` (invoked as `exec scp -t/-f ...` by
            # the scp CLI) doesn't need allow_scp=True here -- it already
            # works transparently through _relay_session's generic exec
            # branch, which relays the command to the sidecar's own real
            # scp binary.
            from asyncssh.stream import SSHServerStreamSession
            return SSHServerStreamSession(
                self._session_with_fallback, RelaySFTPServer, False
            )


    class JupyterHubSSH(Application):
        config_file = Unicode(
            "jupyterhub_ssh_config.py",
            help="""
            Config file to load JupyterHub SSH config from
            """,
            config=True,
            valid=True,
        )

        port = Integer(
            8022,
            help="""
            Port the ssh server listens on
            """,
            config=True,
        )

        debug = Bool(
            True,
            help="""
            Turn on debugg logging
            """,
            config=True,
        )

        hub_url = Any(
            "",
            help="""
            URL of JupyterHub's proxy to connect to.

            jupyterhub-ssh needs to be able to connect to both the JupyterHub API
            (/hub/api) and to the users' servers (/user/<username>) via HTTP or
            HTTPS. This URL doesn't have to be the public URL though as the URL is
            only be used by jupyterhub-ssh itself.

            *Must* be set.

            Examples:

            - If jupyterhub-ssh is deployed in the same Kubernetes cluster and
              namespace as the official JupyterHub Helm chart, you can use
              `http://proxy-public` or `http://proxy-http:8000` depending on
              how the JupyterHub Helm chart is configured. Use
              `http://proxy-http:8000` if the JupyterHub Helm chart has been
              configured with both `proxy.https.enabled=true` and
              `proxy.https.type=letsencrypt`, otherwise use `http://proxy-public`.

            - If jupyterhub-ssh can't access JupyterHub's proxy via local network or
              you don't trust the local network to be secure, use a public URL with
              HTTPS such as `https://my-hub-url.com`.
            """,
            config=True,
        )

        @validate("hub_url")
        def _hub_url_cast_string_to_yarl_url(self, proposal):
            if isinstance(proposal.value, str):
                return URL(proposal.value)
            elif isinstance(proposal.value, URL):
                return proposal.value
            else:
                raise ValueError("hub_url must either be a string or a yarl.URL")

        host_key_path = Unicode(
            "",
            help="""
            Path to host's private SSH Key.

            *Must* be set.
            """,
            config=True,
        )

        start_timeout = Integer(
            30,
            help="""
            Timeout in seconds to wait for a server to start before before closing
            the SSH connection.
            """,
            config=True,
        )

        def init_logging(self):
            """
            Make traitlets & asyncssh logging work properly

            self.log is managed by traitlets, while the logger named
            asyncssh is managed by asyncssh. We want the debug flag to
            control debug logs everywhere, so we wire 'em together here.

            """
            self.log.setLevel(logging.DEBUG if self.debug else logging.INFO)
            # This propagates traitlet logs to root logger - somehow,
            # no logs were coming out otherwise
            self.log.propagate = True

            asyncssh_logger = logging.getLogger("asyncssh")
            asyncssh_logger.propagate = True
            asyncssh_logger.parent = self.log
            asyncssh_logger.setLevel(self.log.level)

        def initialize(self, *args, **kwargs):
            super().initialize(*args, **kwargs)
            self.load_config_file(self.config_file)
            self.init_logging()

        async def start_server(self):
            await asyncssh.listen(
                host="",
                port=self.port,
                server_factory=partial(NotebookSSHServer, self),
                line_editor=False,
                password_auth=True,
                server_host_keys=[self.host_key_path],
                agent_forwarding=True,
                # NOTE: sftp_factory is intentionally NOT set here. Setting
                # it at this (listener) level flips asyncssh's internal
                # dispatch (SSHServerConnection._process_session_open) to
                # bypass session_requested() ENTIRELY for every channel
                # type, not just sftp -- confirmed against asyncssh 2.7.0
                # source before deploying this, since it would have
                # silently broken shell/exec too. Instead,
                # session_requested() below constructs the equivalent
                # SSHServerStreamSession itself, per-connection, wiring in
                # RelaySFTPServer only for that one session.
                keepalive_interval=30,  # FIXME: Make this configurable
            )


    def main():
        app = JupyterHubSSH()
        app.initialize()
        loop = asyncio.get_event_loop()
        loop.run_until_complete(app.start_server())
        loop.run_forever()
