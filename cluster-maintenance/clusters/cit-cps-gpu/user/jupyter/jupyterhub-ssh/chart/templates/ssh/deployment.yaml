{{- if .Values.ssh.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jupyterhub-ssh.ssh.fullname" . }}
  labels:
    {{- include "jupyterhub-ssh.ssh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ssh.replicaCount }}
  selector:
    matchLabels:
      {{- include "jupyterhub-ssh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jupyterhub-ssh.ssh.labels" . | nindent 8 }}
        {{- with .Values.ssh.podLabels }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ omit .Values "sftp" | toYaml | sha256sum }}
        # The patched __init__.py is mounted with subPath, which Kubernetes
        # never live-updates on ConfigMap changes -- and checksum/config
        # above only hashes .Values, not this template's own rendered
        # content, so an edit to patch-configmap.yaml alone previously
        # never triggered a pod restart at all (confirmed live, 2026-08-04:
        # multiple __init__.py logic changes silently never took effect
        # until manually `kubectl rollout restart`ed). Hash the actual
        # rendered ConfigMap content too so any change to it forces a
        # rollout on its own.
        checksum/patch-configmap: {{ include (print $.Template.BasePath "/patch-configmap.yaml") . | sha256sum }}
        {{- with .Values.ssh.podAnnotations }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: jupyterhub-ssh
      # We don't need any interaction with k8s API
      automountServiceAccountToken: true 
      volumes:
        - name: config
          secret:
            secretName: {{ include "jupyterhub-ssh.fullname" . }}
        - name: patch
          configMap:
            name: {{ include "jupyterhub-ssh.fullname" . }}-patch
      containers:
        - name: server
          image: "{{ .Values.ssh.image.repository }}:{{ .Values.ssh.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ssh.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/jupyterhub-ssh/config
              readOnly: true
            - name: patch
              mountPath: /srv/jupyterhub-ssh/jupyterhub_ssh/__init__.py
              subPath: __init__.py
              readOnly: true
          ports:
            - name: ssh
              containerPort: 8022
              protocol: TCP
          {{- with .Values.ssh.extraEnv }}
          env:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          # NOTE (2026-07-06): a "sftp" containerPort: 2222 entry was
          # removed here -- it does not exist in the upstream chart
          # (github.com/yuvipanda/jupyterhub-ssh) and this pod's patched
          # code (../patch-configmap.yaml) only implements plain
          # SSH-to-terminal forwarding via Terminado, with zero SFTP
          # subsystem code. Confirmed live: nothing listens on 2222 in
          # this pod (`nc -zv <pod-ip> 2222` -> connection refused). Real
          # SFTP is served by the separate jupyterhub-sftp Deployment (a
          # standalone OpenSSH server), routed externally via
          # ingress-nginx's tcp.2222 entry pointing at THAT service, not
          # this one. See docs/troubleshooting.md.
          resources:
            {{- .Values.ssh.resources | toYaml | nindent 12 }}
      {{- with .Values.ssh.imagePullSecrets }}
      imagePullSecrets:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.ssh.nodeSelector }}
      nodeSelector:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.ssh.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.ssh.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
{{- end }}
