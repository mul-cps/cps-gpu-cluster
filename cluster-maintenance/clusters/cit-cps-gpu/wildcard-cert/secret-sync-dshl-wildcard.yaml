apiVersion: v1
kind: ServiceAccount
metadata:
  name: dshl-wildcard-sync
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dshl-wildcard-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["dshl-wildcard"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dshl-wildcard-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dshl-wildcard-sync
subjects:
  - kind: ServiceAccount
    name: dshl-wildcard-sync
    namespace: cert-manager
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dshl-wildcard-sync
  namespace: cert-manager
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: dshl-wildcard-sync
    spec:
      serviceAccountName: dshl-wildcard-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              for ns in jupyterhub ingress-nginx cattle-system; do
                kubectl get secret dshl-wildcard -n cert-manager -o json \
                  | jq 'del(.metadata | .namespace,.creationTimestamp,.resourceVersion,.uid,.selfLink,.managedFields,.annotations,.ownerReferences)' \
                  | kubectl apply -n "$ns" -f -
              done
          env:
            - name: KUBECTL_PLUGINS_DISABLE_FLAG
              value: "1"
