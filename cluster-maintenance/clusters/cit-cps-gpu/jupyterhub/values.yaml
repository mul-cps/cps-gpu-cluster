proxy:
  secretToken: "GENERATE_WITH_openssl_rand_-hex_32"
  service:
    type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - jupyterhub.cps.unileoben.ac.at
    - jupyterhub.dshl.unileoben.ac.at
  tls:
    - secretName: wildcard-cps-cert
      hosts: [jupyterhub.cps.unileoben.ac.at]
    - secretName: dshl-wildcard
      hosts: [jupyterhub.dshl.unileoben.ac.at]

hub:
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: oauthenticator.generic.GenericOAuthenticator
      allow_named_servers: true
      named_server_limit_per_user: 3
      db_url: postgresql://jhub:jhub-secure-db-password-2025@postgresql:5432/jhub
      template_vars:
        org:
          name: "Montanuniversität Leoben"
          logo_url: "https://www.unileoben.ac.at/fileadmin/shares/allgemeine_datenbank/logos/1-mul-logo/2-mul-logo-smoke-quer.svg"
          url: "https://www.unileoben.ac.at"
    GenericOAuthenticator:
      # TODO: REMOVE THIS WORKAROUND - disables TLS verification for self-signed Authentik certs
      tls_verify: false
      client_id: "vUhzKqEF0UxPtZNM8aRbA1ncaehhIAIA2x9r83FI"
      client_secret: "EbAzlZLERPQzmF2EQByhihKuUqp36u138fYERPptymppmJbWhquI4sHu9vchqtnMRqbAVnZS6nOA6G0FescWa13MOLdlegQB3yyZSqe5V32NtYsnfDOndyZHiqiL2Bj6"
      oauth_callback_url: "https://jupyterhub.dshl.unileoben.ac.at/hub/oauth_callback"
      authorize_url: "https://auth.cps.unileoben.ac.at/application/o/authorize/"
      token_url: "https://auth.cps.unileoben.ac.at/application/o/token/"
      userdata_url: "https://auth.cps.unileoben.ac.at/application/o/userinfo/"
      login_service: "CPS Authentik"
      username_claim: "preferred_username"
      scope: ["openid","profile","email","groups"]
      claim_groups_key: "groups"
      manage_groups: true
      admin_groups: ["jupyter_admin"]
      # Allow all users authenticated by Authentik
      allow_all: true

  db:
    pvc:
      storageClassName: longhorn
      storage: 10Gi


  extraVolumes:
    - name: ca-bundle
      emptyDir: {}
    - name: harica-ca
      configMap:
        name: harica-ca
        items:
          - key: harica-root
            path: harica-root.pem
          - key: geant-intermediate
            path: geant-intermediate.pem

  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /ca-bundle
    - name: harica-ca
      mountPath: /harica

  extraConfig:
    00-install-packages: |
      import subprocess, sys
      try:
          import oauthenticator
      except ImportError:
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'oauthenticator'])

    01-custom-templates: |
      # Custom template functionality disabled to avoid ConfigMap conflicts
      # Templates are managed separately if needed

    02-profiles: |
      # ---------- Access logic ----------
      # Groups that have full access (GPU + Shared Storage)
      # Groups that have full access (GPU + Shared Storage)
      POWER_USER_GROUPS = {'app_jupyterhub_poweruser', 'jupyter_admin'}

      def is_power_user(user):
          user_groups = {getattr(g, "name", g) for g in user.groups}
          return bool(user.admin) or bool(user_groups & POWER_USER_GROUPS)

      # ---------- Dynamic UI Generation ----------
      def get_options_form(spawner):
          power_user = is_power_user(spawner.user)
          # We need PROFILE_CONFIGS here, but it is defined later.
          # In Python script execution order, functions are defined but not executed until called.
          # So as long as PROFILE_CONFIGS is defined before get_options_form is CALLED, it's fine.
          
          allowed_profiles = get_profile_list(spawner)
          
          # Helper to render a card
          def render_card(slug, cfg, selected=False):
              gpu = cfg.get('gpu', 0)
              cpu = cfg.get('cpu_limit', 0)
              mem = cfg.get('mem_limit', '0G')
              
              chips = []
              if gpu > 0:
                  chips.append(f'<span class="chip gpu-chip">{gpu}× GPU</span>')
              elif 'mig' in slug:
                   chips.append(f'<span class="chip gpu-chip">MIG</span>')
              
              chips.append(f'<span class="chip cpu-chip">{int(cpu)} vCPU</span>')
              chips.append(f'<span class="chip ram-chip">{mem}</span>')
              
              cls = "card selected" if selected else "card"
              checked = "checked" if selected else ""
              
              return f"""
              <label class="{cls}" data-slug="{slug}">
                <input type="radio" name="profile" value="{slug}" {checked}>
                <div class="row">
                  <div class="name">{cfg['display_name']}</div>
                  <div class="meta">{''.join(chips)}</div>
                </div>
              </label>
              """

          # Generate Grid
          cards_html = []
          for p in allowed_profiles:
              slug = p['slug']
              cfg = PROFILE_CONFIGS[slug]
              is_default = cfg.get('default', False)
              cards_html.append(render_card(slug, cfg, selected=is_default))
          
          grid_html = "\n".join(cards_html)
          
          # Custom Image Section (Only for power users)
          custom_image_html = ""
          if power_user:
              custom_image_html = """
              <div class="layer">
                <div class="row" style="align-items:flex-start; gap:16px; flex-wrap: wrap;">
                  <div style="flex:1; min-width: 260px;">
                    <div class="name" style="margin-bottom:6px;">Optional: Custom Image</div>
                    <input class="input" type="text" id="custom-image" name="custom_image" placeholder="registry/repo:tag (admins only)" />
                    <div class="hint">Overrides the profile image.</div>
                  </div>
                  <div class="select-inline">
                    <div class="name" style="margin-bottom:6px;">GPUs</div>
                    <select class="select" id="custom-gpus" name="custom_gpus">
                      <option value="0" selected>0 × GPU</option>
                      <option value="1">1 × GPU</option>
                      <option value="2">2 × GPU</option>
                    </select>
                    <div class="hint">Requires GPU access.</div>
                  </div>
                </div>
              </div>
              """

          # Debug Info
          user_groups = sorted([getattr(g, "name", str(g)) for g in spawner.user.groups])
          debug_html = f"""
          <details style="margin-top: 20px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px;">
            <summary style="padding: 10px; cursor: pointer; font-family: sans-serif; font-size: 13px; color: #555;">Debug Info</summary>
            <div style="padding: 10px; border-top: 1px solid #eee; font-family: monospace; font-size: 12px; color: #333;">
              User: {spawner.user.name}<br>
              Admin: {spawner.user.admin}<br>
              Groups: {user_groups}<br>
              Power User: {power_user}<br>
              Allowed Profiles: {[p['slug'] for p in allowed_profiles]}
            </div>
          </details>
          """

          # Full HTML
          return f"""
          <style>
            .hub-ui * {{ box-sizing: border-box; }}
            .hub-ui {{ max-width: 980px; margin: 24px auto; padding: 0 8px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }}
            .ui-title {{ font-size: 20px; font-weight: 600; color: #1f2937; margin-bottom: 6px; }}
            .subtle {{ color: #6b7280; font-size: 13px; margin-bottom: 12px; }}
            .layer {{ background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 1px 1px rgba(0,0,0,.03), 0 8px 20px rgba(17,24,39,.06); padding: 18px; margin-bottom: 16px; }}
            .grid {{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }}
            @media (max-width: 820px) {{ .grid {{ grid-template-columns: 1fr; }} }}
            .card {{ position: relative; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; transition: box-shadow .15s ease, border-color .15s ease, transform .05s ease; background: linear-gradient(180deg, rgba(249,250,251,.6), rgba(255,255,255,1)); }}
            .card:hover {{ box-shadow: 0 8px 22px rgba(17,24,39,.08); border-color:#d1d5db; transform: translateY(-1px); }}
            .card input[type="radio"] {{ position: absolute; inset:0; opacity:0; cursor:pointer; }}
            .card.selected {{ border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }}
            .row {{ display:flex; align-items:center; justify-content:space-between; gap: 10px; }}
            .name {{ font-weight: 600; color:#111827; }}
            .meta {{ display:flex; gap:8px; flex-wrap: wrap; }}
            .chip {{ font-size:12px; border:1px solid #e5e7eb; padding:3px 8px; border-radius:999px; color:#374151; background:#f9fafb; }}
            .gpu-chip {{ border-color:#c7d2fe; background:#eef2ff; color:#4338ca; }}
            .cpu-chip {{ border-color:#bae6fd; background:#e0f2fe; color:#075985; }}
            .ram-chip {{ border-color:#c7f9cc; background:#e8fce9; color:#166534; }}
            .input, .select {{ width:100%; padding:10px 12px; border:1.5px solid #e5e7eb; border-radius:10px; background:white; }}
            .select-inline {{ width:auto; min-width: 160px; }}
            .hint {{ font-size:12px; color:#6b7280; margin-top: 4px; }}
          </style>

          <div class="hub-ui">
            <div class="ui-title">Select a Profile</div>
            <div class="subtle">For longer CLI workloads, use <code>tmux</code>.</div>

            <div class="layer">
              <div class="grid" id="profile-grid">
                {grid_html}
              </div>
            </div>

            {custom_image_html}
            {debug_html}
          </div>

          <script>
          (function(){{
            var cards = document.querySelectorAll('.card');
            function selectCard(el){{ cards.forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); var i = el.querySelector('input[type="radio"]'); if (i) i.checked = true; }}
            cards.forEach(c=>c.addEventListener('click', ()=>selectCard(c)));
          }})();
          </script>
          """

      c.KubeSpawner.options_form = get_options_form

      # ---------- Parse form ----------
      def options_from_form(formdata):
          opts = {}
          opts['profile'] = formdata.get('profile', ['cpu-default'])[0]
          custom_image = formdata.get('custom_image', [''])[0].strip()
          if custom_image:
              opts['custom_image'] = custom_image
          try:
              opts['custom_gpus'] = int(formdata.get('custom_gpus', ['0'])[0])
          except Exception:
              opts['custom_gpus'] = 0
          return opts
      c.Spawner.options_from_form = options_from_form
      c.Spawner.http_timeout = 300
      c.Spawner.start_timeout = 300

      # ---------- Canonical profile configs ----------
      # Define all profiles here. The UI list is generated from this dictionary.
      # To add more profiles, simply add entries to this dictionary or use PROFILE_CONFIGS.update({...}).
      PROFILE_CONFIGS = {
          # CPU default
          'cpu-default': {
              'display_name': 'CPU (Default)',
              'description': '2 vCPU (shared) • 2 GiB',
              'default': True,
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-standard-cpu',
              'cpu_limit': 2.0, 'cpu_guarantee': 0.5,
              'mem_limit': '2G', 'mem_guarantee': '1G',
              'runtime_class': None,
              'gpu': 0,
              'grant_sudo': False,
          },

          # Dask Cluster
          'dask-cluster': {
              'display_name': 'Dask Cluster',
              'description': 'Dask Image • 2 vCPU • 8 GiB',
              'image': 'nvcr.io/nvidia/rapidsai/base:24.08-cuda12.2-py3.10',
              'cpu_limit': 2.0, 'cpu_guarantee': 1.0,
              'mem_limit': '8G', 'mem_guarantee': '4G',
              'runtime_class': None,
              'gpu': 0,
              'uid': 1001, # RapidsAI image uses UID 1001
              'cmd': ['/bin/sh', '-c', 'pip install --no-cache-dir jupyterhub && jupyterhub-singleuser && jupyter-server-proxy'],
              'grant_sudo': True,
          },

          # GPU full devices
          'gpu-pytorch-single': {
              'display_name': 'GPU PyTorch (1×)',
              'description': '1× GPU • 16 vCPU • 64 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-pytorch-code',
              'cpu_limit': 16.0, 'cpu_guarantee': 8.0,
              'mem_limit': '64G', 'mem_guarantee': '32G',
              'gpu': 1,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },
          'gpu-tensorflow-single': {
              'display_name': 'GPU TF (1×)',
              'description': '1× GPU • 16 vCPU • 64 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-tf-code',
              'cpu_limit': 16.0, 'cpu_guarantee': 8.0,
              'mem_limit': '64G', 'mem_guarantee': '32G',
              'gpu': 1,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },

          # GPU dual
          'gpu-pytorch-dual': {
              'display_name': 'GPU PyTorch (2×)',
              'description': '2× GPU • 32 vCPU • 128 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-pytorch-code',
              'cpu_limit': 32.0, 'cpu_guarantee': 16.0,
              'mem_limit': '128G', 'mem_guarantee': '64G',
              'gpu': 2,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },
          'gpu-tensorflow-dual': {
              'display_name': 'GPU TF (2×)',
              'description': '2× GPU • 32 vCPU • 128 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-tf-code',
              'cpu_limit': 32.0, 'cpu_guarantee': 16.0,
              'mem_limit': '128G', 'mem_guarantee': '64G',
              'gpu': 2,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },

          # MIG slices
          'gpu-mig-1g': {
              'display_name': 'GPU MIG 1g.5gb',
              'description': '1× MIG 1g.5gb • 6 vCPU • 24 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-pytorch-code',
              'cpu_limit': 6.0, 'cpu_guarantee': 3.0,
              'mem_limit': '24G', 'mem_guarantee': '12G',
              'gpu': 1,
              'resource_key': 'nvidia.com/mig-1g.5gb',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },
          'gpu-mig-2g': {
              'display_name': 'GPU MIG 2g.10gb',
              'description': '1× MIG 2g.10gb • 10 vCPU • 40 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-pytorch-code',
              'cpu_limit': 10.0, 'cpu_guarantee': 5.0,
              'mem_limit': '40G', 'mem_guarantee': '20G',
              'gpu': 1,
              'resource_key': 'nvidia.com/mig-2g.10gb',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },

          # Desktop + ROS 2
          'gpu-desktop-ros2': {
              'display_name': 'GPU Desktop + ROS 2',
              'description': 'Desktop + ROS 2 image • 1× GPU • 16 vCPU • 64 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-desktop-ros2',
              'cpu_limit': 16.0, 'cpu_guarantee': 8.0,
              'mem_limit': '64G', 'mem_guarantee': '32G',
              'gpu': 1,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },

          # ComfyUI Profile
          'gpu-comfyui': {
              'display_name': 'ComfyUI (GPU)',
              'description': 'ComfyUI Image • 1× GPU • 16 vCPU • 64 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:main-comfyui',
              'cpu_limit': 16.0, 'cpu_guarantee': 8.0,
              'mem_limit': '64G', 'mem_guarantee': '32G',
              'gpu': 1,
              'resource_key': 'nvidia.com/gpu',
              'runtime_class': 'nvidia',
              'grant_sudo': True,
          },

          # Slurm Profile
          'gpu-slurm': {
              'display_name': 'GPU via Slurm (Slinky)',
              'description': 'Scheduled by Slurm • 8 vCPU • 32 GiB',
              'image': 'ghcr.io/mul-cps/cps-jupyter-notebook:latest-pytorch-code',
              'cpu_limit': 8.0, 'cpu_guarantee': 4.0,
              'mem_limit': '32G', 'mem_guarantee': '16G',
              'gpu': 0, # Slurm handles GPU allocation
              'scheduler_name': 'slurm-bridge-scheduler',
              'extra_labels': {
                  'slinky.slurm.net/account': 'cps',
                  'slinky.slurm.net/partition': 'gpu',
              },
              'runtime_class': None,
              'grant_sudo': True,
          },
      }

      # ---------- Generate profile list ----------
      c.KubeSpawner.image_pull_policy = 'Always'
      
      def get_profile_list(spawner):
          # Filter profiles based on user groups
          power_user = is_power_user(spawner.user)
          
          profiles = []
          for slug, cfg in PROFILE_CONFIGS.items():
              # If not power user, skip GPU profiles and advanced profiles
              if not power_user:
                  if cfg.get('gpu', 0) > 0:
                      continue
                  if slug in {'dask-cluster', 'gpu-slurm'}:
                      continue
              
              profiles.append({
                  'display_name': cfg['display_name'],
                  'slug': slug,
                  'description': cfg.get('description', ''),
                  'default': cfg.get('default', False),
              })
          return profiles

      c.KubeSpawner.profile_list = get_profile_list

      # ---------- Apply profile & per-profile knobs ----------
      async def apply_profile_settings(spawner):
          profile_slug = spawner.user_options.get('profile', 'cpu-default')
          custom_image = spawner.user_options.get('custom_image', '').strip()
          custom_gpus = int(spawner.user_options.get('custom_gpus', 0) or 0)
          cfg = PROFILE_CONFIGS.get(profile_slug, PROFILE_CONFIGS['cpu-default'])
          spawner.log.info(f"{spawner.user.name} -> profile={profile_slug}, custom_image={'set' if custom_image else 'none'}, custom_gpus={custom_gpus}")

          # Base image
          spawner.image = cfg['image'] if not custom_image else spawner.image
          # Resources
          spawner.cpu_limit = cfg['cpu_limit']; spawner.cpu_guarantee = cfg['cpu_guarantee']
          spawner.mem_limit = cfg['mem_limit']; spawner.mem_guarantee = cfg['mem_guarantee']
          # RuntimeClass (helps nvidia-smi passthrough with some clusters)
          spawner.extra_pod_config = spawner.extra_pod_config or {}
          if cfg['runtime_class']:
              spawner.extra_pod_config['runtimeClassName'] = cfg['runtime_class']
          
          # UID Override (e.g. for RapidsAI which uses 1001)
          if cfg.get('uid'):
              spawner.uid = cfg['uid']

          # Command override (e.g. for Dask profile)
          if cfg.get('cmd'):
              spawner.cmd = cfg['cmd']

          # Ensure tmux is present (postStart installs if missing)
          spawner.extra_container_config = spawner.extra_container_config or {}
          spawner.extra_container_config['lifecycle'] = {
              'postStart': {
                  'exec': {
                      'command': [
                          '/bin/sh','-c',
                          'command -v tmux >/dev/null 2>&1 && [ -e /usr/lib/openssh/sftp-server ] || (apt-get update && apt-get install -y tmux openssh-sftp-server || true)'
                      ]
                  }
              }
          }

          # GPU / MIG resources (profile)
          spawner.extra_resource_limits = {}
          spawner.extra_resource_guarantees = {}
          if cfg['gpu'] and cfg.get('resource_key'):
              spawner.extra_resource_limits[cfg['resource_key']] = str(cfg['gpu'])
              spawner.extra_resource_guarantees[cfg['resource_key']] = str(cfg['gpu'])
              if not getattr(spawner, "environment", None):
                  spawner.environment = {}
              spawner.environment.update({'NVIDIA_VISIBLE_DEVICES':'all','NVIDIA_DRIVER_CAPABILITIES':'compute,utility'})
              spawner.node_selector = dict(getattr(spawner,'node_selector',{}) or {}, **{'accelerator':'nvidia'})

          # Custom image (admins only)
          if custom_image:
              is_admin = spawner.user.admin or any(getattr(g,"name",g) == 'jupyter_admin' for g in spawner.user.groups)
              if is_admin:
                  import re
                  if re.fullmatch(r"[A-Za-z0-9._:/\\-]+", custom_image):
                      spawner.image = custom_image
                  else:
                      spawner.log.warning(f"Invalid custom image '{custom_image}', ignoring")
              else:
                  spawner.log.warning(f"Non-admin custom image ignored for {spawner.user.name}")

          # Custom GPU override
          if custom_gpus > 0:
              if not is_power_user(spawner.user):
                  raise Exception("🚫 GPU Access Denied\n\nGPU resources require 'app_jupyterhub_poweruser' or admin.")
              # Choose resource key: respect MIG profiles' key if selected; else full GPU
              rkey = cfg.get('resource_key', 'nvidia.com/gpu')
              spawner.extra_resource_limits = {rkey: str(custom_gpus)}
              spawner.extra_resource_guarantees = {rkey: str(custom_gpus)}
              if not getattr(spawner, "environment", None):
                  spawner.environment = {}
              spawner.environment.update({'NVIDIA_VISIBLE_DEVICES':'all','NVIDIA_DRIVER_CAPABILITIES':'compute,utility'})
              spawner.node_selector = dict(getattr(spawner,'node_selector',{}) or {}, **{'accelerator':'nvidia'})

          # Record profile on the server (used by per-profile culler)
          spawner.environment = spawner.environment or {}
          spawner.environment['HUB_PROFILE_SLUG'] = profile_slug

          # Scheduler override (e.g. for Slurm)
          if cfg.get('scheduler_name'):
              spawner.scheduler_name = cfg['scheduler_name']
          
          # Extra labels (e.g. for Slurm accounting)
          if cfg.get('extra_labels'):
              spawner.extra_labels.update(cfg['extra_labels'])
              # Dynamic user label for Slurm
              if cfg['scheduler_name'] == 'slurm-bridge-scheduler':
                  spawner.extra_labels.update({"slinky.slurm.net/user": spawner.user.name})

          # Sudo access
          if cfg.get('grant_sudo') and is_power_user(spawner.user):
              spawner.environment['GRANT_SUDO'] = 'yes'
              spawner.extra_container_config = spawner.extra_container_config or {}
              spawner.extra_container_config['securityContext'] = {
                  'allowPrivilegeEscalation': True,
                  'runAsUser': 0,
              }
              # Run as root to configure sudo, then switch to NB_UID
              spawner.uid = 0
              target_uid = cfg.get('uid', 1000)
              spawner.environment['NB_UID'] = str(target_uid)
              spawner.environment['NB_USER'] = 'jovyan'
              spawner.environment['CHOWN_HOME'] = 'yes'
              spawner.environment['CHOWN_HOME_OPTS'] = '' # Non-recursive to avoid RO mount errors

          # Shared Storage for Power Users
          if is_power_user(spawner.user):
             # Handle volumes
             new_volumes = [
                 {'name': 'shared', 'persistentVolumeClaim': {'claimName': 'jupyterhub-shared-storage'}},
                 {'name': 'cps-persistent1-shared', 'persistentVolumeClaim': {'claimName': 'cps-persistent1-shared-pvc'}},
             ]
             if spawner.volumes is None:
                 spawner.volumes = []
             
             if isinstance(spawner.volumes, list):
                 spawner.volumes.extend(new_volumes)
             elif isinstance(spawner.volumes, dict):
                 for v in new_volumes:
                     spawner.volumes[v['name']] = v
             
             # Handle volume_mounts
             new_mounts = [
                 {'name': 'shared', 'mountPath': '/home/jovyan/shared'},
                 {'name': 'cps-persistent1-shared', 'mountPath': '/home/jovyan/cps_persistent1_shared'},
             ]
             if spawner.volume_mounts is None:
                 spawner.volume_mounts = []
             
             if isinstance(spawner.volume_mounts, list):
                 spawner.volume_mounts.extend(new_mounts)
             elif isinstance(spawner.volume_mounts, dict):
                 # Fallback if it is a dict (unlikely for mounts but safe to handle)
                 for m in new_mounts:
                     spawner.volume_mounts[m['name']] = m

             # Increase storage capacity for power users
             spawner.storage_capacity = '100Gi'

          spawner.log.info(f"Final: image={spawner.image} CPU={spawner.cpu_limit}/{spawner.cpu_guarantee} MEM={spawner.mem_limit}/{spawner.mem_guarantee} RES={spawner.extra_resource_limits}")
      c.KubeSpawner.pre_spawn_hook = apply_profile_settings

    gpu-config: |
      # Base env (profiles may extend)
      c.KubeSpawner.environment = {
          'NVIDIA_VISIBLE_DEVICES': 'all',
          'NVIDIA_DRIVER_CAPABILITIES': 'compute,utility'
      }

singleuser:
  image:
    name: quay.io/jupyter/tensorflow-notebook
    tag: "2025-11-06"
    pullPolicy: Always

  serviceAccountName: dask-sa

  networkPolicy:
    enabled: true
    ingress: []
    egress:
      - ports:
          - port: 443
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                name: kube-system
    egressAllowRules:
      cloudMetadataServer: false
      dnsPortsCloudMetadataServer: true
      dnsPortsKubeSystemNamespace: true
      dnsPortsPrivateIPs: true
      nonPrivateIPs: true
      privateIPs: true

  extraFiles:
    jupyter-server-config:
      mountPath: /etc/jupyter/jupyter_server_config.py
      stringData: |
        # /etc/jupyter/jupyter_server_config.py
        c = get_config()  # noqa

        # ensure extensions are wired – these calls are idempotent if the package is missing
        c.ServerApp.jpserver_extensions = getattr(c.ServerApp, "jpserver_extensions", {})

        for ext in [
            "jupyter_server_proxy",
            "jupyter_code_server",
            "jupyter_remote_desktop_proxy",
        ]:
            c.ServerApp.jpserver_extensions.setdefault(ext, True)

        # Optional: always allow proxied hosts (you already do something similar)
        c.ServerProxy = getattr(c, "ServerProxy", {})
        c.ServerProxy["host_allowlist"] = lambda app, host: True
    dask-dashboard-config:
      mountPath: /home/jovyan/.config/dask/distributed.yaml
      stringData: |
        distributed:
          dashboard:
            link: "/user/{JUPYTERHUB_USER}/proxy/{host}:{port}/status"

  storage:

    capacity: 10Gi
    dynamic:
      storageClass: longhorn-fast
    homeMountPath: /home/jovyan


    extraVolumes:
      - name: ephemeral-work
        emptyDir: {}

      - name: user-docs
        configMap:
          name: jupyterhub-user-docs


    extraVolumeMounts:
      - name: ephemeral-work
        mountPath: /home/jovyan/work

      - name: user-docs
        mountPath: /home/jovyan/00_IMPORTANT_STORAGE_WARNING.md
        subPath: 00_IMPORTANT_STORAGE_WARNING.md
        readOnly: true
      - name: user-docs
        mountPath: /home/jovyan/01_CLUSTER_GUIDE.md
        subPath: 01_CLUSTER_GUIDE.md
        readOnly: true


  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 4G
    guarantee: 2G

  uid: 1000
  fsGid: 100
  extraEnv:
    NOTEBOOK_ARGS: "--allow-root"
    DASK_KUBERNETES__OPERATOR__NAMESPACE: "dask-compute"

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: false

# Global idle culler (built-in JupyterHub culler)
cull:
  enabled: true
  timeout: 3600     # 1h idle timeout
  every: 600        # check every 10 min
  maxAge: 43200     # 12h max age (12*60*60 = 43200 seconds)
  users: false
  adminUsers: true
  removeNamedServers: false
  concurrency: 10

prePuller:
  continuous:
    enabled: true
  extraImages:
    datascience:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-standard-cpu"
    rapidsai:
      name: nvcr.io/nvidia/rapidsai/base
      tag: "24.08-cuda12.2-py3.10"
    cps-pytorch:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-pytorch-code"
    cps-tf:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-tf-code"
    cps-desktop-ros2:
      name: ghcr.io/mul-cps/cps-jupyter-notebook
      tag: "latest-desktop-ros2"
