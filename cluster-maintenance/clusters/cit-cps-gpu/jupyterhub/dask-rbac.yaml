apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dask-admin
  namespace: jupyterhub
rules:
  - apiGroups: ["kubernetes.dask.org"]
    resources:
      - daskclusters
      - daskworkergroups
      - daskjobs
      - daskautoscalers
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dask-admin-binding
  namespace: jupyterhub
subjects:
  - kind: ServiceAccount
    name: default
    namespace: jupyterhub
roleRef:
  kind: Role
  name: dask-admin
  apiGroup: rbac.authorization.k8s.io
