apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include the storage PVCs, PostgreSQL, and namespace
resources:
  # - namespace.yaml
  - storage-class.yaml
  - shared-pvc.yaml
  - nfs_mounts/cps-scratch1-tmp.yaml
  - nfs_mounts/cps-persistent1-users.yaml
  - postgresql.yaml
  - harica-ca-configmap.yaml
  - user-docs-configmap.yaml

  - dask-rbac.yaml
  - templates/

# Ensure all resources are in the jupyterhub namespace
namespace: jupyterhub
