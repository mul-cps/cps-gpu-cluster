defaultNamespace: openwebui
name: open-webui
helm:
  releaseName: open-webui
  repo: https://helm.openwebui.com/
  chart: open-webui
  createNamespace: true
  valuesFiles:
    - values.yaml

dependsOn:
  - selector:
      matchLabels:
        name: ollama

targetCustomizations:
- name: cit-cps-gpu
  clusterSelector:
    matchLabels:
      name: cit-cps-gpu
  patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: open-webui
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: openwebui-oidc
