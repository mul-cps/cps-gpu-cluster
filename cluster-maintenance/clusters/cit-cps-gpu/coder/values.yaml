                }
      
                env {
                  name  = "NB_USER"
                  value = "jovyan"
                }
      
                resources {
                  requests = {
                    cpu                     = "3"
                    memory                  = "12Gi"
                    "nvidia.com/mig-1g.5gb" = "1"
                  }
                  limits = {
                    cpu                     = "6"
                    memory                  = "24Gi"
                    "nvidia.com/mig-1g.5gb" = "1"
                  }
                }
      
