coder:
  # Coder environment variables
  # See: https://coder.com/docs/admin/configure
  # Use cluster access URL for workspace connection
  envUseClusterAccessURL: true

  env:
    # Database connection
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    
    # Access URL - primary domain for Coder
    - name: CODER_ACCESS_URL
      value: "https://coder.dshl.unileoben.ac.at"
    
    # Internal access URL for workspace pods (cluster-internal service)
    - name: CODER_ACCESS_URL_INTERNAL
      value: "http://coder.coder.svc.cluster.local"
    
    # OIDC Authentication with Authentik
    - name: CODER_OIDC_ISSUER_URL
      value: "https://auth.cps.unileoben.ac.at/application/o/coder/"
    
    - name: CODER_OIDC_CLIENT_ID
      value: "lDBqyH9xujZ1WC1PCPPxiqIWg5o0FAX83UmQshsB"
    
    - name: CODER_OIDC_CLIENT_SECRET
      value: "vRA9Z4ueEymKFxxQn3wHplxLRabUm0CFXHShJmEpmSjaXxhsdVwto2Q5m1RF7Bu2nyUULUIVEQhJM3Ix6xZdUqwnhnWz0geSgThZdPYKoxbAY8RhTEQ8JPyOVDh34wpt"
    
    # Email domain for OIDC
    - name: CODER_OIDC_EMAIL_DOMAIN
      value: "unileoben.ac.at"
    
    # OIDC scopes - request groups for authorization
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email"
    
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: "Log in with authentik"
    
    - name: CODER_OIDC_ICON_URL
      value: "https://auth.cps.unileoben.ac.at/static/dist/assets/icons/icon.png"
    
    # Group claim field from OIDC token
    - name: CODER_OIDC_GROUPS_FIELD
      value: "groups"
    
    # Username claim
    - name: CODER_OIDC_USERNAME_FIELD
      value: "preferred_username"
    
    # Disable TLS verification for self-signed Authentik certs
    # TODO: REMOVE THIS WORKAROUND - use proper CA bundle
    - name: CODER_TLS_CLIENT_AUTH
      value: "none"
    
    # Disable built-in authentication (OIDC only)
    - name: CODER_DISABLE_PASSWORD_AUTH
      value: "false"  # Set to "true" after OIDC is verified
    
    # Wildcard access URL for workspace subdomains
    - name: CODER_WILDCARD_ACCESS_URL
      value: "*.coder.dshl.unileoben.ac.at"
    
    # Telemetry (disable for privacy)
    - name: CODER_TELEMETRY_ENABLE
      value: "false"
    
    # Logging
    - name: CODER_LOG_HUMAN
      value: "/dev/stderr"
    
    # Prometheus metrics
    - name: CODER_PROMETHEUS_ENABLE
      value: "true"
    - name: CODER_PROMETHEUS_ADDRESS
      value: "0.0.0.0:2112"

  # Replica count for Coder deployment
  replicaCount: 1

  # Image configuration
  image:
    repo: "ghcr.io/coder/coder"
    tag: "v2.29.1"
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    sessionAffinity: ClientIP

  # Ingress configuration
  ingress:
    enable: true
    className: "nginx"
    host: "coder.dshl.unileoben.ac.at"
    wildcardHost: "*.coder.dshl.unileoben.ac.at"
    tls:
      enable: true
      secretName: dshl-wildcard
      wildcardSecretName: dshl-wildcard
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      # WebSocket support
      nginx.ingress.kubernetes.io/websocket-services: "coder"

  # Resources for Coder pods
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Service account
  serviceAccount:
    create: true
    name: "coder"
    annotations: {}

  # Pod annotations
  podAnnotations: {}

  # Pod labels
  podLabels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: server

  # Affinity rules
  affinity: {}

  # Tolerations
  tolerations: []

  # Node selector
  nodeSelector: {}





extraTemplates:
  - name: cpu-default
    content: |
      terraform {
        required_providers {
          coder = {
            source = "coder/coder"
          }
          kubernetes = {
            source = "hashicorp/kubernetes"
          }
        }
      }
      
      provider "coder" {}
      
      variable "namespace" {
        type        = string
        description = "The Kubernetes namespace for workspaces"
        default     = "coder"
      }
      
      variable "use_kubeconfig" {
        type        = bool
        description = "Use kubeconfig for authentication (false when Coder runs in-cluster)"
        default     = false
      }
      
      provider "kubernetes" {
        config_path = var.use_kubeconfig ? "~/.kube/config" : null
      }
      
      data "coder_workspace" "me" {}
      data "coder_workspace_owner" "me" {}
      
      resource "coder_agent" "main" {
        os             = "linux"
        arch           = "amd64"
        startup_script = <<-EOT
          #!/bin/bash
          set -e
          
          # Install code-server
          curl -fsSL https://code-server.dev/install.sh | sh -s -- --method=standalone --prefix=/tmp/code-server
          
          # Start code-server
          /tmp/code-server/bin/code-server --auth none --port 13337 >/tmp/code-server.log 2>&1 &
        EOT
      
        metadata {
          display_name = "CPU Usage"
          key          = "cpu_usage"
          script       = "coder stat cpu"
          interval     = 10
          timeout      = 1
        }
      
        metadata {
          display_name = "RAM Usage"
          key          = "ram_usage"
          script       = "coder stat mem"
          interval     = 10
          timeout      = 1
        }
      
        metadata {
          display_name = "Home Disk"
          key          = "home_disk"
          script       = "coder stat disk --path $HOME"
          interval     = 60
          timeout      = 1
        }
      }
      
      resource "coder_app" "code-server" {
        agent_id     = coder_agent.main.id
        slug         = "code-server"
        display_name = "VS Code"
        icon         = "/icon/code.svg"
        url          = "http://localhost:13337?folder=/home/coder"
        subdomain    = false
        share        = "owner"
      
        healthcheck {
          url       = "http://localhost:13337/healthz"
          interval  = 3
          threshold = 10
        }
      }
      
      # Persistent home directory
      resource "kubernetes_persistent_volume_claim" "home" {
        metadata {
          name      = "coder-$${data.coder_workspace.me.id}-home"
          namespace = var.namespace
          labels = {
            "app.kubernetes.io/name"     = "coder-pvc"
            "app.kubernetes.io/instance" = "coder-pvc-$${data.coder_workspace.me.id}"
            "com.coder.resource"         = "true"
            "com.coder.workspace.id"     = data.coder_workspace.me.id
            "com.coder.workspace.name"   = data.coder_workspace.me.name
            "com.coder.user.id"          = data.coder_workspace_owner.me.id
            "com.coder.user.username"    = data.coder_workspace_owner.me.name
          }
        }
        wait_until_bound = false
        spec {
          access_modes       = ["ReadWriteOnce"]
          storage_class_name = "longhorn-fast"
          resources {
            requests = {
              storage = "10Gi"
            }
          }
        }
      }
      
      # Workspace deployment
      resource "kubernetes_deployment" "main" {
        count            = data.coder_workspace.me.start_count
        wait_for_rollout = false
        
        metadata {
          name      = "coder-$${data.coder_workspace.me.id}"
          namespace = var.namespace
          labels = {
            "app.kubernetes.io/name"     = "coder-workspace"
            "app.kubernetes.io/instance" = "coder-workspace-$${data.coder_workspace.me.id}"
            "com.coder.resource"         = "true"
            "com.coder.workspace.id"     = data.coder_workspace.me.id
            "com.coder.workspace.name"   = data.coder_workspace.me.name
            "com.coder.user.id"          = data.coder_workspace_owner.me.id
            "com.coder.user.username"    = data.coder_workspace_owner.me.name
          }
        }
      
        spec {
          replicas = 1
          
          selector {
            match_labels = {
              "app.kubernetes.io/name"     = "coder-workspace"
              "app.kubernetes.io/instance" = "coder-workspace-$${data.coder_workspace.me.id}"
            }
          }
      
          strategy {
            type = "Recreate"
          }
      
          template {
            metadata {
              labels = {
                "app.kubernetes.io/name"     = "coder-workspace"
                "app.kubernetes.io/instance" = "coder-workspace-$${data.coder_workspace.me.id}"
                "com.coder.resource"         = "true"
                "com.coder.workspace.id"     = data.coder_workspace.me.id
                "com.coder.workspace.name"   = data.coder_workspace.me.name
                "com.coder.user.id"          = data.coder_workspace_owner.me.id
                "com.coder.user.username"    = data.coder_workspace_owner.me.name
              }
            }
      
            spec {
              security_context {
                run_as_user = 1000
                fs_group    = 1000
              }
      
              container {
                name              = "dev"
                image             = "ghcr.io/mul-cps/cps-jupyter-notebook:latest-standard-cpu"
                image_pull_policy = "Always"
                command           = ["sh", "-c", coder_agent.main.init_script]
                
                security_context {
                  run_as_user = 1000
                }
      
                env {
                  name  = "CODER_AGENT_TOKEN"
                  value = coder_agent.main.token
                }
      
                resources {
                  requests = {
                    cpu    = "500m"
                    memory = "1Gi"
                  }
                  limits = {
                    cpu    = "2"
                    memory = "2Gi"
                  }
                }
      
                # Home directory
                volume_mount {
                  mount_path = "/home/coder"
                  name       = "home"
                }
      
                # Shared storage
                volume_mount {
                  mount_path = "/home/coder/shared"
                  name       = "shared"
                }
      
                # CPS persistent storage
                volume_mount {
                  mount_path = "/home/coder/cps_persistent1_shared"
                  name       = "cps-persistent1-shared"
                }
              }
      
              # Volumes
              volume {
                name = "home"
                persistent_volume_claim {
                  claim_name = kubernetes_persistent_volume_claim.home.metadata[0].name
                }
              }
      
              volume {
                name = "shared"
                persistent_volume_claim {
                  claim_name = "coder-shared-storage"
                }
              }
      
              volume {
                name = "cps-persistent1-shared"
                persistent_volume_claim {
                  claim_name = "cps-persistent1-shared-pvc"
                }
              }
            }
          }
        }
      }
  - name: desktop-ros2
    content: |
      terraform {
        required_providers {
          coder = {
            source = "coder/coder"
          }
          kubernetes = {
