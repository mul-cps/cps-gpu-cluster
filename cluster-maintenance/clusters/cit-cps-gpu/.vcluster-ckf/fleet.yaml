defaultNamespace: vcluster-ckf
name: vcluster-ckf

helm:
  repo: https://charts.loft.sh
  chart: vcluster
  releaseName: vcluster-ckf
  version: "0.28.0"
  valuesFiles:
    - values-vcluster.yaml

# Applies the raw manifests in kustomization.yaml (juju-toolbox pod + RBAC)
# on top of the rendered Helm chart. See kustomization.yaml's comment for
# why this was added 2026-07-06 -- these were never actually deployed
# before.
kustomize:
  dir: .

# Dependencies or other fleet config
dependsOn: []

# Ensure we have the namespace
targetCustomizations:
  - name: local
    clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: local
    helm:
      valuesFiles:
        - values-vcluster.yaml
