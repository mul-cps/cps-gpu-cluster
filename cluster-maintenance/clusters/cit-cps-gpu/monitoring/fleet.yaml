# Fleet configuration for NVIDIA monitoring add-ons (dashboards, alerts only)
name: nvidia-monitoring-addons

defaultNamespace: cattle-monitoring-system

# Apply only the NVIDIA-specific manifests; monitoring stack is installed manually
kustomize:
  dir: .

# Target only clusters with the gpu-monitoring label
targets:
  - name: cit-cps-gpu
    clusterSelector:
      matchLabels:
        name: cit-cps-gpu
