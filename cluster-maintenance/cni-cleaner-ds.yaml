apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-cleaner
  namespace: default
  labels:
    app: cni-cleaner
spec:
  selector:
    matchLabels:
      app: cni-cleaner
  template:
    metadata:
      labels:
        app: cni-cleaner
    spec:
      serviceAccountName: cni-cleaner
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: cleaner
        image: alpine:edge
        command: ["/bin/sh", "-c", "apk add --no-cache bash curl && /bin/bash /scripts/analyze_and_clean_cni.sh"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SLEEP_INTERVAL
          value: "600"
        securityContext:
          privileged: true
        volumeMounts:
        - name: cni-dir
          mountPath: /host-cni
        - name: cni-conf-dir
          mountPath: /host-cni-conf
        - name: var-log
          mountPath: /host-log
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: cni-dir
        hostPath:
          path: /var/lib/cni
          type: Directory
      - name: cni-conf-dir
        hostPath:
          path: /var/lib/rancher/k3s/agent/etc/cni/net.d
          type: DirectoryOrCreate
      - name: var-log
        hostPath:
          path: /var/log
          type: Directory
      - name: scripts
        configMap:
          name: cni-cleaner-script
          defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-cleaner-script
  namespace: default
data:
  analyze_and_clean_cni.sh: |
    #!/bin/bash
    set -e
    
    # Configuration
    CNI_PATH="/host-cni/networks/cbr0"
    VALID_IPS_FILE="/tmp/valid_ips.txt"
    SLEEP_INTERVAL=${SLEEP_INTERVAL:-600}
    
    # Install dependencies
    apk add --no-cache curl bash
    
    # Install kubectl
    if ! command -v kubectl &> /dev/null; then
        echo "Installing kubectl..."
        curl -L "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
        chmod +x /usr/local/bin/kubectl
    fi
    
    # Determine CNI Path
    if [ ! -d "$CNI_PATH" ]; then
        if [ -d "/host-cni/networks/cni0" ]; then
            CNI_PATH="/host-cni/networks/cni0"
        else
            echo "CNI network directory not found at $CNI_PATH or /host-cni/networks/cni0"
            echo "Sleeping..."
            sleep "$SLEEP_INTERVAL"
            exit 0 
        fi
    fi
    
    while true; do
        echo "------------------------------------------------"
        echo "Starting CNI cleanup cycle at $(date)"
        
        if [ -z "$NODE_NAME" ]; then
            echo "NODE_NAME environment variable not set."
            exit 1
        fi
    
        echo "Fetching valid IPs for node $NODE_NAME..."
        > "$VALID_IPS_FILE"
        
        # Fetch IPs
        kubectl get pods --all-namespaces --field-selector spec.nodeName="$NODE_NAME" -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}' > "$VALID_IPS_FILE"
        
        # Validation
        if [ ! -s "$VALID_IPS_FILE" ]; then
             if ! kubectl get node "$NODE_NAME" &>/dev/null; then
                 echo "Error: Cannot contact K8s API. Skipping cleanup."
                 sleep "$SLEEP_INTERVAL"
                 continue
             else
                 echo "No pods with IPs found. Proceeding."
             fi
        fi
        
        allocated_ips=$(ls -1 "$CNI_PATH" | grep -vE "lock|last_reserved_ip")
        leaked_count=0
        
        for ip in $allocated_ips; do
            if ! grep -q "^$ip$" "$VALID_IPS_FILE"; then
                echo "Removing leaked IP: $ip"
                rm -f "$CNI_PATH/$ip"
                leaked_count=$((leaked_count + 1))
            fi
        done
        
        echo "Cycle complete. Removed $leaked_count leaked IPs."
        sleep "$SLEEP_INTERVAL"
    done
