apiVersion: v1
kind: Pod
metadata:
  name: gpu2-nri-hung-cpu
  namespace: gpu-operator
spec:
  nodeName: k3s-wk-gpu2
  restartPolicy: Never
  containers:
  - name: main
    image: busybox:1.37.0
    command:
    - sh
    - -ec
    - echo CPU_WITHOUT_MANDATORY_GPU_PLUGIN_PASSED
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
