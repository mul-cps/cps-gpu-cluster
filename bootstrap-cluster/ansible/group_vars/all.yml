---
# K3s Configuration
k3s_version: v1.34.9+k3s1
k3s_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"

# Cluster settings
cluster_cidr: "10.42.0.0/16"
service_cidr: "10.43.0.0/16"
cluster_dns: "10.43.0.10"
cluster_domain: "cluster.local"

# K3s API VIP (optional - for kube-vip)
api_vip: "10.0.0.100"

# Control plane configuration
control_plane_taint: "node-role.kubernetes.io/control-plane=true:NoSchedule"

# Cluster network for NFS exports
cluster_subnet: "10.21.0.0/16"

# NFS Configuration
# When using k3s-storage node, this will be set dynamically
# Otherwise, configure your external NFS server here
nfs_server: "{{ hostvars[groups['storage'][0]]['ansible_host'] if 'storage' in groups and groups['storage']|length > 0 else '10.0.0.30' }}"
nfs_path: "/srv/nfs/k3s-storage"
nfs_storage_class_name: "nfs-client"
nfs_provisioner_namespace: "nfs-provisioner"

# Fast scratch storage
scratch_storage_class_name: "fast-scratch"
scratch_path: "/mnt/nvme/scratch"

# GPU Configuration
gpu_operator_version: "v25.10.0"
gpu_operator_namespace: "gpu-operator"
# K3s containerd socket (needed for NVIDIA toolkit to signal containerd)
k3s_containerd_socket: "/run/k3s/containerd/containerd.sock"

# Helm repositories
helm_repos:
  - name: nvidia
    url: https://nvidia.github.io/gpu-operator
  - name: nfs-subdir-external-provisioner
    url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  - name: rancher-stable
    url: https://releases.rancher.com/server-charts/stable
  - name: jetstack
    url: https://charts.jetstack.io
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx

# Rancher configuration
rancher_hostname: "rancher.dshl.unileoben.ac.at"  # Assumption: set DNS to a control-plane IP
rancher_version: ""  # Leave empty to install the latest compatible Rancher chart for your Kubernetes version
rancher_replicas: 3
# Randomly generated per-run rather than a fixed default; override with
# -e rancher_bootstrap_password=... if you need a known value (e.g. to match
# what's already been set on a live cluster). Never commit a literal value here
# -- a hardcoded "admin" password lived here previously and was flagged as a
# live credential exposure, see docs/troubleshooting.md.
rancher_bootstrap_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=24') }}"

# Deploy ingress-nginx (Traefik disabled in K3s install)
install_ingress_nginx: true

# Rancher's OIDC (Authentik) AuthConfig is no longer bootstrapped from here.
# It previously lived in a rancher_oidc var block with a plaintext client_secret
# committed to git -- a live credential exposure, removed 2026-07-07 (see
# docs/troubleshooting.md and docs/rancher-authentik-sso-plan.md). The live
# genericoidc AuthConfig is now applied by hand post-bootstrap, with its
# client secret supplied out-of-band via kubectl, never stored in this repo.

# System settings
disable_swap: true
enable_ipv4_forward: true

# Packages to install
common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - nfs-common
  - open-iscsi
  - cryptsetup
  - dmsetup

gpu_worker_packages:
  - pciutils
  - linux-headers-generic
