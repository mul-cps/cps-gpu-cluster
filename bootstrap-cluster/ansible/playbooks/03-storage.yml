---
- name: Configure storage
  hosts: control_plane[0]
  become: yes
  gather_facts: yes

  tasks:
    - name: Create NFS provisioner namespace
      shell: |
        kubectl create namespace {{ nfs_provisioner_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install NFS Subdir External Provisioner
      shell: |
        helm upgrade --install nfs-subdir-external-provisioner \
          nfs-subdir-external-provisioner/nfs-subdir-external-provisioner \
          --namespace {{ nfs_provisioner_namespace }} \
          --set nfs.server={{ nfs_server }} \
          --set nfs.path={{ nfs_path }} \
          --set storageClass.name={{ nfs_storage_class_name }} \
          --set storageClass.defaultClass=true \
          --set storageClass.reclaimPolicy=Retain
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for NFS provisioner to be ready
      shell: |
        kubectl wait --for=condition=ready pod \
          -l app=nfs-subdir-external-provisioner \
          -n {{ nfs_provisioner_namespace }} \
          --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # local-path-provisioner (rancher.io/local-path) does NOT read the
    # StorageClass's `parameters.nodePath` as a filesystem path override on
    # its own -- it only provisions a volume at `nodePath` on a given node
    # if that exact path is also listed for that node (or for
    # DEFAULT_PATH_FOR_NON_LISTED_NODES) in the local-path-config ConfigMap
    # in kube-system. Without this task, the StorageClass silently exists
    # but every provision attempt fails with "config doesn't contain path
    # {{ scratch_path }} on node <name>" and every PVC/pod using
    # {{ scratch_storage_class_name }} hangs Pending forever (found
    # 2026-08-15 -- this exact gap took down all 5 CI runners for ~14h,
    # see cps-gpu-cluster issue/incident notes and splatograph#648).
    - name: Write local-path-config ConfigMap manifest ({{ scratch_path }} registered on every gpu_workers node, default path untouched for CP/other nodes)
      copy:
        dest: /tmp/local-path-config-cm.yaml
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: local-path-config
            namespace: kube-system
          data:
            config.json: |-
              {
                "nodePathMap":[
                {
                  "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                  "paths":["/var/lib/rancher/k3s/storage"]
                }{% for node in groups['gpu_workers'] %},
                {
                  "node":"{{ node }}",
                  "paths":["/var/lib/rancher/k3s/storage","{{ scratch_path }}"]
                }{% endfor %}

                ]
              }

    - name: Apply local-path-config ConfigMap
      shell: kubectl apply -f /tmp/local-path-config-cm.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: local_path_config_apply

    - name: Restart local-path-provisioner to pick up config if it changed
      shell: kubectl -n kube-system rollout restart deploy local-path-provisioner
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: "'configured' in local_path_config_apply.stdout"

    - name: Create fast-scratch StorageClass manifest
      copy:
        dest: /tmp/fast-scratch-sc.yaml
        content: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: {{ scratch_storage_class_name }}
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          reclaimPolicy: Delete
          parameters:
            nodePath: {{ scratch_path }}

    - name: Apply fast-scratch StorageClass
      shell: kubectl apply -f /tmp/fast-scratch-sc.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Verify StorageClasses
      shell: kubectl get sc
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: storage_classes

    - name: Display StorageClasses
      debug:
        var: storage_classes.stdout_lines

    - name: Create test PVC for NFS
      copy:
        dest: /tmp/test-pvc-nfs.yaml
        content: |
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: test-nfs-claim
            namespace: default
          spec:
            accessModes:
              - ReadWriteMany
            storageClassName: {{ nfs_storage_class_name }}
            resources:
              requests:
                storage: 1Gi

    - name: Apply test NFS PVC
      shell: kubectl apply -f /tmp/test-pvc-nfs.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for test PVC to be bound
      shell: kubectl get pvc test-nfs-claim -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: pvc_status
      until: pvc_status.stdout == "Bound"
      retries: 20
      delay: 5

    - name: Clean up test PVC
      shell: kubectl delete pvc test-nfs-claim
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Storage configuration complete
      debug:
        msg: |
          Storage configured successfully!
          - Default StorageClass: {{ nfs_storage_class_name }} (NFS)
          - Fast scratch StorageClass: {{ scratch_storage_class_name }} (Local NVMe)
