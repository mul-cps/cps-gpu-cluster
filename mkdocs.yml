site_name: CPS GPU Cluster
site_description: GPU-enabled Kubernetes cluster for AI and JupyterHub workloads, managed via GitOps.
repo_url: https://github.com/mul-cps/cps-gpu-cluster
repo_name: mul-cps/cps-gpu-cluster
edit_uri: edit/main/docs/

# superpowers/ holds internal session specs/plans, not user-facing docs.
exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started.md
      - Deployment Checklist: deployment-checklist.md
      - Quick Reference: quick-reference.md
  - Provisioning:
      - Terraform SSH Setup: terraform-ssh-setup.md
      - SSH Key Setup: ssh-key-setup.md
      - QEMU Guest Agent Setup: qemu-guest-agent-setup.md
      - Maintenance VM: maintenance-vm.md
      - Storage Node: storage-node.md
  - Networking & Auth:
      - Network Configuration: network-configuration.md
      - Dex IdP Broker: dex-idp-broker.md
      - SOPS Secrets Migration: sops-secrets-migration.md
      - Rancher/Authentik SSO Plan: rancher-authentik-sso-plan.md
  - GPU:
      - GPU Passthrough: gpu-passthrough.md
      - GPU Scheduling Architecture: gpu-scheduling-architecture.md
  - JupyterHub:
      - Overview: jupyterhub-overview.md
      - Access & UI: jupyterhub-access-and-ui.md
      - OIDC Setup: jupyterhub-oidc-setup.md
      - SSH Access: jupyterhub-ssh-access.md
      - SFTP via Contents API: sftp-via-contents-api-scoping.md
  - Operations:
      - Troubleshooting: troubleshooting.md
      - Upgrade Path -- k3s 1.34 / DRA: upgrade-path-2026-k3s-1.34-dra.md
      - Upgrade Path -- ingress-nginx retirement: upgrade-path-ingress-nginx-retirement.md
  - Project:
      - History: project-history.md
      - Harvester Migration: harvester-migration.md
