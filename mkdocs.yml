site_name: CPS GPU Cluster
site_description: GPU-enabled Kubernetes cluster for AI and JupyterHub workloads, managed via GitOps.
repo_url: https://github.com/mul-cps/cps-gpu-cluster
repo_name: mul-cps/cps-gpu-cluster
edit_uri: edit/main/docs/

# superpowers/ holds internal session specs/plans, not user-facing docs.
exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# nav: intentionally omitted -- awesome-pages builds it from docs/'s folder
# structure plus each folder's .pages file (title + curated order for known
# pages; anything not explicitly listed still gets auto-appended), so new
# docs show up without editing this file.
plugins:
  - search
  - awesome-pages
  - mkdocs-jupyter:
      execute: false
      include_source: true
