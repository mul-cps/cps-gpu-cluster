apiVersion: v1
kind: PersistentVolume
metadata:
  name: cps-persistent1-shared-pv
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-client # or manual, keeping it simple
  mountOptions:
    - nfsvers=4.2
    - proto=tcp
    - hard
    - timeo=150
    - retrans=3
    - rsize=1048576
    - wsize=1048576
    - nconnect=4
    - noresvport
    - noatime
  nfs:
    path: /mnt/persistent1/cps_persistent1_shared
    server: 193.170.30.58

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cps-persistent1-shared-pvc
  namespace: jupyterhub
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Ti
  volumeName: cps-persistent1-shared-pv
