# Physical device accounting fixtures; utilization and VRAM are never allocation inputs.
tests:
- name: Physical reservation deducts one whole device despite idle CUDA and unused VRAM
  interval: 30s
  input_series:
  - &id001
    series: kube_node_status_capacity{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu1"}
    values: 2+0x6
  - &id002
    series: kube_node_status_condition{condition="Ready",status="true",job="kube-state-metrics",node="k3s-wk-gpu1"}
    values: 1+0x6
  - &id003
    series: kube_node_status_capacity{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu2"}
    values: 2+0x6
  - &id004
    series: kube_node_status_condition{condition="Ready",status="true",job="kube-state-metrics",node="k3s-wk-gpu2"}
    values: 1+0x6
  - &id005
    series: kube_node_status_capacity{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu3"}
    values: 2+0x6
  - &id006
    series: kube_node_status_condition{condition="Ready",status="true",job="kube-state-metrics",node="k3s-wk-gpu3"}
    values: 1+0x6
  - &id007
    series: kube_node_status_capacity{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu4"}
    values: 2+0x6
  - &id008
    series: kube_node_status_condition{condition="Ready",status="true",job="kube-state-metrics",node="k3s-wk-gpu4"}
    values: 1+0x6
  - &id009
    series: up{job="kube-state-metrics",namespace="cattle-monitoring-system"}
    values: 1+0x6
  - &id010
    series: kube_pod_container_resource_requests{resource="nvidia_com_gpu",job="kube-state-metrics",namespace="kai",pod="physical-reservation",uid="a",node="k3s-wk-gpu1",container="reservation"}
    values: 1+0x6
  - &id015
    series: kube_pod_status_phase{job="kube-state-metrics",namespace="kai",pod="physical-reservation",uid="a",phase="Running"}
    values: 1+0x6
  - &id016
    series: DCGM_FI_DEV_GPU_UTIL{UUID="gpu1"}
    values: 0+0x6
  - &id017
    series: DCGM_FI_DEV_FB_FREE{UUID="gpu1"}
    values: 81000+0x6
  - &id018
    series: kai_queue_allocated_gpus{queue_name="phd-interactive"}
    values: 0.2+0x6
  - &id011
    series: kube_node_status_allocatable{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu1"}
    values: 2+0x6
  - &id012
    series: kube_node_status_allocatable{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu2"}
    values: 2+0x6
  - &id013
    series: kube_node_status_allocatable{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu3"}
    values: 2+0x6
  - &id014
    series: kube_node_status_allocatable{resource="nvidia_com_gpu",job="kube-state-metrics",node="k3s-wk-gpu4"}
    values: 2+0x6
  promql_expr_test:
  - expr: cps:gpu_kubernetes_unallocated_devices
    eval_time: 3m
    exp_samples:
    - labels: cps:gpu_kubernetes_unallocated_devices{}
      value: 7
