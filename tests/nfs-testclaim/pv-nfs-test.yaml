apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-test-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - proto=tcp
    - port=2049
  nfs:
    server: 193.170.30.58
    path: /mnt/persistent1/cps_persistent1_shared
  persistentVolumeReclaimPolicy: Retain
