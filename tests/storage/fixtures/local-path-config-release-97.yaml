apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s/storage"]
        },
        {
          "node": "k3s-wk-gpu1",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu2",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu3",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        },
        {
          "node": "k3s-wk-gpu4",
          "paths": ["/var/lib/rancher/k3s/storage", "/mnt/nvme/scratch"]
        }
      ]
    }
