apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personal-argo-to-gateway
  namespace: cps-compute
spec:
  podSelector:
    matchLabels:
      app: compute-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - cps-argo-ui
          - cit-argo-ui
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personal-argo-native-assets
  namespace: cps-argo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cps-argo
      app.kubernetes.io/name: argo-workflows-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cps-compute
      podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - cps-argo-ui
          - cit-argo-ui
    ports:
    - protocol: TCP
      port: 2746
