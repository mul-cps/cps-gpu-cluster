apiVersion: v1
kind: ServiceAccount
metadata:
  name: cps-personal-argo-reader
  namespace: cps-argo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cps-personal-argo-reader
  namespace: cps-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cps-personal-argo-reader
  namespace: cps-workflows
subjects:
  - {kind: ServiceAccount, name: cps-personal-argo-reader, namespace: cps-argo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cps-personal-argo-reader}
