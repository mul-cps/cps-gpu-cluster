apiVersion: v1
kind: ConfigMap
metadata:
  name: personal-argo-registration
  namespace: jupyterhub
  labels:
    qualification.cps/owner: personal-argo-preparation
data:
  personal-argo.py: "# Appended service and default normal-user access; no admin API\
    \ role.\nfrom pathlib import Path\n_personal_name = 'cps-argo-ui'\nif any(s.get('name')\
    \ == _personal_name for s in c.JupyterHub.services):\n    raise RuntimeError('Dedicated\
    \ personal Argo service already configured')\nc.JupyterHub.services = list(c.JupyterHub.services)\
    \ + [{\n    'name': _personal_name,\n    'api_token': Path('/etc/personal-argo/oauth-client-secret').read_text().strip(),\n\
    \    'oauth_client_id': 'service-' + _personal_name,\n    'oauth_redirect_uri':\
    \ 'https://jupyterhub.dshl.unileoben.ac.at/argo/oauth_callback',\n    'oauth_client_allowed_scopes':\
    \ [],\n    'display': False,\n}]\n_personal_roles = [dict(role) for role in c.JupyterHub.load_roles]\n\
    _personal_user = next((role for role in _personal_roles if role.get('name') ==\
    \ 'user'), None)\nif _personal_user is None:\n    _personal_user = {'name': 'user',\
    \ 'scopes': ['self']}\n    _personal_roles.append(_personal_user)\n_personal_scope\
    \ = 'access:services!service=' + _personal_name\n_personal_user['scopes'] = list(dict.fromkeys([*_personal_user.get('scopes',\
    \ ['self']), _personal_scope]))\nc.JupyterHub.load_roles = _personal_roles\n"
---
