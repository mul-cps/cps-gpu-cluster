global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 30s
    timeout client 10m
    timeout server 10m

# Only an internal ClusterIP exposes this listener. TLS is re-encrypted to
# TrueNAS with CA and hostname verification across the encrypted mesh.
frontend artifacts
    bind :8333 ssl crt /tls/server.pem
    default_backend truenas

backend truenas
    server nas 100.65.233.45:8333 ssl verify required ca-file /trust/ca.crt sni str(truenas.local) verifyhost truenas.local check check-sni truenas.local

# SSH verifies the NAS host key end to end. The dedicated client key is
# restricted on TrueNAS to the workspace JSON dispatcher; no shell is exposed.
frontend workspace_control
    bind :8022
    default_backend truenas_workspace_control

backend truenas_workspace_control
    server nas 100.65.233.45:8022 check
