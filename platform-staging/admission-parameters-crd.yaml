# General compute admission parameters; unrelated to the disabled Moodle scaffold.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computeadmissionpolicies.compute.cps.unileoben.ac.at
spec:
  group: compute.cps.unileoben.ac.at
  scope: Namespaced
  names:
    plural: computeadmissionpolicies
    singular: computeadmissionpolicy
    kind: ComputeAdmissionPolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [data]
          properties:
            data:
              type: object
              required: [approved-images, executor-image, artifact-secret, artifact-ca-secret]
              additionalProperties: {type: string}
              x-kubernetes-validations:
                - rule: self.size() == 4
                  message: Only the four declared admission parameters are supported
