{{- if and .Values.enabled .Values.gateway.kubernetes.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cps-compute-controller
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cps-compute-storage-observer
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cps-compute-storage-observer
subjects:
  - {kind: ServiceAccount, name: cps-compute-controller, namespace: {{ .Values.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cps-compute-storage-observer}
{{- range $hub := list "jupyterhub" "cit-jhub" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cps-compute-workspace-storage
  namespace: {{ $hub }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cps-compute-workspace-storage
  namespace: {{ $hub }}
subjects:
  - {kind: ServiceAccount, name: cps-compute-controller, namespace: {{ $.Values.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cps-compute-workspace-storage}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cps-compute-distributed-launcher
  namespace: cps-workflows
rules:
  - apiGroups: [jobset.x-k8s.io]
    resources: [jobsets]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, delete]
  - apiGroups: [scheduling.run.ai]
    resources: [podgroups]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cps-compute-distributed-launcher
  namespace: cps-workflows
subjects:
  - {kind: ServiceAccount, name: cps-compute-controller, namespace: {{ .Values.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cps-compute-distributed-launcher}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cps-compute-retained-storage
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [persistentvolumes]
  matchConditions:
    - name: controller-only
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Values.namespace }}:cps-compute-controller'
  validations:
    - expression: >-
        object.metadata.name.matches('^cps-workspace-[a-f0-9]{40}$') &&
        has(object.spec.nfs) && object.spec.nfs.server == '193.170.30.58' &&
        object.spec.nfs.path.matches('^/mnt/persistent1/(cps_persistent1_shared/compute|cps_compute_workspaces)/(cps|cit)/[a-f0-9]{64}$') &&
        object.spec.persistentVolumeReclaimPolicy == 'Retain' &&
        (!has(object.spec.storageClassName) || object.spec.storageClassName == '') &&
        object.spec.accessModes == ['ReadWriteMany'] &&
        has(object.spec.claimRef) && object.spec.claimRef.name == object.metadata.name &&
        object.spec.claimRef.namespace in ['jupyterhub', 'cit-jhub'] &&
        (object.spec.nfs.path.matches('/cps/[a-f0-9]{64}$') ? object.spec.claimRef.namespace == 'jupyterhub' : object.spec.claimRef.namespace == 'cit-jhub')
      message: Compute controller may create only retained, source-bound NFS workspace volumes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cps-compute-retained-storage
spec:
  policyName: cps-compute-retained-storage
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cps-compute-bound-workspace-claim
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [persistentvolumeclaims]
  matchConditions:
    - name: controller-only
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Values.namespace }}:cps-compute-controller'
  validations:
    - expression: >-
        request.namespace in ['jupyterhub', 'cit-jhub'] &&
        object.metadata.name.matches('^cps-workspace-[a-f0-9]{40}$') &&
        object.spec.volumeName == object.metadata.name &&
        object.spec.storageClassName == '' && object.spec.accessModes == ['ReadWriteMany'] &&
        !has(object.spec.dataSource) && !has(object.spec.dataSourceRef) && !has(object.spec.selector)
      message: Compute controller may create only explicitly bound retained workspace claims
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cps-compute-bound-workspace-claim
spec:
  policyName: cps-compute-bound-workspace-claim
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cps-compute-archive-verifier
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [jobs]
  matchConditions:
    - name: controller-only
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Values.namespace }}:cps-compute-controller'
  variables:
    - {name: pod, expression: object.spec.template.spec}
  validations:
    - expression: >-
        request.namespace in ['jupyterhub', 'cit-jhub'] &&
        object.metadata.name.matches('^cps-archive-verify-[a-f0-9]{16}$') &&
        object.spec.backoffLimit == 0 && object.spec.activeDeadlineSeconds <= 300 &&
        variables.pod.restartPolicy == 'Never' &&
        has(variables.pod.automountServiceAccountToken) && !variables.pod.automountServiceAccountToken &&
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == 'default') &&
        size(variables.pod.containers) == 1 && size(variables.pod.volumes) == 1 &&
        variables.pod.containers[0].name == 'verify' &&
        variables.pod.containers[0].image == '{{ default .Values.gateway.image .Values.gateway.storageVerificationImage }}' &&
        !has(variables.pod.containers[0].envFrom) && !has(variables.pod.containers[0].env) &&
        has(variables.pod.containers[0].securityContext) &&
        variables.pod.containers[0].securityContext.runAsUser == 1000 &&
        variables.pod.containers[0].securityContext.allowPrivilegeEscalation == false &&
        (!has(variables.pod.containers[0].securityContext.privileged) || !variables.pod.containers[0].securityContext.privileged) &&
        variables.pod.containers[0].securityContext.capabilities.drop == ['ALL'] &&
        (!has(variables.pod.containers[0].securityContext.capabilities.add) || size(variables.pod.containers[0].securityContext.capabilities.add) == 0) &&
        size(variables.pod.containers[0].volumeMounts) == 1 &&
        variables.pod.containers[0].volumeMounts[0].name == 'workspace' &&
        variables.pod.containers[0].volumeMounts[0].mountPath == '/workspace' &&
        variables.pod.volumes[0].name == 'workspace' &&
        has(variables.pod.volumes[0].persistentVolumeClaim) &&
        variables.pod.volumes[0].persistentVolumeClaim.claimName.matches('^cps-workspace-[a-f0-9]{40}$')
      message: Compute controller may create only credential-free nonroot archive verification Jobs
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cps-compute-archive-verifier
spec:
  policyName: cps-compute-archive-verifier
  validationActions: [Deny]
{{- end }}
