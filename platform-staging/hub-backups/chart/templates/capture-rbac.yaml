{{- if and .Values.enabled .Values.roleCapture.enabled .Values.roleCapture.freshApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.owner }}-hub-backup-capture
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.owner }}-hub-backup-capture
  namespace: {{ .Values.namespace }}
rules:
{{- range $resource, $names := .Values.roleCapture.freshApi.resources }}
{{- if $names }}
  - apiGroups: [{{ if has $resource (list "deployments" "statefulsets") }}apps{{ else }}""{{ end }}]
    resources: [{{ $resource }}]
    resourceNames: {{ $names | toJson }}
    verbs: [get]
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.owner }}-hub-backup-capture
  namespace: {{ .Values.namespace }}
subjects:
  - {kind: ServiceAccount, name: {{ .Values.owner }}-hub-backup-capture, namespace: {{ .Values.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Values.owner }}-hub-backup-capture}
{{- end }}
