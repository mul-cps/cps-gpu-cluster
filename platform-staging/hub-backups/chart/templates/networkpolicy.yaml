{{- if .Values.enabled }}
{{- if empty .Values.databasePodLabels }}{{ fail "databasePodLabels must not be empty" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.owner }}-hub-postgresql-backup
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: {app: hub-postgresql-backup, owner: {{ .Values.owner }}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
{{ required "databasePodLabels required" .Values.databasePodLabels | toYaml | indent 14 }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
