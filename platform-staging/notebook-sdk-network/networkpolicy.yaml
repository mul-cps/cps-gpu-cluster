apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compute-sdk-gateway-egress
  namespace: jupyterhub
spec:
  podSelector:
    matchLabels:
      app: jupyterhub
      component: singleuser-server
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cps-compute
      podSelector:
        matchLabels:
          app: compute-gateway
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compute-sdk-gateway-egress
  namespace: cit-jhub
spec:
  podSelector:
    matchLabels:
      app: jupyterhub
      component: singleuser-server
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cps-compute
      podSelector:
        matchLabels:
          app: compute-gateway
    ports:
    - protocol: TCP
      port: 8000
