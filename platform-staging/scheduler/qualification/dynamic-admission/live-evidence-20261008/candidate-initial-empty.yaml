              properties:
                runaiNumOfGpus:
                  type: string
                cmUid:
                  type: string
                  pattern: ^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$
                physicalGpuMemoryMiB:
                  type: string
                  pattern: ^(?:[1-9][0-9]{0,4}|1[0-2][0-9]{4}|130[0-9]{3}|1310[0-6][0-9]|13107[0-2])$
                gpuPortion:
                  type: string
                  pattern: ^(?:0\.[0-9]{1,8}|1)$
                name:
                  type: string
                  pattern: ^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$
                  maxLength: 253
                namespace:
                  type: string
                  enum:
                  - cps-dynamic-admission-live-20261008
                type:
