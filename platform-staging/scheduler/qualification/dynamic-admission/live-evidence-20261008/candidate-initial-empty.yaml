                  pattern: ^(?:GPU-[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}|k8s\.device-plugin\.nvidia\.com/gpu=(?:GPU-[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}|(?:[0-9]|[12][0-9]|3[01])))$
                cudaDeviceMemoryLimit:
                  type: string
                  pattern: ^(?:[1-9][0-9]{0,3}|[1-3][0-9]{4}|40[0-8][0-9]{2}|409[0-5][0-9]|40960)m$
