      * double(variables.record.gpuPortion)) ? 1 : 0)) + ''m'')'
    message: The injected quota must match the reviewed bounded node-memory label
      and upstream float64 truncation
  - expression: (has(variables.subject.apiVersion)) && (variables.subject.apiVersion
      == 'v1') && (has(variables.subject.kind)) && (variables.subject.kind == 'ConfigMap')
      && (has(variables.subject.metadata)) && (has(variables.subject.metadata.name))
      && (variables.subject.metadata.name == variables.record.name) && (has(variables.subject.metadata.namespace))
      && (variables.subject.metadata.namespace == variables.record.namespace) && (variables.subject.metadata.namespace
      == request.namespace)
    message: The exact registered namespace/name is required
  - expression: (has(variables.subject.metadata)) && (has(variables.subject.metadata.ownerReferences))
      && (size(variables.subject.metadata.ownerReferences) == 1) && (variables.subject.metadata.ownerReferences.all(o,
      (has(o.apiVersion)) && (o.apiVersion == 'v1') && (has(o.kind)) && (o.kind ==
      'Pod') && (has(o.name)) && (o.name == variables.record.podName) && (has(o.uid))
      && (o.uid == variables.record.podUid) && (!has(o.controller) || !o.controller)
      && (!has(o.blockOwnerDeletion) || !o.blockOwnerDeletion)))
    message: Exactly the reviewed non-controller v1 Pod owner must remain attached
  - expression: '!has(variables.subject.binaryData) && !has(variables.subject.immutable)'
    message: Binary data and immutable quota ConfigMaps are outside the reviewed contract
  - expression: (variables.record.type == 'evar' && size(variables.data) == 0) ||
      (variables.record.type == 'capabilities' && variables.stage >= 0)
    message: Only the exact reviewed empty evar or staged capabilities values are
      permitted
  - expression: request.operation != 'CREATE' || (oldObject == null && size(variables.data)
      == 0 && !has(variables.record.cmUid))
    message: Creation begins empty and cannot recreate an already UID-bound map
  - expression: request.operation != 'UPDATE' || ((has(oldObject.metadata)) && (has(oldObject.metadata.uid))
      && (oldObject.metadata.uid.matches('^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$'))
      && (has(object.metadata)) && (has(object.metadata.uid)) && (object.metadata.uid
      == oldObject.metadata.uid) && (has(oldObject.metadata.name)) && (object.metadata.name
      == oldObject.metadata.name) && (has(oldObject.metadata.namespace)) && (object.metadata.namespace
      == oldObject.metadata.namespace) && (has(oldObject.metadata.ownerReferences))
      && (object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
      (!has(oldObject.binaryData)) && (!has(oldObject.immutable)) && (!has(variables.record.cmUid)
      || object.metadata.uid == variables.record.cmUid))
    message: Updates preserve the observed ConfigMap UID, name, namespace and exact
      owner references
  - expression: request.operation != 'UPDATE' || ((variables.record.type == 'evar'
      && size(variables.oldData) == 0) || (variables.record.type == 'capabilities'
      && variables.oldStage >= 0 && variables.stage >= variables.oldStage && variables.stage
      <= variables.oldStage + 1))
    message: Same-stage retries or one forward population step are allowed; reset,
      removal and skipped stages are denied
  - expression: request.operation != 'DELETE' || (has(oldObject.metadata) && has(oldObject.metadata.uid)
      && oldObject.metadata.uid.matches('^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
      && (!has(variables.record.cmUid) || oldObject.metadata.uid == variables.record.cmUid))
    message: Reviewed binder rollback uses the exact old Pod-owned ConfigMap and optional
      independently pinned ConfigMap UID
