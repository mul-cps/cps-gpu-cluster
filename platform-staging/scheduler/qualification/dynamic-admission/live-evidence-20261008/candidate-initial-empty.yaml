      - ''
      apiVersions:
      - v1
      resources:
      - configmaps
      operations:
      - CREATE
      - UPDATE
      - DELETE
      scope: Namespaced
  variables:
  - name: subject
    expression: 'request.operation == ''DELETE'' ? oldObject : object'
  - name: records
    expression: 'has(variables.subject.metadata) && has(variables.subject.metadata.name)
      ? params.records.filter(r, r.namespace == request.namespace && r.name == variables.subject.metadata.name)
      : []'
  - name: record
    expression: 'size(variables.records) == 1 ? variables.records[0] : {}'
  - name: data
    expression: 'has(variables.subject.data) ? variables.subject.data : {}'
  - name: oldData
    expression: 'has(oldObject.data) ? oldObject.data : {}'
  - name: stages
    expression: 'size(variables.records) == 1 ? [{}, {''NVIDIA_VISIBLE_DEVICES'':
      variables.record.visibleDevices}, {''NVIDIA_VISIBLE_DEVICES'': variables.record.visibleDevices,
      ''GPU_PORTION'': variables.record.gpuPortion, ''RUNAI_NUM_OF_GPUS'': variables.record.runaiNumOfGpus},
      {''NVIDIA_VISIBLE_DEVICES'': variables.record.visibleDevices, ''GPU_PORTION'':
      variables.record.gpuPortion, ''RUNAI_NUM_OF_GPUS'': variables.record.runaiNumOfGpus,
      ''CUDA_DEVICE_MEMORY_LIMIT'': variables.record.cudaDeviceMemoryLimit}] : [{},{},{},{}]'
  - name: stage
    expression: 'size(variables.data) == 0 ? 0 : variables.data == variables.stages[1]
      ? 1 : variables.data == variables.stages[2] ? 2 : variables.data == variables.stages[3]
      ? 3 : -1'
  - name: oldStage
    expression: '!has(oldObject.metadata) ? -1 : (size(variables.oldData) == 0 ? 0
      : variables.oldData == variables.stages[1] ? 1 : variables.oldData == variables.stages[2]
      ? 2 : variables.oldData == variables.stages[3] ? 3 : -1)'
  validations:
  - expression: request.namespace == "cps-dynamic-admission-live-20261008"
    message: Only the isolated qualification namespace is in scope
  - expression: request.operation in ['CREATE','UPDATE','DELETE']
    message: Only the explicitly modelled ConfigMap operations are permitted
  - expression: has(request.userInfo) && has(request.userInfo.username) && request.userInfo.username
      in params.writers
    message: Every ConfigMap mutation requires an explicitly reviewed authenticated
      writer
  - expression: size(variables.records) == 1 && has(variables.record.name)
    message: Every ConfigMap name requires an explicit reviewed record; labels cannot
      authorize writes
  - expression: '(has(variables.record.physicalGpuMemoryMiB)) && (variables.record.physicalGpuMemoryMiB.matches(''^(?:[1-9][0-9]{0,4}|1[0-2][0-9]{4}|130[0-9]{3}|1310[0-6][0-9]|13107[0-2])$''))
