name: Notebook egress policy

on:
  pull_request:
    paths:
      - 'cluster-maintenance/clusters/cit-cps-gpu/user/jupyter/jupyterhub/values.yaml'
      - 'tests/test_notebook_nfs_egress.py'
      - '.github/workflows/notebook-egress.yml'
  push:
    paths:
      - 'cluster-maintenance/clusters/cit-cps-gpu/user/jupyter/jupyterhub/values.yaml'
      - 'tests/test_notebook_nfs_egress.py'
      - '.github/workflows/notebook-egress.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned render dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/notebook-egress-venv"
          "$RUNNER_TEMP/notebook-egress-venv/bin/python" -m pip install PyYAML==6.0.3
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/helm.tar.gz"
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/notebook-egress-bin"
          cp "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/notebook-egress-bin/helm"
      - name: Render exact chart and verify egress semantics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://jupyterhub.github.io/helm-chart/jupyterhub-4.4.2.tgz -o "$RUNNER_TEMP/jupyterhub-4.4.2.tgz"
          echo "0ddfa517050d16f2e1b50c62b5b6377b12574f9a2b88f3b352bd211ef3173c3e  $RUNNER_TEMP/jupyterhub-4.4.2.tgz" | sha256sum --check
          export PATH="$RUNNER_TEMP/notebook-egress-bin:$PATH"
          export JUPYTERHUB_CHART="$RUNNER_TEMP/jupyterhub-4.4.2.tgz"
          PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/notebook-egress-venv/bin/python" -m unittest discover -s tests -p test_notebook_nfs_egress.py
