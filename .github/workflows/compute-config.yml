name: Compute deployment configuration
on:
  pull_request:
    paths: ['platform-staging/**', 'cluster-maintenance/**', 'compute-policy/**', 'scripts/compute-platform/**', 'tests/**', '.github/workflows/compute-config.yml']
  push:
    paths: ['platform-staging/**', 'cluster-maintenance/**', 'compute-policy/**', 'scripts/compute-platform/**', 'tests/**', '.github/workflows/compute-config.yml']
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: {version: v3.18.6}
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Install manifest check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install checksum-pinned PromQL verifier
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/prometheus-3.5.0.linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            --output "$archive"
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" prometheus-3.5.0.linux-amd64/promtool
          echo "CPS_PROMTOOL=$RUNNER_TEMP/prometheus-3.5.0.linux-amd64/promtool" >> "$GITHUB_ENV"
      - name: Render and verify pinned deployment candidates
        run: scripts/compute-platform/verify-config.sh
