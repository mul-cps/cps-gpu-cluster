name: Compute deployment configuration
on:
  pull_request:
    paths: ['platform-staging/**', 'cluster-maintenance/**', 'compute-policy/**', 'scripts/compute-platform/**', 'tests/**', '.github/workflows/compute-config.yml']
  push:
    paths: ['platform-staging/**', 'cluster-maintenance/**', 'compute-policy/**', 'scripts/compute-platform/**', 'tests/**', '.github/workflows/compute-config.yml']
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: {version: v3.18.6}
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Install manifest check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Render and verify pinned deployment candidates
        run: scripts/compute-platform/verify-config.sh
