name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Runs on the in-cluster self-hosted runner (org-level cit-cps-gpu scale
# set). containerMode: kubernetes requires every job to declare an
# explicit container: image -- there is no bare execution environment.
jobs:
  build-docs:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    container:
      image: python:3.12
    steps:
      - uses: actions/checkout@v4

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    container:
      image: ubuntu:24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
